<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>RDZ – Procédures</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --rdz-dark:#2d2d2d;
  --rdz-red:#CC2229;
  --rdz-red2:#9E1A1F;
  --rdz-light:#f4f4f4;
  --rdz-white:#ffffff;
  --rdz-border:#e0e0e0;
  --rdz-text:#222;
  --rdz-muted:#777;
  --rdz-step-bg:#3a3a3a;
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--rdz-light);color:var(--rdz-text);font-size:15px}
.header{background:var(--rdz-dark);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,0.4)}
.header img{width:38px;height:38px;object-fit:contain;border-radius:50%}
.header-info h1{font-size:15px;font-weight:700;color:#fff}
.header-info p{font-size:11px;color:#aaa;margin-top:1px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.save-dot{width:8px;height:8px;border-radius:50%;background:#4caf50;flex-shrink:0}
.save-dot.dirty{background:#ff9800}
.tabs{display:flex;background:var(--rdz-dark);border-top:1px solid #444}
.tab{flex:1;padding:11px 4px;font-size:12px;font-weight:700;text-align:center;cursor:pointer;color:#999;border-bottom:3px solid transparent;transition:all 0.15s;letter-spacing:0.04em;text-transform:uppercase;user-select:none}
.tab.active{color:#fff;border-bottom-color:var(--rdz-red)}
.tab-count{display:inline-block;background:var(--rdz-red);color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;margin-left:3px;vertical-align:middle}
.view{display:none;padding:12px;padding-bottom:90px}
.view.active{display:block}
.card{background:var(--rdz-white);border-radius:10px;border:1px solid var(--rdz-border);padding:14px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;color:var(--rdz-muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:12px;color:var(--rdz-muted);margin-bottom:5px;font-weight:500}
input[type=text],textarea{width:100%;padding:10px 12px;border:1px solid var(--rdz-border);border-radius:8px;font-size:14px;font-family:inherit;background:#fafafa;color:var(--rdz-text);outline:none;transition:border 0.15s}
input[type=text]:focus,textarea:focus{border-color:var(--rdz-red);background:#fff}
textarea{resize:vertical;min-height:75px}
input[type=file]{display:none}
.step-card{background:var(--rdz-white);border-radius:12px;border:1px solid var(--rdz-border);margin-bottom:8px;overflow:hidden}
.step-header{background:var(--rdz-step-bg);padding:10px 14px;display:flex;align-items:center;gap:10px}
.step-badge{width:28px;height:28px;border-radius:50%;background:var(--rdz-red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.step-label{flex:1;color:#fff;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-btns{display:flex;gap:4px}
.hdr-btn{background:rgba(255,255,255,0.1);border:none;color:#ddd;border-radius:6px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:background 0.1s;flex-shrink:0}
.hdr-btn:hover{background:rgba(255,255,255,0.22)}
.hdr-btn.del:hover{background:rgba(204,34,41,0.6)}
.hdr-btn:disabled{opacity:0.2;cursor:default}
.step-body{padding:14px}
.step-textarea{width:100%;padding:10px 12px;border:1px solid var(--rdz-border);border-radius:8px;font-size:14px;font-family:inherit;background:#fafafa;color:var(--rdz-text);resize:vertical;min-height:80px;outline:none;transition:border 0.15s}
.step-textarea:focus{border-color:var(--rdz-red);background:#fff}
.photos-section{margin-top:12px}
.photos-label{font-size:12px;color:var(--rdz-muted);margin-bottom:8px;font-weight:500}
.photos-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
.photo-box{position:relative;width:82px;height:82px;border-radius:8px;overflow:hidden;border:1px solid var(--rdz-border);flex-shrink:0}
.photo-box img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:3px;right:3px;background:rgba(0,0,0,0.65);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700}
.add-photo{width:82px;height:82px;border:2px dashed var(--rdz-border);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:#fafafa;color:var(--rdz-muted);font-size:11px;gap:5px;transition:all 0.15s;flex-shrink:0;text-align:center;line-height:1.3}
.add-photo:hover,.add-photo:active{border-color:var(--rdz-red);color:var(--rdz-red);background:#fff5f5}
.add-photo .cam{font-size:24px}
.move-row{display:flex;gap:6px;margin-top:10px}
.move-btn{flex:1;padding:8px;border:1px solid var(--rdz-border);border-radius:8px;background:#fafafa;cursor:pointer;font-size:12px;color:var(--rdz-muted);font-family:inherit;transition:all 0.1s}
.move-btn:hover{background:var(--rdz-dark);color:#fff;border-color:var(--rdz-dark)}
.insert-zone{display:flex;align-items:center;margin:2px 0;gap:8px;opacity:0;transition:opacity 0.2s}
.insert-zone:hover{opacity:1}
.insert-line{flex:1;height:1px;background:var(--rdz-border)}
.insert-btn-small{background:none;border:1px dashed var(--rdz-red);color:var(--rdz-red);border-radius:20px;font-size:11px;padding:3px 12px;cursor:pointer;white-space:nowrap;font-family:inherit}
.add-step-main{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:none;border:2px dashed var(--rdz-red);border-radius:12px;cursor:pointer;font-size:14px;color:var(--rdz-red);font-weight:700;font-family:inherit;transition:background 0.1s;margin-top:6px}
.add-step-main:hover,.add-step-main:active{background:#fff0f0}
.empty{text-align:center;padding:48px 20px}
.empty .empty-icon{font-size:48px;margin-bottom:12px;display:block}
.empty p{font-size:14px;color:var(--rdz-muted);line-height:1.6}
.preview-card{background:var(--rdz-white);border-radius:12px;border:1px solid var(--rdz-border);overflow:hidden;margin-bottom:14px}
.preview-header-rdz{background:var(--rdz-dark);padding:14px 16px;display:flex;align-items:center;gap:12px}
.preview-header-rdz img{width:36px;height:36px;object-fit:contain;border-radius:50%}
.preview-title{color:#fff;font-size:15px;font-weight:700}
.preview-meta{color:#aaa;font-size:11px;margin-top:2px}
.preview-body{padding:14px}
.preview-step-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f0f0f0;align-items:flex-start}
.preview-step-row:last-child{border-bottom:none;padding-bottom:0}
.preview-num{width:24px;height:24px;border-radius:50%;background:var(--rdz-red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;margin-top:1px}
.preview-desc{font-size:13px;flex:1;line-height:1.5}
.preview-photos{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.preview-photo{width:52px;height:52px;border-radius:6px;object-fit:cover;border:1px solid var(--rdz-border)}
.action-card{background:var(--rdz-white);border-radius:12px;border:1px solid var(--rdz-border);padding:16px;margin-bottom:12px}
.action-title{font-size:11px;font-weight:700;color:var(--rdz-muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:12px}
.btn-rdz{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.15s;margin-bottom:10px}
.btn-rdz:last-child{margin-bottom:0}
.btn-red{background:var(--rdz-red);color:#fff}
.btn-red:hover,.btn-red:active{background:var(--rdz-red2)}
.btn-dark{background:none;color:var(--rdz-dark);border:2px solid var(--rdz-dark)}
.btn-dark:hover,.btn-dark:active{background:var(--rdz-dark);color:#fff}
.hint{font-size:12px;color:var(--rdz-muted);text-align:center;line-height:1.6;margin-top:8px}
.confid{background:var(--rdz-dark);color:#666;font-size:10px;text-align:center;padding:7px;letter-spacing:0.12em;text-transform:uppercase}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;transition:transform 0.25s;z-index:9999;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>

  <div class="header-info">
    <h1>RDZ Procédures</h1>
    <p id="hdr-sub">Nouvelle procédure</p>
  </div>
  <div class="header-right">
    <div class="save-dot" id="save-dot"></div>
  </div>
</div>

<div class="tabs">
  <div class="tab active" id="tab-infos" onclick="switchTab('infos')">Infos</div>
  <div class="tab" id="tab-etapes" onclick="switchTab('etapes')">Étapes<span class="tab-count" id="step-count" style="display:none">0</span></div>
  <div class="tab" id="tab-export" onclick="switchTab('export')">Exporter</div>
</div>

<div class="view active" id="view-infos">
  <div class="card">
    <div class="card-title">Informations générales</div>
    <div class="field"><label>Titre *</label><input type="text" id="f-title" placeholder="Ex : Changement de filtre A3" oninput="onInfo()"></div>
    <div class="field"><label>Référence</label><input type="text" id="f-ref" placeholder="Ex : S.01 – PROC-2026-042" oninput="onInfo()"></div>
    <div class="field"><label>Site / Zone</label><input type="text" id="f-site" placeholder="Ex : IHEID – MDP, Bâtiment A" oninput="onInfo()"></div>
    <div class="field"><label>Rédigé par</label><input type="text" id="f-author" placeholder="Votre nom" oninput="onInfo()"></div>
    <div class="field"><label>Description / Contexte</label><textarea id="f-desc" placeholder="Objectif de la procédure..." oninput="onInfo()"></textarea></div>
    <div class="field"><label>Date</label><input type="text" id="f-date" oninput="onInfo()"></div>
  </div>
  <div class="confid">Ce document est strictement confidentiel — RDZ Security Management</div>
</div>

<div class="view" id="view-etapes">
  <div id="steps-container"></div>
  <button class="add-step-main" onclick="addStep()">＋ &nbsp;Ajouter une étape</button>
</div>

<div class="view" id="view-export">
  <div id="preview-container"></div>
  <div class="action-card">
    <div class="action-title">Exporter</div>
    <button class="btn-rdz btn-red" onclick="doExport()">⬇ &nbsp;Télécharger JSON</button>
    <button class="btn-rdz btn-dark" onclick="doShare()">↗ &nbsp;Partager (Teams / Email…)</button>
    <p class="hint">Sur mobile, « Partager » ouvre Teams, Outlook, WhatsApp…</p>
  </div>
  <div class="confid">CONFIDENTIEL — RDZ Security Management</div>
</div>

<input type="file" id="photo-input" accept="image/*" multiple onchange="handlePhotos(event)">
<div class="toast" id="toast"></div>

<script>
var STORE = 'rdz_v3';
var steps = [];
var nextId = 1;
var photoTarget = null;

function gv(id){ var e=document.getElementById(id); return e?e.value:''; }
function sv(id,v){ var e=document.getElementById(id); if(e) e.value=v||''; }

// SAVE / LOAD
var saveTimer;
function scheduleSave(){ clearTimeout(saveTimer); setDot(true); saveTimer=setTimeout(doSave,900); }
function setDot(dirty){ var d=document.getElementById('save-dot'); if(d) d.className='save-dot'+(dirty?' dirty':''); }
function doSave(){
  try{
    localStorage.setItem(STORE, JSON.stringify({
      title:gv('f-title'),ref:gv('f-ref'),site:gv('f-site'),
      author:gv('f-author'),desc:gv('f-desc'),date:gv('f-date'),
      steps:steps, nextId:nextId
    }));
  }catch(e){}
  setDot(false);
}
function doLoad(){
  try{
    var d=JSON.parse(localStorage.getItem(STORE)||'null');
    if(!d) return;
    sv('f-title',d.title); sv('f-ref',d.ref); sv('f-site',d.site);
    sv('f-author',d.author); sv('f-desc',d.desc); sv('f-date',d.date);
    steps=d.steps||[];
    nextId=d.nextId||steps.length+1;
    updateHdr();
    renderSteps();
  }catch(e){}
}

// TABS
function switchTab(tab){
  var tabs=['infos','etapes','export'];
  for(var i=0;i<tabs.length;i++){
    var t=tabs[i];
    var te=document.getElementById('tab-'+t);
    var ve=document.getElementById('view-'+t);
    if(te) te.className='tab'+(t===tab?' active':'');
    if(ve) ve.className='view'+(t===tab?' active':'');
  }
  if(tab==='export') renderPreview();
}

// HEADER
function updateHdr(){
  var t=gv('f-title')||'Nouvelle procédure';
  var e=document.getElementById('hdr-sub'); if(e) e.textContent=t;
}
function onInfo(){ updateHdr(); scheduleSave(); }

// STEPS
function addStep(atIndex){
  var s={id:nextId++, desc:'', photos:[]};
  if(atIndex!==undefined) steps.splice(atIndex,0,s);
  else steps.push(s);
  renderSteps();
  scheduleSave();
  updateStepCount();
  setTimeout(function(){
    var idx=(atIndex!==undefined)?atIndex:steps.length-1;
    var cards=document.querySelectorAll('.step-card');
    if(cards[idx]){
      cards[idx].scrollIntoView({behavior:'smooth',block:'nearest'});
      var ta=cards[idx].querySelector('.step-textarea');
      if(ta) ta.focus();
    }
  },80);
}

function removeStep(id){
  if(steps.length===1){ if(!confirm('Supprimer cette étape ?')) return; }
  steps=steps.filter(function(s){ return s.id!==id; });
  renderSteps(); scheduleSave(); updateStepCount();
}

function moveStep(id,dir){
  var i=steps.findIndex(function(s){ return s.id===id; });
  if(i<0) return;
  if(dir===-1&&i===0) return;
  if(dir===1&&i===steps.length-1) return;
  var tmp=steps[i]; steps[i]=steps[i+dir]; steps[i+dir]=tmp;
  renderSteps(); scheduleSave();
}

function updateDesc(id,val){
  var s=steps.find(function(x){ return x.id===id; });
  if(s){ s.desc=val; scheduleSave(); }
  var lbl=document.getElementById('lbl-'+id);
  if(lbl) lbl.textContent=val.length>38?val.substring(0,38)+'…':val||'Étape';
}

function updateStepCount(){
  var b=document.getElementById('step-count');
  if(!b) return;
  b.textContent=steps.length;
  b.style.display=steps.length>0?'':'none';
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderSteps(){
  var c=document.getElementById('steps-container');
  updateStepCount();
  if(!steps.length){
    c.innerHTML='<div class="empty"><span class="empty-icon">📋</span><p>Aucune étape.<br>Appuyez sur le bouton ci-dessous.</p></div>';
    return;
  }
  var html='';
  for(var i=0;i<steps.length;i++){
    var s=steps[i];
    var label=s.desc?(s.desc.length>38?s.desc.substring(0,38)+'…':s.desc):'Étape '+(i+1);
    var sid=s.id;
    var photosHtml='';
    for(var pi=0;pi<s.photos.length;pi++){
      photosHtml+='<div class="photo-box"><img src="'+s.photos[pi]+'" alt="photo"><button class="photo-del" onclick="removePhoto('+sid+','+pi+')">✕</button></div>';
    }
    var addPhotoHtml='';
    if(s.photos.length<3){
      addPhotoHtml='<div class="add-photo" onclick="openPhoto('+sid+')"><span class="cam">📷</span>Ajouter<br>('+s.photos.length+'/3)</div>';
    } else {
      addPhotoHtml='<div style="font-size:11px;color:#bbb;align-self:center">✓ 3 photos max</div>';
    }
    var moveHtml='<div class="move-row">';
    if(i>0) moveHtml+='<button class="move-btn" onclick="moveStep('+sid+',-1)">↑ Monter</button>';
    if(i<steps.length-1) moveHtml+='<button class="move-btn" onclick="moveStep('+sid+',1)">↓ Descendre</button>';
    moveHtml+='</div>';

    html+='<div class="insert-zone"><div class="insert-line"></div><button class="insert-btn-small" onclick="addStep('+i+')">+ Insérer ici</button><div class="insert-line"></div></div>';
    html+='<div class="step-card">';
    html+='<div class="step-header"><div class="step-badge">'+(i+1)+'</div><div class="step-label" id="lbl-'+sid+'">'+esc(label)+'</div>';
    html+='<div class="step-btns">';
    html+='<button class="hdr-btn" onclick="moveStep('+sid+',-1)" '+(i===0?'disabled':'')+'>↑</button>';
    html+='<button class="hdr-btn" onclick="moveStep('+sid+',1)" '+(i===steps.length-1?'disabled':'')+'>↓</button>';
    html+='<button class="hdr-btn del" onclick="removeStep('+sid+')">✕</button>';
    html+='</div></div>';
    html+='<div class="step-body">';
    html+='<textarea class="step-textarea" placeholder="Décrivez cette étape..." oninput="updateDesc('+sid+',this.value)">'+esc(s.desc)+'</textarea>';
    html+='<div class="photos-section"><div class="photos-label">Photos</div>';
    html+='<div class="photos-row">'+photosHtml+addPhotoHtml+'</div></div>';
    html+=moveHtml;
    html+='</div></div>';
  }
  html+='<div class="insert-zone"><div class="insert-line"></div><button class="insert-btn-small" onclick="addStep('+steps.length+')">+ Ajouter à la fin</button><div class="insert-line"></div></div>';
  c.innerHTML=html;
}

// PHOTOS
function openPhoto(stepId){
  photoTarget=stepId;
  var inp=document.getElementById('photo-input');
  inp.value='';
  inp.click();
}
function handlePhotos(e){
  if(!photoTarget) return;
  var s=steps.find(function(x){ return x.id===photoTarget; });
  if(!s) return;
  var files=Array.from(e.target.files);
  var room=3-s.photos.length;
  var toLoad=files.slice(0,room);
  if(!toLoad.length) return;
  var done=0;
  toLoad.forEach(function(f){
    var r=new FileReader();
    r.onload=function(ev){
      s.photos.push(ev.target.result);
      done++;
      if(done===toLoad.length){ renderSteps(); scheduleSave(); }
    };
    r.readAsDataURL(f);
  });
}
function removePhoto(stepId,idx){
  var s=steps.find(function(x){ return x.id===stepId; });
  if(s){ s.photos.splice(idx,1); renderSteps(); scheduleSave(); }
}

// PREVIEW
function renderPreview(){
  var c=document.getElementById('preview-container');
  var title=gv('f-title')||'Sans titre';
  var ref=gv('f-ref'), site=gv('f-site'), author=gv('f-author');
  var date=gv('f-date')||new Date().toLocaleDateString('fr-FR');
  var desc=gv('f-desc');
  var logoSrc=document.querySelector('.header img').src;
  var meta=[ref,site,author?'Par '+author:'',date].filter(Boolean).join(' · ');
  var stepsHtml='';
  if(!steps.length){
    stepsHtml='<p style="color:#bbb;font-size:13px;text-align:center;padding:12px">Aucune étape</p>';
  } else {
    for(var i=0;i<steps.length;i++){
      var s=steps[i];
      var ph='';
      if(s.photos.length){
        ph='<div class="preview-photos">';
        for(var pi=0;pi<s.photos.length;pi++) ph+='<img class="preview-photo" src="'+s.photos[pi]+'">';
        ph+='</div>';
      }
      stepsHtml+='<div class="preview-step-row"><div class="preview-num">'+(i+1)+'</div><div><div class="preview-desc">'+esc(s.desc||'')+'</div>'+ph+'</div></div>';
    }
  }
  c.innerHTML='<div class="preview-card"><div class="preview-header-rdz"><img src="'+logoSrc+'" alt="RDZ"><div><div class="preview-title">'+esc(title)+'</div><div class="preview-meta">'+esc(meta)+'</div></div></div>'+(desc?'<div style="padding:10px 14px 0;font-size:12px;color:#888;font-style:italic">'+esc(desc)+'</div>':'')+'<div class="preview-body">'+stepsHtml+'</div><div class="confid">CONFIDENTIEL</div></div>';
}

// EXPORT
function buildData(){
  var stepsOut=[];
  for(var i=0;i<steps.length;i++){
    stepsOut.push({number:i+1,description:steps[i].desc,photos:steps[i].photos});
  }
  return {
    schema:'rdz-procedure-v1',
    generated:new Date().toISOString(),
    procedure:{
      title:gv('f-title')||'Sans titre',
      ref:gv('f-ref'), site:gv('f-site'), author:gv('f-author'),
      description:gv('f-desc'),
      date:gv('f-date')||new Date().toLocaleDateString('fr-FR'),
      steps:stepsOut
    }
  };
}
function doExport(){
  var data=buildData();
  var json=JSON.stringify(data,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var slug=(data.procedure.title).replace(/[^a-zA-Z0-9]/g,'_').substring(0,30);
  a.href=url; a.download='RDZ_'+slug+'_'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ Fichier téléchargé !');
}
async function doShare(){
  var data=buildData();
  var json=JSON.stringify(data,null,2);
  var slug=(data.procedure.title).replace(/[^a-zA-Z0-9]/g,'_').substring(0,30);
  var filename='RDZ_'+slug+'_'+new Date().toISOString().slice(0,10)+'.json';
  var file=new File([new Blob([json])],filename,{type:'application/json'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file],title:data.procedure.title}); return; }
    catch(e){ if(e.name!=='AbortError') doExport(); return; }
  }
  doExport();
  showToast('Fichier téléchargé — partagez-le dans Teams');
}

function showToast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); },3000);
}

// INIT
doLoad();
if(!steps.length) addStep();
if(!gv('f-date')) sv('f-date',new Date().toLocaleDateString('fr-FR'));
updateHdr();
</script>
