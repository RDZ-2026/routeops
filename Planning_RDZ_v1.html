<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning — RDZ Security Management</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c0272d;--accent-hover:#a31f24;--anthracite:#2d2d2d;
  --bg:#f5f4f2;--bg2:#eeecea;--white:#fff;
  --border:#e2e0dd;--border2:#d0cec9;
  --text:#1a1917;--text2:#5a5753;--text3:#9a9794;
  --green:#16a34a;--green-l:#f0fdf4;
  --orange:#d97706;--orange-l:#fffbeb;
  --blue:#2563eb;--blue-l:#eff6ff;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;}
button,input,select,textarea{font-family:inherit;font-size:inherit;}
a{color:var(--red);}

/* ── LOGIN ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--white);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:380px;overflow:hidden;}
.login-head{background:var(--red);padding:28px;color:#fff;text-align:center;}
.login-logo{width:44px;height:44px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:-1px;margin:0 auto 12px;}
.login-title{font-family:'DM Serif Display';font-size:22px;}
.login-sub{font-size:12px;opacity:.8;margin-top:2px;}
.login-body{padding:26px 28px 28px;}
.fg{margin-bottom:14px;}
.flabel{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;}
.finp,.fsel,.ftxt{width:100%;padding:11px 13px;border:1.5px solid var(--border2);border-radius:9px;background:#fff;color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s;}
.finp:focus,.fsel:focus,.ftxt:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(192,39,45,.08);}
.btn{padding:10px 16px;border-radius:9px;border:none;font-weight:600;font-size:13.5px;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-primary:disabled{background:var(--border2);cursor:not-allowed;}
.btn-ghost{background:var(--bg2);color:var(--text2);}
.btn-ghost:hover{background:var(--border);}
.btn-success{background:var(--green);color:#fff;}
.btn-danger{background:#fef2f2;color:#b91c1c;}
.btn-danger:hover{background:#fee2e2;}
.btn-sm{padding:6px 11px;font-size:12px;}
.btn-block{width:100%;justify-content:center;}
.login-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px;display:none;}

/* ── APP SHELL (sidebar layout) ── */
#app{display:none;min-height:100vh;flex-direction:row;}
.sidebar{background:var(--red);width:220px;flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:200;}
.sidebar-brand{display:flex;align-items:center;gap:9px;color:#fff;padding:16px 16px 14px;}
.sidebar-logo{width:28px;height:28px;background:rgba(255,255,255,.2);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;letter-spacing:-1px;flex-shrink:0;}
.sidebar-title{font-family:'DM Serif Display';font-size:16px;line-height:1;}
.sidebar-sub{font-size:9.5px;opacity:.75;text-transform:uppercase;letter-spacing:.5px;}
.sidebar-nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto;padding:4px 10px;}
.snav-btn{background:transparent;color:rgba(255,255,255,.85);border:none;padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;text-align:left;white-space:nowrap;transition:all .15s;}
.snav-btn:hover{background:rgba(255,255,255,.16);}
.snav-btn.active{background:#fff;color:var(--red);}
.sidebar-foot{padding:12px 10px 16px;display:flex;flex-direction:column;gap:8px;}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex-shrink:0;}
.sync-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:#fff;font-size:11.5px;padding:5px 10px;border-radius:20px;cursor:default;}
.user-pill{background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;width:100%;}
.user-pill:hover{background:rgba(255,255,255,.25);}
.sidebar-toggle{display:none;position:fixed;top:12px;left:12px;z-index:210;background:var(--red);color:#fff;border:none;width:38px;height:38px;border-radius:9px;font-size:17px;cursor:pointer;box-shadow:var(--shadow);}
.sidebar-scrim{display:none;}

.app-main{flex:1;min-width:0;display:flex;flex-direction:column;}
.content{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto;}
.panel{display:none;}
.panel.active{display:block;}

.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap;}
.ph-title{font-family:'DM Serif Display';font-size:22px;}
.ph-sub{font-size:12.5px;color:var(--text3);margin-top:2px;}
.ph-right{display:flex;gap:8px;flex-wrap:wrap;}

.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .15s;position:relative;}
.kpi:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:var(--shadow);}
.kpi-val{font-family:'DM Serif Display';font-size:26px;line-height:1;}
.kpi-label{font-size:12px;font-weight:600;color:var(--text2);margin-top:6px;}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.kpi.neutral .kpi-val{color:var(--anthracite);}
.kpi.green .kpi-val{color:var(--green);}
.kpi.blue .kpi-val{color:var(--blue);}
.kpi.red .kpi-val{color:var(--red);}
.kpi.orange .kpi-val{color:var(--orange);}

.sbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
.sw{position:relative;flex:1;min-width:180px;}
.sw-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text3);}
.sw .inp{width:100%;padding:9px 12px 9px 30px;border:1.5px solid var(--border2);border-radius:9px;background:#fff;}
.sel{padding:9px 12px;border:1.5px solid var(--border2);border-radius:9px;background:#fff;color:var(--text);}
.count{font-size:11.5px;color:var(--text3);margin:2px 0 10px;}

table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:8px 10px;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;border-bottom:2px solid var(--border);}
td{padding:8px 10px;border-bottom:1px solid #f0eeeb;font-size:12.5px;vertical-align:middle;}
.tbl-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge-green{background:var(--green-l);color:#15803d;}
.badge-orange{background:var(--orange-l);color:#b45309;}
.badge-red{background:#fef2f2;color:#b91c1c;}
.badge-blue{background:var(--blue-l);color:#1d4ed8;}
.badge-grey{background:var(--bg2);color:var(--text2);}

/* Agents & sites cards */
.agents-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.agent-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;}
.agent-card:hover{border-color:var(--red);box-shadow:var(--shadow);}
.agent-card .ac-name{font-weight:700;font-size:13px;}
.agent-card .ac-meta{font-size:10.5px;color:var(--text3);margin-top:2px;}
.agent-card .ac-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:6px;}
.agent-card .ac-passport{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap;}

.sites-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;}
.site-card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all .15s;}
.site-card:hover{border-color:var(--red);box-shadow:var(--shadow);}
.site-card .sc-name{font-weight:700;font-size:13px;}
.site-card .sc-meta{font-size:10.5px;color:var(--text3);margin-top:2px;}

/* Planning — liste (Heures & présences réutilise ces classes) */
.plan-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.shift-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid #f0eeeb;font-size:12.5px;cursor:pointer;}
.shift-row:hover{background:var(--bg);}
.shift-time{font-family:'DM Mono';font-size:11.5px;color:var(--text2);width:100px;flex-shrink:0;}
.shift-site{width:150px;flex-shrink:0;color:var(--text3);font-size:11px;}
.shift-agent{flex:1;font-weight:600;}

/* Planning — grille site/poste × jours */
.calendar-scroll{overflow:auto;border:1px solid var(--border);border-radius:10px;background:#fff;max-height:74vh;-webkit-overflow-scrolling:touch;contain:layout paint;}
.calendar{display:grid;}
.calendar .cell{border-right:1px solid #f0eeeb;border-bottom:1px solid #f0eeeb;padding:5px;min-height:52px;font-size:11px;box-sizing:border-box;}
.calendar .cell.corner{background:var(--bg2);font-weight:700;font-size:11.5px;position:sticky;left:0;top:0;z-index:4;display:flex;align-items:center;}
.calendar .cell.day-header{background:var(--bg2);text-align:center;font-weight:700;font-size:11px;position:sticky;top:0;z-index:3;color:var(--text2);}
.calendar .cell.day-header.is-today{color:var(--red);}
.calendar .cell.row-label{background:#fbfaf9;font-size:11px;position:sticky;left:0;z-index:2;line-height:1.3;}
.calendar .cell.shift-cell.is-today{background:#fff7f0;}
.calendar .cell.shift-cell.drag-over{background:#fff0ef;outline:2px dashed var(--red);outline-offset:-2px;}
.shift-chip{background:#fff;border:1px solid var(--border2);border-left:3px solid var(--text3);border-radius:6px;padding:3px 5px;font-size:10.5px;margin-bottom:3px;cursor:grab;line-height:1.25;}
.shift-chip:hover{box-shadow:var(--shadow);}
.shift-chip:active{cursor:grabbing;}
.shift-chip .sc-time{font-family:'DM Mono';color:var(--text2);}
.shift-chip .sc-agent{font-weight:600;}
.shift-chip .sc-desc{color:var(--text3);font-size:9.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.shift-chip.no-agent{border-left-color:var(--red);}
.shift-chip.no-agent .sc-agent{color:var(--red);}
.shift-chip.status-publiee,.shift-chip.status-vue{border-left-color:var(--blue);}
.shift-chip.status-validee{border-left-color:var(--green);}
.shift-chip.status-effectuee{border-left-color:var(--orange);}
.shift-chip.status-controlee{border-left-color:#15803d;background:#f7fdf9;}
.cell-add{font-size:15px;color:var(--border2);text-align:center;cursor:pointer;line-height:1.4;}
.cell-add:hover{color:var(--red);}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,18,16,.5);z-index:500;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-lg);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-family:'DM Serif Display';font-size:17px;}
.modal-close{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text3);}
.modal-body{padding:18px 20px;}
.modal-actions{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.fg.full{grid-column:1/-1;}
.modal-err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:none;}
.checkline{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:4px 0;}
.hint{font-size:11px;color:var(--text3);margin-top:4px;}
.sep{height:1px;background:var(--border);margin:14px 0;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--anthracite);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);z-index:900;display:none;}
.toast.error{background:#b91c1c;}
.toast.show{display:block;}

.empty{text-align:center;padding:36px 16px;color:var(--text3);font-size:13px;}
.demo-badge{background:#fef3c7;color:#92400e;}

@media(max-width:880px){
  .fgrid{grid-template-columns:1fr;}
  .sidebar-toggle{display:block;}
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s ease;width:240px;z-index:250;}
  .sidebar.open{transform:translateX(0);}
  .sidebar.open ~ .sidebar-scrim{display:block;}
  .sidebar-scrim{position:fixed;inset:0;background:rgba(20,18,16,.4);z-index:220;}
  .content{padding:16px;padding-top:60px;}
}
</style>
</head>
<body>

<!-- ═══════════ LOGIN ═══════════ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-head">
      <div class="login-logo">RDZ</div>
      <div class="login-title">Planning RDZ</div>
      <div class="login-sub">RDZ Security Management</div>
    </div>
    <div class="login-body">
      <div class="login-err" id="login-err"></div>
      <div class="fg"><div class="flabel">E-mail</div><input class="finp" id="login-email" type="email" autocomplete="username"></div>
      <div class="fg"><div class="flabel">Mot de passe</div><input class="finp" id="login-pass" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
      <button class="btn btn-primary btn-block" id="login-btn" onclick="doLogin()">Se connecter</button>
    </div>
  </div>
</div>

<!-- ═══════════ APP ═══════════ -->
<button class="sidebar-toggle" id="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Ouvrir le menu">☰</button>
<div id="app">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">RDZ</div>
      <div>
        <div class="sidebar-title">Planning</div>
        <div class="sidebar-sub">Sécurité &amp; sûreté</div>
      </div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-foot">
      <div class="sync-pill"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">—</span></div>
      <button class="user-pill" id="user-btn" onclick="toggleUserMenu()">☰ Mon compte</button>
    </div>
  </div>
  <div class="sidebar-scrim" onclick="closeSidebar()"></div>

  <div class="app-main">
    <div class="content">
      <div id="panel-overview" class="panel"></div>
      <div id="panel-planning" class="panel"></div>
      <div id="panel-agents" class="panel"></div>
      <div id="panel-sites" class="panel"></div>
      <div id="panel-heures" class="panel"></div>
      <div id="panel-settings" class="panel"></div>
    </div>
  </div>
</div>

<!-- ═══════════ MODALS (root, rendered by JS) ═══════════ -->
<div id="modal-root"></div>
<div class="toast" id="toast"></div>

<script>
// ════════════════════════════════════════════════════════════
// RDZ PLANNING — app front-end vanilla JS
// ════════════════════════════════════════════════════════════

// ── CONFIG ──────────────────────────────────────────────────
const SUPA_URL = 'https://trdhtlcenmjlcvzuplid.supabase.co';
const SUPA_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGh0bGNlbm1qbGN2enVwbGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NTE2NzQsImV4cCI6MjA5MjAyNzY3NH0.8r-ITHC-w28vQ4_FKI6Hbwg4AYVqYR0i-69_oHSD5DU';
const API_URL = SUPA_URL + '/functions/v1/rdz-planning-api';
const SK = 'rdz_planning_session';
const DEMO_NAMES = ['Marc Dubois','Sofia Martins','Thomas Bernard','Alexandre Morel','Julie Favre','Nicolas Perrin'];

let currentToken = null, currentSession = null;
let STATE = null, ACTOR = null, RH_CONFIGURED = false;
let UI = { tab: 'overview', simulate: '' };
let modalStack = [];

// ── UTILS ───────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uuid(){ return crypto.randomUUID(); }
function todayISO(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Europe/Zurich'}); }
function fmtDate(d){ if(!d) return '—'; try{ return new Date(d+'T12:00:00Z').toLocaleDateString('fr-CH',{day:'2-digit',month:'2-digit',year:'numeric'}); }catch(e){ return d; } }
function fmtHours(mins){ if(!Number.isFinite(mins)) return '—'; const h=Math.floor(Math.abs(mins)/60), m=Math.round(Math.abs(mins)%60); return (mins<0?'-':'')+h+'h'+String(m).padStart(2,'0'); }
function normalizeName(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''); }

// Legacy agents (created before the nom/prenom split existed, or not yet re-synced) are stored
// with only a single free-text "name" field (usually "Prénom Nom"). We split heuristically:
// last word = nom, everything before = prénom. Agents with real separate .nom/.prenom fields
// (from RH sync or created/edited via the agent form) use those directly — see getNomPrenom().
function splitName(name){
  const parts = String(name||'').trim().split(/\s+/);
  if(parts.length<2) return { prenom:'', nom: parts[0]||'' };
  const nom = parts[parts.length-1];
  const prenom = parts.slice(0,-1).join(' ');
  return { prenom, nom };
}
// Returns { prenom, nom } for an agent object, preferring the real stored fields and
// falling back to the heuristic split of the concatenated name for legacy agents.
function getNomPrenom(agent){
  if(agent && agent.nom) return { nom: agent.nom, prenom: agent.prenom||'' };
  return splitName(agent? agent.name : '');
}
function displayNomPrenom(agent){ const {prenom,nom}=getNomPrenom(agent); return prenom? (nom+' '+prenom) : nom; }
function sortKeyNom(agent){ return normalizeName(getNomPrenom(agent).nom); }
function sortAgentsByNom(list){ return [...list].sort((a,b)=> sortKeyNom(a).localeCompare(sortKeyNom(b)) || normalizeName(a.name).localeCompare(normalizeName(b.name))); }
function sortSitesByName(list){ return [...list].sort((a,b)=> a.name.localeCompare(b.name,'fr')); }
function isDemoAgent(a){ return !a.rhAgentId && a.source!=='supabase-rh' && /^a[0-9]$/.test(a.id) && DEMO_NAMES.includes(a.name); }
function isDemoShift(s){ return /^(s\d|open\d|past\d)/.test(s.id||''); }

function agentById(id){ return (STATE?.agents||[]).find(a=>a.id===id); }
function siteById(id){ return (STATE?.sites||[]).find(s=>s.id===id); }
function clientById(id){ return (STATE?.clients||[]).find(c=>c.id===id); }
function agentLabel(id){ const a=agentById(id); return a? displayNomPrenom(a) : (id? 'Agent introuvable' : 'À affecter'); }
function siteLabel(id){ const s=siteById(id); return s? s.name : id; }

// Contract-based weekly/annual objectives. Falls back to manually stored weekly/annual
// when there is no monthly contract value (locally-created agents without RH sync).
function computeObjectives(agent){
  const monthly = agent.monthly;
  if(Number.isFinite(monthly) && monthly>0){
    const annual = Math.round(monthly*12);
    const weekly = Math.round((annual/52)*10)/10;
    return { weekly, annual, source:'contrat' };
  }
  return { weekly: agent.weekly||0, annual: agent.annual||0, source:'manuel' };
}

function toast(msg, isError){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError?' error':'');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ t.className='toast'; }, 3800);
}

function setSyncState(state, label){
  const dot = document.getElementById('sync-dot');
  const lbl = document.getElementById('sync-label');
  const cfg = { ok:'#16a34a', saving:'#d97706', error:'#dc2626', idle:'#9ca3af' };
  if(dot) dot.style.background = cfg[state]||cfg.idle;
  if(lbl && label!=null) lbl.textContent = label;
}

// ── AUTH ────────────────────────────────────────────────────
function getSession(){ try{ return JSON.parse(localStorage.getItem(SK)||'null'); }catch(e){ return null; } }
function sessionOk(s){ return s && s.token && s.expires_at > Math.floor(Date.now()/1000)+30; }

function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.style.display='none';
  if(!email||!pass){ err.textContent='Remplissez tous les champs.'; err.style.display='block'; return; }
  btn.textContent='Connexion…'; btn.disabled=true;
  fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{
    method:'POST', headers:{'Content-Type':'application/json','apikey':SUPA_ANON},
    body:JSON.stringify({email,password:pass})
  }).then(r=>r.json()).then(auth=>{
    if(!auth.access_token) throw new Error('E-mail ou mot de passe incorrect.');
    const session = { token:auth.access_token, refresh:auth.refresh_token, expires_at:auth.expires_at, user_id:auth.user.id, email:auth.user.email };
    localStorage.setItem(SK, JSON.stringify(session));
    applySession(session);
  }).catch(e=>{
    err.textContent = e.message || 'Erreur réseau.';
    err.style.display='block';
    btn.textContent='Se connecter'; btn.disabled=false;
  });
}

function applySession(session){
  currentToken = session.token; currentSession = session;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  fetchState();
}

function doLogout(){
  const s = getSession();
  localStorage.removeItem(SK);
  currentToken=null; currentSession=null; STATE=null; ACTOR=null;
  document.getElementById('app').style.display='none';
  document.getElementById('login-screen').style.display='flex';
  const btn=document.getElementById('login-btn'); if(btn){ btn.disabled=false; btn.textContent='Se connecter'; }
  if(s && s.token) fetch(SUPA_URL+'/auth/v1/logout',{method:'POST',headers:{apikey:SUPA_ANON,Authorization:'Bearer '+s.token}}).catch(()=>{});
}

// ── API ─────────────────────────────────────────────────────
async function apiGet(){
  setSyncState('saving','Chargement…');
  try{
    const url = API_URL + (UI.simulate? '?simulate='+encodeURIComponent(UI.simulate) : '');
    const r = await fetch(url, { headers:{ apikey:SUPA_ANON, Authorization:'Bearer '+currentToken } });
    const data = await r.json();
    if(!r.ok) throw new Error(data.error||'Chargement impossible');
    STATE = data.state; ACTOR = data.actor; RH_CONFIGURED = data.rhConfigured===true;
    setSyncState('ok', 'Sync '+new Date().toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'}));
    renderNav(); renderCurrentPanel();
    return true;
  }catch(e){
    setSyncState('error','Hors ligne');
    toast(e.message||'Connexion impossible', true);
    return false;
  }
}
function fetchState(){ return apiGet(); }

async function apiAction(action, params){
  if(!STATE){ toast('Chargement en cours, réessayez.', true); return false; }
  setSyncState('saving','Enregistrement…');
  try{
    const r = await fetch(API_URL, {
      method:'POST',
      headers:{ apikey:SUPA_ANON, Authorization:'Bearer '+currentToken, 'content-type':'application/json' },
      body: JSON.stringify({ action, ...params, revision: STATE.revision, simulate: UI.simulate||undefined })
    });
    const data = await r.json();
    if(!r.ok){
      if(r.status===409){
        toast('Les données ont changé, actualisation…', true);
        await apiGet();
      } else {
        toast(data.error||'Action impossible', true);
      }
      setSyncState('ok','Connecté');
      return false;
    }
    STATE = data.state; ACTOR = data.actor;
    setSyncState('ok','Enregistré · '+new Date().toLocaleTimeString('fr-CH',{hour:'2-digit',minute:'2-digit'}));
    renderCurrentPanel();
    return true;
  }catch(e){
    setSyncState('error','Hors ligne');
    toast('Connexion indisponible. Rien n’a été enregistré.', true);
    return false;
  }
}

const TABS = [
  {id:'overview', label:'Vue d’ensemble'},
  {id:'planning', label:'Planning'},
  {id:'agents', label:'Agents'},
  {id:'sites', label:'Clients & Sites'},
  {id:'heures', label:'Heures & présences'},
  {id:'settings', label:'Réglages'}
];
function renderNav(){
  const nav = document.getElementById('sidebar-nav');
  const visible = TABS.filter(t => (ACTOR?.role==='direction'||ACTOR?.role==='planning') ? true : ['overview','planning','heures'].includes(t.id));
  nav.innerHTML = visible.map(t=>`<button class="snav-btn ${UI.tab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join('');
}
function switchTab(id){ UI.tab = id; renderNav(); renderCurrentPanel(); closeSidebar(); }
function toggleSidebar(){ document.getElementById('sidebar')?.classList.toggle('open'); }
function closeSidebar(){ document.getElementById('sidebar')?.classList.remove('open'); }
function renderCurrentPanel(){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const map = { overview:'panel-overview', planning:'panel-planning', agents:'panel-agents', sites:'panel-sites', heures:'panel-heures', settings:'panel-settings' };
  const el = document.getElementById(map[UI.tab]||'panel-overview');
  el.classList.add('active');

// ── VUE D'ENSEMBLE ──────────────────────────────────────────
function renderOverview(el){
  const today = todayISO();
  const shifts = STATE.shifts;
  const plannedToday = new Set(shifts.filter(s=>s.date===today && s.agent).map(s=>s.agent)).size;
  const validated = shifts.filter(s=>['Validée','Contrôlée'].includes(s.status)).length;
  const toValidate = shifts.filter(s=>['Publiée','Vue'].includes(s.status)).length;
  const openPosts = shifts.filter(s=>!s.agent && s.date>=today).length;
  const toControl = shifts.filter(s=>s.status==='Effectuée').length;
  const pendingAbsences = (STATE.absences||[]).filter(a=>a.status==='Demandée').length;

  const kpis = [
    {label:'Agents planifiés', val:plannedToday, sub:'Aujourd’hui', cls:'neutral', tab:'planning'},
    {label:'Plannings validés', val:validated, sub:'Tous les services', cls:'green', tab:'planning'},
    {label:'À valider par les agents', val:toValidate, sub:'En attente des agents', cls:'blue', tab:'planning'},
    {label:'Postes non couverts', val:openPosts, sub:'Affectation nécessaire', cls:'red', tab:'planning'},
    {label:'Écarts à contrôler', val:toControl, sub:'Heures déclarées, en attente de contrôle RDZ', cls:'orange', tab:'heures'},
    {label:'Demandes de congé', val:pendingAbsences, sub:'En attente de décision', cls:'blue', tab:'heures'}
  ];
  el.innerHTML = `
    <div class="ph"><div><div class="ph-title">Vue d’ensemble</div><div class="ph-sub">${esc(fmtDate(today))}</div></div></div>
    <div class="kpi-grid">${kpis.map(k=>`
      <div class="kpi ${k.cls}" onclick="switchTab('${k.tab}')" title="${esc(k.sub)}">
        <div class="kpi-val">${k.val}</div>
        <div class="kpi-label">${esc(k.label)}</div>
        <div class="kpi-sub">${esc(k.sub)}</div>
      </div>`).join('')}
    </div>
    <div class="card">
      <div style="font-weight:700;margin-bottom:8px;">À propos de la carte « Écarts à contrôler »</div>
      <div style="font-size:12.5px;color:var(--text2);line-height:1.6;">
        Cette carte ne compare pas les heures planifiées et le contrat mensuel d’un agent. Elle compte les
        <strong>services dont l’agent a déclaré ses heures réelles</strong> (statut « Effectuée ») et qui attendent
        encore un contrôle RDZ avant d’être classés « Contrôlée ». Un écart contrat/planning se lit plutôt dans
        la fiche de chaque agent (onglet Agents), où l’objectif mensuel/hebdomadaire est comparé aux heures
        déjà planifiées.
      </div>
    </div>
    ${renderDemoBanner()}
  `;
}

async function saveAgentForm(id){
  const a = id? agentById(id) : null;
  const isRh = a && a.source==='supabase-rh';
  const nom = modalVal('af-nom').trim();
  const prenom = modalVal('af-prenom').trim();
  if(!nom){ modalError('Le nom est obligatoire.'); return; }
  const name = prenom? (prenom+' '+nom) : nom;
  const values = {
    name, nom, prenom, email: modalVal('af-email'), available: modalVal('af-available')==='1',
    team: modalVal('af-team')||'À définir',
    qualifications: modalVal('af-quali'),
    documentsUntil: modalVal('af-docs')||(a?a.documentsUntil:''),
    authorizationUntil: modalVal('af-auth')||(a?a.authorizationUntil:''),
    primarySite: modalVal('af-primary'),
    sites: Array.from(document.getElementById('af-sites')?.selectedOptions||[]).map(o=>o.value)
  };
  if(isRh){
    const obj = computeObjectives(a);
    values.weekly = obj.weekly; values.annual = obj.annual; values.monthly = a.monthly;
  } else {
    const weekly = Number(modalVal('af-weekly')), annual = Number(modalVal('af-annual'));
    if(!(weekly>0 && weekly<=80) || !(annual>0)){ modalError('Renseignez des objectifs hebdomadaire/annuel valides.'); return; }
    values.weekly = weekly; values.annual = annual;
  }
  const ok = await apiAction('saveAgent', { id: id||undefined, values });
  if(ok){ closeModal(); toast('Fiche agent enregistrée'); }
}
async function deleteAgent(id){
  if(!confirm('Supprimer cet agent du planning ?')) return;
  const ok = await apiAction('deleteAgent', { id, confirm:true });
  if(ok){ closeModal(); toast('Agent supprimé'); }
}
async function restoreAgent(id){

// ── PLANNING (grille site/poste × jours, ou grille agent × jours) ──
let PLAN_FILTER = { mode:'week', anchor:'', site:'', view:'site' };
let DRAG_SHIFT = null;
const WEEKDAY_SHORT = ['lun.','mar.','mer.','jeu.','ven.','sam.','dim.'];
function mondayOf(dateStr){
  const d = new Date(dateStr+'T12:00:00Z');
  const shift = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-shift);
  return d.toISOString().slice(0,10);
}
function addDays(dateStr, n){ const d=new Date(dateStr+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function planInitRange(){
  if(!PLAN_FILTER.anchor) PLAN_FILTER.anchor = PLAN_FILTER.mode==='month' ? todayISO().slice(0,7)+'-01' : mondayOf(todayISO());
}
function planDays(){
  if(PLAN_FILTER.mode==='month'){
    const [y,m] = PLAN_FILTER.anchor.split('-').map(Number);
    const nbDays = new Date(Date.UTC(y, m, 0)).getUTCDate();
    return Array.from({length:nbDays}, (_,i)=> `${String(y)}-${String(m).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`);
  }
  return Array.from({length:7}, (_,i)=> addDays(PLAN_FILTER.anchor, i));
}
function planLabel(){
  if(PLAN_FILTER.mode==='month'){
    return new Date(PLAN_FILTER.anchor+'T12:00:00Z').toLocaleDateString('fr-CH',{month:'long',year:'numeric'});
  }
  const days = planDays();
  return 'Semaine du '+fmtDate(days[0])+' au '+fmtDate(days[6]);
}
function planSetMode(mode){
  const today = todayISO();
  PLAN_FILTER.mode = mode;
  PLAN_FILTER.anchor = mode==='month' ? today.slice(0,7)+'-01' : mondayOf(today);
  renderCurrentPanel();
}
function planNav(dir){
  if(PLAN_FILTER.mode==='month'){
    const [y,m] = PLAN_FILTER.anchor.split('-').map(Number);
    const nd = new Date(Date.UTC(y, m-1+dir, 1));
    PLAN_FILTER.anchor = nd.toISOString().slice(0,10).slice(0,7)+'-01';
  } else {
    PLAN_FILTER.anchor = addDays(PLAN_FILTER.anchor, dir*7);
  }
  renderCurrentPanel();
}
function planToday(){
  PLAN_FILTER.anchor = PLAN_FILTER.mode==='month' ? todayISO().slice(0,7)+'-01' : mondayOf(todayISO());
  renderCurrentPanel();
}
function statusBadgeClass(status){
  return { 'Planifiée':'badge-grey','Publiée':'badge-blue','Vue':'badge-blue','Validée':'badge-green','Effectuée':'badge-orange','Contrôlée':'badge-green' }[status]||'badge-grey';
}
const STATUS_CLASS = { 'Planifiée':'planifiee','Publiée':'publiee','Vue':'vue','Validée':'validee','Effectuée':'effectuee','Contrôlée':'controlee' };

function planningRows(sites, days){
  const rows = [];
  sites.forEach(site=>{
    const declared = (site.posts||[]).map(p=>p.name);
    const usedInRange = STATE.shifts.filter(s=>s.site===site.id && days.includes(s.date)).map(s=>s.post);
    const postNames = [...new Set([...declared, ...usedInRange])];
    (postNames.length? postNames : ['—']).forEach(post=> rows.push({ siteId: site.id, siteName: site.name, post }));
  });
  return rows;
}
function jsStr(v){ return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function shiftTooltip(s){
  const parts = [siteLabel(s.site)+' / '+s.post, s.start+'–'+s.end];
  if(s.description) parts.push(s.description);
  return parts.join(' · ');
}
function renderShiftChip(s, canManage){
  const desc = s.description? esc(s.description) : '';
  return `
    <div class="shift-chip status-${STATUS_CLASS[s.status]||'planifiee'} ${!s.agent?'no-agent':''}" draggable="${canManage?'true':'false'}"
      title="${esc(shiftTooltip(s))}"
      ondragstart="handleChipDragStart(event,'${s.id}')"
      onclick="event.stopPropagation();openShiftModal('${s.id}')">
      <div class="sc-time">${s.start}–${s.end}</div>
      <div class="sc-agent">${s.agent? esc(agentLabel(s.agent)) : 'À affecter'}</div>
      ${desc? `<div class="sc-desc">${desc}</div>` : ''}
    </div>`;
}
function handleChipDragStart(ev, id){
  DRAG_SHIFT = id;
  try{ ev.dataTransfer.setData('text/plain', id); ev.dataTransfer.effectAllowed='move'; }catch(e){}
}
function handleCellDragOver(ev){
  if(!DRAG_SHIFT) return;
  ev.preventDefault();
  ev.currentTarget.classList.add('drag-over');
}
function handleCellDragLeave(ev){ ev.currentTarget.classList.remove('drag-over'); }
async function handleCellDrop(ev, target){
  ev.preventDefault();
  ev.currentTarget.classList.remove('drag-over');
  const id = DRAG_SHIFT; DRAG_SHIFT = null;
  if(!id) return;
  const s = STATE.shifts.find(x=>x.id===id);
  if(!s) return;
  const values = { site: target.site!=null? target.site : s.site, post: target.post!=null? target.post : s.post, date: target.date!=null? target.date : s.date, start:s.start, end:s.end, agent: target.agent!=null? target.agent : (s.agent||''), description: s.description||'' };
  if(values.site===s.site && values.post===s.post && values.date===s.date && values.agent===(s.agent||'')) return;
  const ok = await apiAction('edit', { id: s.id, version: s.version, reason:'Déplacement par glisser-déposer', values });
  if(ok) toast('Service déplacé');
}
function planSetView(view){ PLAN_FILTER.view = view; renderCurrentPanel(); }

function renderPlanning(el){
  planInitRange();
  const canManage = ['direction','planning','site'].includes(ACTOR.role);
  const days = planDays();
  const today = todayISO();
  const allSites = sortSitesByName(STATE.sites.filter(s=>!s.archived));
  const activeSites = PLAN_FILTER.site ? allSites.filter(s=>s.id===PLAN_FILTER.site) : allSites;

  el.innerHTML = `
    <div class="ph">
      <div><div class="ph-title">Planning</div><div class="ph-sub">${esc(planLabel())}</div></div>
      <div class="ph-right">${canManage? `<button class="btn btn-primary btn-sm" onclick="openShiftModal()">+ Nouveau service</button>` : ''}</div>
    </div>
    <div class="plan-toolbar">
      <div style="display:flex;gap:0;border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;">
        <button class="btn btn-sm ${PLAN_FILTER.mode==='week'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetMode('week')">Semaine</button>
        <button class="btn btn-sm ${PLAN_FILTER.mode==='month'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetMode('month')">Mois</button>
      </div>
      <button class="btn btn-ghost btn-sm" onclick="planNav(-1)">‹</button>
      <button class="btn btn-ghost btn-sm" onclick="planToday()">Aujourd’hui</button>
      <button class="btn btn-ghost btn-sm" onclick="planNav(1)">›</button>
      <select class="sel" onchange="PLAN_FILTER.site=this.value;renderCurrentPanel()"><option value="">Tous les sites</option>${allSites.map(s=>`<option value="${s.id}" ${PLAN_FILTER.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
      <div style="display:flex;gap:0;border:1.5px solid var(--border2);border-radius:9px;overflow:hidden;">
        <button class="btn btn-sm ${PLAN_FILTER.view==='site'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetView('site')">Vue par site</button>
        <button class="btn btn-sm ${PLAN_FILTER.view==='agent'?'btn-primary':'btn-ghost'}" style="border-radius:0;" onclick="planSetView('agent')">Vue par agent</button>
      </div>
      ${canManage? (PLAN_FILTER.mode==='week'
        ? `<button class="btn btn-ghost btn-sm" onclick="openCopyWeekModal()">⧉ Copier la semaine</button>`
        : `<button class="btn btn-ghost btn-sm" onclick="openCopyMonthModal()">⧉ Copier le mois</button>`) : ''}
    </div>
    <div class="calendar-scroll" id="calendar-scroll">
      ${PLAN_FILTER.view==='agent' ? renderAgentCalendar(days, today, canManage) : renderSiteCalendar(activeSites, days, today, canManage)}
    </div>
  `;
}
function renderSiteCalendar(activeSites, days, today, canManage){
  const rows = planningRows(activeSites, days);
  return `
    <div class="calendar" style="grid-template-columns:190px repeat(${days.length}, minmax(${PLAN_FILTER.mode==='month'?100:150}px,1fr));">
      <div class="cell corner">Postes / Services</div>
      ${days.map(d=>`<div class="cell day-header ${d===today?'is-today':''}">${WEEKDAY_SHORT[(new Date(d+'T12:00:00Z').getUTCDay()+6)%7]}<br>${Number(d.slice(8,10))}</div>`).join('')}
      ${rows.length? rows.map(r=>`
        <div class="cell row-label">${esc(r.siteName)}<br><span style="color:var(--text3);font-weight:400;">${esc(r.post)}</span></div>
        ${days.map(d=>renderPlanningCell(r,d,today,canManage)).join('')}
      `).join('') : `<div class="cell" style="grid-column:1/-1;color:var(--text3);">Aucun poste configuré${PLAN_FILTER.site?' pour ce site':''}.</div>`}
    </div>
  `;
}
function renderPlanningCell(row, date, today, canManage){
  const shifts = STATE.shifts.filter(s=>s.site===row.siteId && s.post===row.post && s.date===date).sort((a,b)=>a.start.localeCompare(b.start));
  const chips = shifts.map(s=>renderShiftChip(s, canManage)).join('');
  const addBtn = canManage? `<div class="cell-add" onclick="openShiftModal(null,{site:'${jsStr(row.siteId)}',post:'${jsStr(row.post)}',date:'${date}'})" title="Ajouter un service">+</div>` : '';
  const dropAttrs = canManage? `ondragover="handleCellDragOver(event)" ondragleave="handleCellDragLeave(event)" ondrop="handleCellDrop(event,{site:'${jsStr(row.siteId)}',post:'${jsStr(row.post)}',date:'${date}'})"` : '';
  return `<div class="cell shift-cell ${date===today?'is-today':''}" ${dropAttrs}>${chips}${addBtn}</div>`;
}
function renderAgentCalendar(days, today, canManage){
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  return `
    <div class="calendar" style="grid-template-columns:190px repeat(${days.length}, minmax(${PLAN_FILTER.mode==='month'?100:150}px,1fr));">
      <div class="cell corner">Agents</div>
      ${days.map(d=>`<div class="cell day-header ${d===today?'is-today':''}">${WEEKDAY_SHORT[(new Date(d+'T12:00:00Z').getUTCDay()+6)%7]}<br>${Number(d.slice(8,10))}</div>`).join('')}
      ${agents.length? agents.map(a=>`
        <div class="cell row-label">${esc(displayNomPrenom(a))}</div>
        ${days.map(d=>renderAgentPlanningCell(a,d,today,canManage)).join('')}
      `).join('') : `<div class="cell" style="grid-column:1/-1;color:var(--text3);">Aucun agent.</div>`}
    </div>
  `;
}
function renderAgentPlanningCell(agent, date, today, canManage){
  const shifts = STATE.shifts.filter(s=>s.agent===agent.id && s.date===date).sort((a,b)=>a.start.localeCompare(b.start));
  const chips = shifts.map(s=>renderShiftChip(s, canManage)).join('');
  const addBtn = canManage? `<div class="cell-add" onclick="openShiftModal(null,{agent:'${jsStr(agent.id)}',date:'${date}'})" title="Ajouter un service">+</div>` : '';
  const dropAttrs = canManage? `ondragover="handleCellDragOver(event)" ondragleave="handleCellDragLeave(event)" ondrop="handleCellDrop(event,{agent:'${jsStr(agent.id)}',date:'${date}'})"` : '';
  return `<div class="cell shift-cell ${date===today?'is-today':''}" ${dropAttrs}>${chips}${addBtn}</div>`;
}

function renderPostSelect(site, current){

  return `<select class="fsel" id="sh-post">${(site.posts||[]).map(p=>`<option value="${esc(p.name)}" ${current===p.name?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`;
}
function onShiftSiteChange(){

  document.getElementById('sh-post-wrap').innerHTML = renderPostSelect(site, '');
}
async function saveShiftForm(idVersion){
  const [id, version] = idVersion? idVersion.split('|') : [null,null];
  const values = { site: modalVal('sh-site'), post: modalVal('sh-post'), date: modalVal('sh-date'), start: modalVal('sh-start'), end: modalVal('sh-end'), agent: modalVal('sh-agent'), description: modalVal('sh-description') };

  const params = { values };
  if(id){ params.id=id; params.version=Number(version); params.reason=modalVal('sh-reason'); }
  const ok = await apiAction(id?'edit':'create', params);
  if(ok){ closeModal(); toast(id? 'Service modifié' : 'Service créé'); }
}
async function publishShift(id){

}
async function deleteShiftAction(id, version){

function openCopyShiftModal(id, version){

  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  openModal('copy-shift-modal', 'Copier le service', `
    <div class="hint" style="margin-bottom:10px;">${esc(siteLabel(s.site))} / ${esc(s.post)} · ${s.start}–${s.end}</div>
    <div class="fgrid">
      <div class="fg"><div class="flabel">Nouvelle date *</div><input class="finp" type="date" id="cs-date" value="${s.date}"></div>
      <div class="fg"><div class="flabel">Agent</div><select class="fsel" id="cs-agent"><option value="">— À affecter —</option>${agents.map(a=>`<option value="${a.id}" ${s.agent===a.id?'selected':''}>${esc(displayNomPrenom(a))}</option>`).join('')}</select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="doCopyShift('${id}','${version}')">Copier</button>`);
}
async function doCopyShift(id, version){
  const date = modalVal('cs-date'), agent = modalVal('cs-agent');
  if(!date){ modalError('Choisissez une date.'); return; }
  const ok = await apiAction('duplicateShift', { id, version:Number(version), targets:[{date, agent}] });
  if(ok){ closeModal(); toast('Service copié'); }
}
function openCopyWeekModal(){
  const allSites = sortSitesByName(STATE.sites.filter(s=>!s.archived));
  openModal('copy-week-modal', 'Copier la semaine', `
    <div class="hint" style="margin-bottom:10px;">Copie tous les services de la semaine affichée (${esc(planLabel())}) vers une autre semaine (lundis requis).</div>
    <div class="fgrid">
      <div class="fg full"><div class="flabel">Semaine de destination (lundi) *</div><input class="finp" type="date" id="cw-to" value="${addDays(PLAN_FILTER.anchor,7)}"></div>
      <div class="fg full"><div class="flabel">Limiter à un site</div><select class="fsel" id="cw-site"><option value="">Tous les sites</option>${allSites.map(s=>`<option value="${s.id}" ${PLAN_FILTER.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="doCopyWeek()">Copier</button>`);
}
async function doCopyWeek(){
  const to = modalVal('cw-to'), site = modalVal('cw-site');
  if(!to){ modalError('Choisissez la semaine de destination.'); return; }
  const ok = await apiAction('duplicateWeek', { from: PLAN_FILTER.anchor, to, site });
  if(ok){ closeModal(); toast('Semaine copiée en brouillon'); }
}
function openCopyMonthModal(){
  const allSites = sortSitesByName(STATE.sites.filter(s=>!s.archived));
  const nextMonth = (()=>{ const [y,m]=PLAN_FILTER.anchor.split('-').map(Number); const nd=new Date(Date.UTC(y,m,1)); return nd.toISOString().slice(0,7); })();
  openModal('copy-month-modal', 'Copier le mois', `
    <div class="hint" style="margin-bottom:10px;">Copie tous les services du mois affiché (${esc(planLabel())}) vers un autre mois. Les jours au-delà de la fin du mois de destination sont ramenés au dernier jour de ce mois.</div>
    <div class="fgrid">
      <div class="fg full"><div class="flabel">Mois de destination *</div><input class="finp" type="month" id="cm-to" value="${nextMonth}"></div>
      <div class="fg full"><div class="flabel">Limiter à un site</div><select class="fsel" id="cm-site"><option value="">Tous les sites</option>${allSites.map(s=>`<option value="${s.id}" ${PLAN_FILTER.site===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="doCopyMonth()">Copier</button>`);
}
async function doCopyMonth(){
  const to = modalVal('cm-to'), site = modalVal('cm-site');
  if(!to){ modalError('Choisissez le mois de destination.'); return; }
  const ok = await apiAction('duplicateMonth', { sourceMonth: PLAN_FILTER.anchor.slice(0,7), targetMonth: to, site });
  if(ok){ closeModal(); toast('Mois copié en brouillon'); }
}

// ── HEURES & PRÉSENCES ──────────────────────────────────────
function renderHeures(el){
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const isAgent = ACTOR.role==='agent';
  const myId = ACTOR.agent;
  const shifts = STATE.shifts;
  const toValidate = shifts.filter(s=> (!isAgent || s.agent===myId) && ['Publiée','Vue'].includes(s.status));
  const toDeclare = shifts.filter(s=> (!isAgent || s.agent===myId) && s.status==='Validée' && _shiftEndPassed(s));
  const toControl = shifts.filter(s=> s.status==='Effectuée');
  const absences = (STATE.absences||[]).slice().sort((a,b)=> b.from.localeCompare(a.from));
  const pendingAbsences = absences.filter(a=>a.status==='Demandée');

  el.innerHTML = `
    <div class="ph"><div><div class="ph-title">Heures &amp; présences</div><div class="ph-sub">Validation, déclaration, contrôle et congés</div></div>
      <div class="ph-right"><button class="btn btn-primary btn-sm" onclick="openAbsenceModal()">+ Demande de congé / indisponibilité</button></div>
    </div>

    ${toValidate.length? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">À valider par l’agent (${toValidate.length})</div>
      ${toValidate.map(s=>renderHeureRow(s,'accept')).join('')}</div>` : ''}

    ${toDeclare.length? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">Heures à déclarer (${toDeclare.length})</div>
      ${toDeclare.map(s=>renderHeureRow(s,'declare')).join('')}</div>` : ''}

    ${canManage? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">Écarts à contrôler — heures déclarées (${toControl.length})</div>
      ${toControl.length? toControl.map(s=>renderHeureRow(s,'check')).join('') : '<div class="hint">Rien à contrôler.</div>'}</div>` : ''}

    ${canManage && pendingAbsences.length? `<div class="card" style="margin-bottom:14px;"><div style="font-weight:700;margin-bottom:8px;">Demandes de congé en attente (${pendingAbsences.length})</div>
      ${pendingAbsences.map(a=>renderAbsenceRow(a,true)).join('')}</div>` : ''}

    <div class="card">
      <div style="font-weight:700;margin-bottom:8px;">Congés &amp; indisponibilités</div>
      ${absences.length? absences.map(a=>renderAbsenceRow(a,false)).join('') : '<div class="hint">Aucune demande.</div>'}
    </div>
  `;
}
function _shiftEndPassed(s){
  try{ const end=new Date(s.date+'T'+s.end+':00Z').getTime(); return end<=Date.now(); }catch(e){ return true; }
}
function renderHeureRow(s, kind){
  return `<div class="shift-row" onclick="${kind==='accept'?`openAcceptModal('${s.id}')`:kind==='declare'?`openDeclareModal('${s.id}')`:`openControlModal('${s.id}')`}">
    <span class="shift-time">${esc(fmtDate(s.date))} · ${s.start}–${s.end}</span>
    <span class="shift-site">${esc(siteLabel(s.site))} · ${esc(s.post)}</span>
    <span class="shift-agent">${esc(agentLabel(s.agent))}</span>
    <span class="badge ${statusBadgeClass(s.status)}">${esc(s.status)}</span>
  </div>`;
}
function openAcceptModal(id){
  const s = STATE.shifts.find(x=>x.id===id);
  openModal('accept-modal','Valider le service', `<div>${esc(fmtDate(s.date))} · ${s.start}–${s.end} · ${esc(siteLabel(s.site))} / ${esc(s.post)}</div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="acceptShift('${s.id}','${s.version}')">Valider</button>`);
}
async function acceptShift(id,version){ const ok=await apiAction('accept',{id,version:Number(version)}); if(ok){closeModal();toast('Service validé');} }
function openDeclareModal(id){
  const s = STATE.shifts.find(x=>x.id===id);
  openModal('declare-modal','Déclarer les heures réelles', `
    <div class="fgrid">
      <div class="fg"><div class="flabel">Début réel</div><input class="finp" type="time" id="dc-start" value="${s.start}"></div>
      <div class="fg"><div class="flabel">Fin réelle</div><input class="finp" type="time" id="dc-end" value="${s.end}"></div>
      <div class="fg full"><div class="flabel">Motif si horaire modifié</div><input class="finp" id="dc-reason" placeholder="Conforme au planning si inchangé"></div>
    </div>`, `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="declareShift('${s.id}')">Déclarer</button>`);
}
async function declareShift(id){
  const ok = await apiAction('declare', { id, start:modalVal('dc-start'), end:modalVal('dc-end'), reason:modalVal('dc-reason') });
  if(ok){ closeModal(); toast('Heures déclarées'); }
}
function openControlModal(id){
  const s = STATE.shifts.find(x=>x.id===id);
  openModal('control-modal','Contrôler le service', `
    <div>${esc(fmtDate(s.date))} · ${esc(siteLabel(s.site))} / ${esc(s.post)} · ${esc(agentLabel(s.agent))}</div>
    <div class="hint">Prévu ${s.start}–${s.end} · Réel ${s.actualStart||'—'}–${s.actualEnd||'—'}${s.reason?' · '+esc(s.reason):''}</div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Fermer</button><button class="btn btn-primary" onclick="controlShift('${s.id}')">Marquer contrôlé</button>`);
}
async function controlShift(id){ const ok=await apiAction('check',{id}); if(ok){closeModal();toast('Heures contrôlées');} }

// ── ABSENCES ────────────────────────────────────────────────
function renderAbsenceRow(a, forApproval){
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const mine = ACTOR.role==='agent' && a.agent===ACTOR.agent;
  const canEdit = a.status==='Demandée' && (canManage||mine);
  const canDelete = (a.status==='Demandée' && (canManage||mine)) || canManage;
  const demo = isDemoAgent(agentById(a.agent)||{});
  return `<div class="shift-row" style="cursor:default;">
    <span class="shift-time">${esc(fmtDate(a.from))} → ${esc(fmtDate(a.to))}</span>
    <span class="shift-site">${a.kind==='paid'?'Congé payé':'Indisponibilité'}${a.days?' · '+a.days+' j':''}</span>
    <span class="shift-agent">${esc(agentLabel(a.agent))} ${demo?'<span class="badge demo-badge">Démo</span>':''}</span>
    <span class="badge ${a.status==='Acceptée'?'badge-green':a.status==='Refusée'?'badge-red':'badge-orange'}">${esc(a.status)}</span>
    <span style="display:flex;gap:4px;">
      ${forApproval? `<button class="btn btn-sm btn-success" onclick="decideAbsence('${a.id}',true)">Accepter</button><button class="btn btn-sm btn-danger" onclick="decideAbsence('${a.id}',false)">Refuser</button>` : ''}
      ${canEdit? `<button class="btn btn-sm btn-ghost" onclick="openAbsenceModal('${a.id}')">✏️</button>` : ''}
      ${canDelete? `<button class="btn btn-sm btn-danger" onclick="deleteAbsence('${a.id}','${a.status}')">🗑</button>` : ''}
    </span>
  </div>`;
}
async function decideAbsence(id, accept){ const ok=await apiAction('approveAbsence',{id,accept}); if(ok) toast(accept?'Demande acceptée':'Demande refusée'); }
async function deleteAbsence(id, status){
  const confirmNeeded = status!=='Demandée';
  if(!confirm(confirmNeeded? 'Cette demande a déjà été traitée. La supprimer quand même ?' : 'Supprimer cette demande ?')) return;
  const ok = await apiAction('deleteAbsence', { id, confirm: confirmNeeded||undefined });
  if(ok) toast('Demande supprimée');
}
function openAbsenceModal(id){
  const a = id? STATE.absences.find(x=>x.id===id) : null;
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const agents = sortAgentsByNom(STATE.agents.filter(x=>!x.deletedAt));
  const body = `
    <div class="fgrid">
      ${canManage? `<div class="fg full"><div class="flabel">Agent *</div><select class="fsel" id="ab-agent" ${a?'disabled':''}>${agents.map(x=>`<option value="${x.id}" ${(a?a.agent===x.id:x.id===ACTOR.agent)?'selected':''}>${esc(displayNomPrenom(x))}</option>`).join('')}</select></div>` : ''}
      <div class="fg"><div class="flabel">Type *</div><select class="fsel" id="ab-kind"><option value="unavailable" ${a&&a.kind==='unavailable'?'selected':''}>Indisponibilité</option><option value="paid" ${a&&a.kind==='paid'?'selected':''}>Congé payé</option></select></div>
      <div class="fg"><div class="flabel">Du *</div><input class="finp" type="date" id="ab-from" value="${a?a.from:''}"></div>
      <div class="fg"><div class="flabel">Au *</div><input class="finp" type="date" id="ab-to" value="${a?a.to:''}"></div>
      <div class="fg full"><div class="flabel">Motif</div><input class="finp" id="ab-reason" value="${a?esc(a.reason||''):''}"></div>
    </div>
  `;
  openModal('absence-modal', a? 'Modifier la demande' : 'Nouvelle demande', body,
    `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveAbsenceForm('${a?a.id:''}')">Enregistrer</button>`);
}
async function saveAbsenceForm(id){
  const canManage = ACTOR.role==='direction'||ACTOR.role==='planning';
  const params = { kind: modalVal('ab-kind'), from: modalVal('ab-from'), to: modalVal('ab-to'), reason: modalVal('ab-reason') };
  if(!params.from||!params.to){ modalError('Renseignez les deux dates.'); return; }
  if(canManage && !id) params.agent = modalVal('ab-agent');
  let ok;
  if(id) ok = await apiAction('editAbsence', { id, ...params });
  else ok = await apiAction('absence', params);
  if(ok){ closeModal(); toast(id?'Demande modifiée':'Demande envoyée'); }
}

// ── RÉGLAGES ────────────────────────────────────────────────
function renderSettings(el){
  const isOwner = ACTOR.owner;
  const rules = STATE.rules;
  const members = STATE.members||[];
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  el.innerHTML = `
    <div class="ph"><div><div class="ph-title">Réglages</div><div class="ph-sub">Règles de contrôle, droits d’accès, comptes congés</div></div></div>

    <div class="card" style="margin-bottom:14px;">
      <div style="font-weight:700;margin-bottom:10px;">Règles de contrôle</div>
      <div class="fgrid">
        <div class="fg"><div class="flabel">Repos minimum (h)</div><input class="finp" type="number" id="rl-rest" value="${rules.rest}"></div>
        <div class="fg"><div class="flabel">Seuil hebdomadaire (h)</div><input class="finp" type="number" id="rl-weekly" value="${rules.weekly}"></div>
        <div class="fg"><div class="flabel">Alerte seuil annuel (%)</div><input class="finp" type="number" id="rl-annual" value="${rules.annualAlert}"></div>
      </div>
      <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="saveRulesForm()">Enregistrer les règles</button>
    </div>

    <div class="card" style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-weight:700;">Comptes congés</div>
        <button class="btn btn-ghost btn-sm" onclick="openLeaveAccountModal()">+ Définir un solde</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>Agent</th><th>Année</th><th>Solde initial</th><th>Méthode</th></tr></thead><tbody>
        ${agents.flatMap(a=>(a.leaveAccounts||[]).map(la=>`<tr><td>${esc(displayNomPrenom(a))}</td><td>${la.year}</td><td>${la.opening} j</td><td>${la.method==='scheduled'?'Jours planifiés':'Jours ouvrés'}</td></tr>`)).join('') || '<tr><td colspan="4" style="color:var(--text3);">Aucun compte congé défini</td></tr>'}
      </tbody></table></div>
    </div>

    ${isOwner? `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <div style="font-weight:700;">Droits d’accès</div>
        <button class="btn btn-ghost btn-sm" onclick="openMemberModal()">+ Ajouter un accès</button>
      </div>
      <div class="tbl-wrap"><table><thead><tr><th>E-mail</th><th>Rôle</th><th>Agent lié</th><th>Sites</th><th></th></tr></thead><tbody>
        ${members.map(m=>`<tr><td>${esc(m.email)}</td><td>${esc(m.role)}</td><td>${m.agent?esc(agentLabel(m.agent)):'—'}</td><td>${(m.sites||[]).map(siteLabel).join(', ')||'—'}</td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="btn btn-sm btn-ghost" onclick="openMemberModal('${jsStr(m.email)}')" title="Modifier">✏️</button>
            <button class="btn btn-sm btn-danger" onclick="deleteMember('${jsStr(m.email)}')" title="Supprimer">🗑</button>
          </td></tr>`).join('') || '<tr><td colspan="5" style="color:var(--text3);">Aucun accès défini</td></tr>'}
      </tbody></table></div>
    </div>` : ''}
  `;
}
async function saveRulesForm(){
  const values = { rest:Number(modalVal('rl-rest')), weekly:Number(modalVal('rl-weekly')), annualAlert:Number(modalVal('rl-annual')) };
  const ok = await apiAction('rules', { values });
  if(ok) toast('Règles mises à jour');
}
function openLeaveAccountModal(){
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  openModal('leave-modal','Solde de congés', `
    <div class="fgrid">
      <div class="fg full"><div class="flabel">Agent *</div><select class="fsel" id="la-agent">${agents.map(a=>`<option value="${a.id}">${esc(displayNomPrenom(a))}</option>`).join('')}</select></div>
      <div class="fg"><div class="flabel">Année *</div><input class="finp" type="number" id="la-year" value="${new Date().getFullYear()}"></div>
      <div class="fg"><div class="flabel">Solde initial (j) *</div><input class="finp" type="number" id="la-opening" value="25"></div>
      <div class="fg full"><div class="flabel">Méthode de décompte</div><select class="fsel" id="la-method"><option value="weekdays">Jours ouvrés</option><option value="scheduled">Jours planifiés</option></select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveLeaveAccountForm()">Enregistrer</button>`);
}
async function saveLeaveAccountForm(){
  const ok = await apiAction('saveLeaveAccount', { agent: modalVal('la-agent'), year: Number(modalVal('la-year')), opening: Number(modalVal('la-opening')), method: modalVal('la-method') });
  if(ok){ closeModal(); toast('Solde de congés enregistré'); }
}
function openMemberModal(email){
  const m = email? (STATE.members||[]).find(x=>x.email===email) : null;
  const agents = sortAgentsByNom(STATE.agents.filter(a=>!a.deletedAt));
  const sites = sortSitesByName(STATE.sites.filter(s=>!s.archived));
  openModal('member-modal', m? 'Modifier le droit d’accès' : 'Nouveau droit d’accès', `
    <div class="fgrid">
      <div class="fg full"><div class="flabel">E-mail *</div><input class="finp" id="mb-email" type="email" value="${m?esc(m.email):''}" ${m?'readonly title="L’e-mail identifie ce droit d’accès et ne peut pas être modifié ici"':''}></div>
      <div class="fg full"><div class="flabel">Rôle *</div><select class="fsel" id="mb-role" onchange="onMemberRoleChange()">
        <option value="agent" ${m&&m.role==='agent'?'selected':''}>Agent</option>
        <option value="site" ${m&&m.role==='site'?'selected':''}>Responsable de site</option>
        <option value="direction" ${m&&m.role==='direction'?'selected':''}>Direction</option></select></div>
      <div class="fg full" id="mb-agent-wrap"><div class="flabel">Agent lié</div><select class="fsel" id="mb-agent"><option value="">—</option>${agents.map(a=>`<option value="${a.id}" ${m&&m.agent===a.id?'selected':''}>${esc(displayNomPrenom(a))}</option>`).join('')}</select></div>
      <div class="fg full" id="mb-sites-wrap" style="display:${m&&m.role==='site'?'block':'none'};"><div class="flabel">Sites</div><select class="fsel" id="mb-sites" multiple size="4">${sites.map(s=>`<option value="${s.id}" ${m&&(m.sites||[]).includes(s.id)?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    </div>
  `, `<button class="btn btn-ghost" onclick="closeModal()">Annuler</button><button class="btn btn-primary" onclick="saveMemberForm('${m?jsStr(m.email):''}')">Enregistrer</button>`);
}
function onMemberRoleChange(){
  const role = modalVal('mb-role');
  document.getElementById('mb-sites-wrap').style.display = role==='site'?'block':'none';
}
async function saveMemberForm(originalEmail){
  const role = modalVal('mb-role');
  const values = { email: (originalEmail||modalVal('mb-email')), role, agent: modalVal('mb-agent'), sites: role==='site'? Array.from(document.getElementById('mb-sites').selectedOptions).map(o=>o.value) : [] };
  // saveMember upserts by e-mail: resubmitting the same address edits the existing row in place.
  const ok = await apiAction('saveMember', { values });
  if(ok){ closeModal(); toast('Droit d’accès enregistré'); }
}
async function deleteMember(email){
  const members = STATE.members||[];
  const m = members.find(x=>x.email===email);
  if(!m) return;
  if(currentSession && currentSession.email && currentSession.email.toLowerCase()===email.toLowerCase()){
    toast('Impossible de supprimer votre propre accès', true); return;
  }
  if(m.role==='direction' && members.filter(x=>x.role==='direction').length<=1){
    toast('Impossible de supprimer le dernier accès direction', true); return;
  }
  if(!confirm('Supprimer le droit d’accès de '+email+' ?')) return;
  const ok = await apiAction('deleteMember', { email, confirm:true });
  if(ok) toast('Droit d’accès supprimé');
}

// ── BOOT ────────────────────────────────────────────────────
(function init(){
  const s = getSession();
  if(sessionOk(s)){
    applySession(s);
  }
})();

</script>
</body>
</html>
