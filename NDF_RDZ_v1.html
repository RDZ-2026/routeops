<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a3a3a">
<title>RDZ · Notes de frais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
:root{
  --red:#c0272d;--red-d:#a31f24;--red-l:#fdf2f2;--red-m:#f8dada;
  --accent:#c0272d;--accent-hover:#a31f24;
  --bg:#f2f2f4;--white:#fff;
  --anth:#2d2d2d;--anth2:#3a3a3a;--anth3:#4a4a4a;
  --border:#e2e2e6;--border2:#d0d0d6;
  --text:#2d2d2d;--text2:#4b5563;--text3:#9ca3af;--text4:#c4c4cc;
  --green:#16a34a;--green-l:#f0fdf4;
  --orange:#ea580c;--orange-l:#fff7ed;
  --blue:#2563eb;--blue-l:#eff6ff;
  --yellow:#ca8a04;--yellow-l:#fefce8;
  --gray:#6b7280;--gray-l:#f3f4f6;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);
  --shadow-xl:0 20px 60px rgba(0,0,0,.18);
  --radius:14px;--radius-sm:8px;--radius-xs:5px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
.mono{font-family:'DM Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}

/* ── TOPBAR ── */
.topbar{background:var(--anth2);color:#fff;min-height:56px;display:flex;align-items:center;padding:0 16px;padding-top:env(safe-area-inset-top,0px);gap:12px;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tb-back{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;padding:6px 11px;border-radius:var(--radius-xs);font-size:12px;font-weight:500;text-decoration:none;flex-shrink:0;}
.tb-back:hover{background:rgba(255,255,255,.15);}
.tb-mark{width:32px;height:32px;background:var(--red);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.tb-info{flex:1;min-width:0;}
.tb-brand{font-family:'DM Mono',monospace;font-size:13.5px;font-weight:500;line-height:1.1;}
.tb-sub{font-size:10.5px;color:rgba(255,255,255,.5);}
.tb-user{font-size:12px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
.tb-logout{background:transparent;border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);padding:5px 10px;border-radius:var(--radius-xs);font-size:11.5px;}
.tb-logout:hover{background:rgba(255,255,255,.1);color:#fff;}
.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:4px 10px;flex-shrink:0;}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.sync.loading .dot{background:var(--yellow);animation:pulse 1s infinite;}
.sync.offline .dot{background:var(--text3);}
.sync.error .dot{background:#f87171;}
.sync.clickable{cursor:pointer;}
@keyframes pulse{50%{opacity:.35;}}
@media (max-width:640px){.tb-user,.tb-back span{display:none;}.tb-sub{display:none;}}

/* ── LOGIN ── */
#login-screen{display:none;position:fixed;inset:0;background:var(--anth);z-index:9999;align-items:center;justify-content:center;padding:16px;}
#login-screen.visible{display:flex;}
.login-card{background:#fff;border-radius:16px;padding:34px 36px;width:390px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:26px;}
.login-logo .mk{width:46px;height:46px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-weight:500;font-size:15px;}
.login-card h2{font-size:17px;font-weight:600;margin-bottom:4px;}
.login-card p{font-size:13px;color:var(--gray);margin-bottom:20px;}
.login-err{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#991b1b;margin-top:10px;display:none;}
.login-err.visible{display:block;}
.login-back{display:block;text-align:center;margin-top:16px;font-size:12.5px;color:var(--text3);text-decoration:none;}

/* ── FORMS ── */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;min-width:0;}
.field label,.flabel{font-size:12px;font-weight:600;color:var(--text2);}
.field .hint{font-size:11.5px;color:var(--text3);}
.inp{background:#f7f7f9;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:15px;width:100%;min-width:0;}
.inp:focus{outline:none;border-color:var(--red);background:#fff;}
textarea.inp{resize:vertical;min-height:64px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:480px){.row2.stack{grid-template-columns:1fr;}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border2);background:#fff;border-radius:var(--radius-sm);padding:9px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;}
.btn:hover{background:#f7f7f9;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.primary:hover{background:var(--red-d);}
.btn.dark{background:var(--anth);border-color:var(--anth);color:#fff;}
.btn.danger{color:var(--red);border-color:var(--red-m);}
.btn.danger:hover{background:var(--red-l);}
.btn.ghost{border-color:transparent;background:transparent;}
.btn.block{width:100%;padding:12px;font-size:15px;}

/* ── LAYOUT ── */
#app{display:none;min-height:100%;flex-direction:column;}
#app.visible{display:flex;}
main{flex:1;width:100%;max-width:1160px;margin:0 auto;padding:22px 18px calc(90px + env(safe-area-inset-bottom,0px));}
.page-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
.page-head h1{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:1.15;}
.page-head .grow{flex:1;min-width:200px;}
.page-head .meta{color:var(--text2);font-size:13.5px;margin-top:4px;}

/* status */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:20px;padding:3px 10px;white-space:nowrap;}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;}
.st.en_cours{color:var(--blue);background:var(--blue-l);}
.st.a_rembourser{color:var(--orange);background:var(--orange-l);}
.st.rembourse{color:var(--green);background:var(--green-l);}
.st.annule{color:var(--gray);background:var(--gray-l);}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{border:1px solid var(--border);background:#fff;border-radius:20px;padding:6px 13px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--text2);}
.tab .n{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text3);margin-left:4px;}
.tab.on{background:var(--anth);border-color:var(--anth);color:#fff;}
.tab.on .n{color:rgba(255,255,255,.6);}
.search{margin-bottom:14px;}

/* mission list */
.mlist{display:flex;flex-direction:column;gap:8px;}
.mrow{display:grid;grid-template-columns:4px 1fr auto;gap:0 14px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px 14px 0;cursor:pointer;text-align:left;width:100%;align-items:center;}
.mrow:hover{border-color:var(--border2);box-shadow:var(--shadow);}
.mrow .bar{align-self:stretch;border-radius:0 3px 3px 0;}
.mrow .bar.en_cours{background:var(--blue);}.mrow .bar.a_rembourser{background:var(--orange);}.mrow .bar.rembourse{background:var(--green);}.mrow .bar.annule{background:var(--text4);}
.mrow .nm{font-weight:600;font-size:15px;}
.mrow .sub{font-size:12.5px;color:var(--text2);margin-top:2px;}
.mrow .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px;}
.mrow .amt{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;}
.mrow .amt small{font-size:11px;color:var(--text3);margin-left:3px;}
.empty{text-align:center;padding:48px 20px;color:var(--text2);background:#fff;border:1px dashed var(--border2);border-radius:var(--radius);}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px;}
.empty .btn{margin-top:14px;}

/* mission detail */
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--text2);font-size:13px;font-weight:500;background:none;border:none;margin-bottom:12px;padding:4px 0;}
.backlink:hover{color:var(--red);}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start;}
@media (max-width:900px){.detail{grid-template-columns:1fr;}.detail .side{order:-1;}}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.statusbar{display:flex;gap:4px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;flex-wrap:wrap;margin-bottom:16px;}
.statusbar button{flex:1;min-width:110px;border:none;background:transparent;border-radius:6px;padding:8px 10px;font-weight:600;font-size:13px;color:var(--text2);}
.statusbar button:hover{background:#f7f7f9;}
.statusbar button.on.en_cours{background:var(--blue);color:#fff;}
.statusbar button.on.a_rembourser{background:var(--orange);color:#fff;}
.statusbar button.on.rembourse{background:var(--green);color:#fff;}
.statusbar button.on.annule{background:var(--gray);color:#fff;}
.notice{border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:14px;border:1px solid;}
.notice.info{background:var(--blue-l);border-color:#bfdbfe;color:#1e3a8a;}
.notice.warn{background:var(--yellow-l);border-color:#fde68a;color:#78350f;}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.chip{border:1px solid var(--border);background:#fff;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--text2);}
.chip.on{border-color:var(--red);background:var(--red-l);color:var(--red);}

.day{margin-bottom:16px;}
.day h3{font-size:12.5px;font-weight:600;color:var(--text2);margin:0 2px 6px;display:flex;justify-content:space-between;}
.day h3 .mono{color:var(--text3);font-weight:400;}
.xp{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:6px;width:100%;text-align:left;}
.xp:hover{border-color:var(--border2);}
.thumb{width:52px;height:52px;border-radius:6px;background:var(--gray-l);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:20px;color:var(--text3);border:1px solid var(--border);}
.thumb img{width:100%;height:100%;object-fit:cover;}
.thumb.miss{border-style:dashed;font-size:10.5px;text-align:center;line-height:1.15;padding:3px;color:var(--orange);}
.xp .t{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.xp .d{font-size:12.5px;color:var(--text2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.xp .who{font-size:11.5px;color:var(--text3);margin-top:1px;}
.xp .am{text-align:right;}
.xp .am .chf{font-family:'DM Mono',monospace;font-size:15px;font-weight:500;white-space:nowrap;}
.xp .am .loc,.xp .am .vat{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--text3);white-space:nowrap;}
.xp .am .vat{color:var(--green);}
.pend{font-size:10.5px;font-weight:600;color:var(--yellow);background:var(--yellow-l);border-radius:4px;padding:1px 5px;}
.pend.fail{color:#991b1b;background:#fef2f2;}
.cat{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;}
.cat.repas{background:#fef3c7;color:#92400e;}
.cat.hebergement{background:#ede9fe;color:#5b21b6;}
.cat.deplacement{background:#e0f2fe;color:#075985;}

/* receipt summary: the signature element */
.side{position:sticky;top:76px;}
@media (max-width:900px){.side{position:static;}}
.receipt-wrap{filter:drop-shadow(0 2px 5px rgba(0,0,0,.08)) drop-shadow(0 8px 18px rgba(0,0,0,.05));margin-bottom:26px;}
.receipt{position:relative;background:#fff;border-radius:10px 10px 0 0;padding:20px 20px 16px;font-family:'DM Mono',monospace;font-size:13px;}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-9px;height:9px;background:radial-gradient(circle at 7px 0,#fff 7px,transparent 7.5px) 0 0/14px 9px repeat-x;}
.receipt .rh{font-family:'DM Sans',sans-serif;text-align:center;padding-bottom:12px;border-bottom:1px dashed var(--border2);margin-bottom:12px;}
.receipt .rh b{display:block;font-size:14px;}
.receipt .rh span{font-size:12px;color:var(--text3);}
.rl{display:flex;justify-content:space-between;gap:10px;padding:3px 0;}
.rl span:first-child{color:var(--text2);}
.rl.tot{font-size:17px;font-weight:500;border-top:1px dashed var(--border2);margin-top:8px;padding-top:10px;}
.rl.tot span:first-child{color:var(--text);}
.rl.vat span:last-child{color:var(--green);}
.rsec{font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;color:var(--text3);margin:12px 0 4px;border-top:1px dashed var(--border2);padding-top:10px;}
.rl.sm{font-size:12px;}

/* FAB for agents on mobile */
.fab{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:50;display:none;box-shadow:var(--shadow-lg);}
@media (max-width:900px){.fab.show{display:flex;}.hide-m{display:none!important;}}

/* ── MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(20,20,22,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease;}
@media (min-width:641px){.overlay{align-items:center;padding:20px;}}
@keyframes fade{from{opacity:0;}}
.modal{background:#fff;width:100%;max-width:560px;max-height:94vh;display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:var(--shadow-xl);animation:up .2s ease;}
@media (min-width:641px){.modal{border-radius:16px;max-height:90vh;}}
@keyframes up{from{transform:translateY(24px);opacity:.6;}}
.mh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border);}
.mh h2{flex:1;font-size:17px;font-weight:700;}
.mx{border:none;background:var(--gray-l);width:32px;height:32px;border-radius:50%;font-size:17px;color:var(--text2);}
.mb{padding:18px 20px;overflow-y:auto;flex:1;}
.mf{display:flex;gap:8px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);align-items:center;}
.mf .sp{flex:1;}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.seg button{border:1.5px solid var(--border);background:#fff;border-radius:var(--radius-sm);padding:10px 6px;font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text2);}
.seg button .ic{font-size:20px;}
.seg button.on{border-color:var(--red);background:var(--red-l);color:var(--red);}
.vats{display:flex;gap:6px;flex-wrap:wrap;}
.vats button{border:1.5px solid var(--border);background:#fff;border-radius:20px;padding:6px 12px;font-family:'DM Mono',monospace;font-size:13px;}
.vats button.on{border-color:var(--green);background:var(--green-l);color:var(--green);font-weight:500;}
.vatinfo{font-size:12.5px;color:var(--green);margin-top:6px;font-family:'DM Mono',monospace;}
.rate{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:4px;}
.warnline{font-size:12px;color:var(--orange);margin-top:4px;}
.drop{border:2px dashed var(--border2);border-radius:var(--radius);padding:18px;text-align:center;background:#fafafb;}
.drop .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.drop p{font-size:13px;color:var(--text2);}
.preview{position:relative;border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border);background:var(--gray-l);}
.preview img{display:block;width:100%;max-height:320px;object-fit:contain;background:#222;}
.preview .pdf{padding:26px;text-align:center;font-size:14px;color:var(--text2);}
.preview .pb{display:flex;gap:8px;padding:8px;background:#fff;border-top:1px solid var(--border);}
.agents{max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-sm);}
.agents label{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--border);font-size:14px;cursor:pointer;}
.agents label:last-child{border-bottom:none;}
.agents input{width:18px;height:18px;accent-color:var(--red);}
.agents .em{font-size:11.5px;color:var(--text3);margin-left:auto;}
.viewer img{width:100%;border-radius:var(--radius-sm);}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin-top:14px;}
.kv dt{color:var(--text3);}
.kv dd{font-family:'DM Mono',monospace;}

/* ── TOAST / PROGRESS ── */
#toasts{position:fixed;top:70px;right:14px;z-index:9000;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.toast{background:var(--anth);color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);max-width:340px;animation:fade .2s;}
.toast.err{background:#991b1b;}.toast.warn{background:#92400e;}.toast.ok{background:#166534;}
.prog{height:6px;background:var(--gray-l);border-radius:3px;overflow:hidden;margin-top:12px;}
.prog div{height:100%;background:var(--red);width:0;transition:width .2s;}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="mk">RDZ</div>
      <div>
        <div style="font-family:'DM Mono',monospace;font-size:14px;font-weight:500;">RDZ Security</div>
        <div style="font-size:12px;color:var(--text3);">NDF_RDZ v1</div>
      </div>
    </div>
    <h2>Notes de frais</h2>
    <p>Connectez-vous pour déposer ou gérer les frais de mission.</p>
    <div class="field">
      <label for="login-email">Adresse e-mail</label>
      <input class="inp" type="email" id="login-email" placeholder="prenom.nom@rdz-security-management.ch" autocomplete="username">
    </div>
    <div class="field">
      <label for="login-pass">Mot de passe</label>
      <input class="inp" type="password" id="login-pass" autocomplete="current-password">
    </div>
    <button class="btn primary block" id="login-btn">Se connecter</button>
    <div class="login-err" id="login-err"></div>
    <a href="https://rdz-2026.github.io/routeops/RDZ_index.html" class="login-back">← Retour au portail RDZ</a>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="topbar">
    <a href="https://rdz-2026.github.io/routeops/RDZ_index.html" class="tb-back">←<span> Portail</span></a>
    <div class="tb-mark">🧾</div>
    <div class="tb-info">
      <div class="tb-brand">NDF_RDZ</div>
      <div class="tb-sub" id="tb-sub">Notes de frais</div>
    </div>
    <div class="sync" id="sync"><span class="dot"></span><span id="sync-txt">Connecté</span></div>
    <div class="tb-user" id="tb-user"></div>
    <button class="tb-logout" id="btn-logout">Déconnexion</button>
  </header>
  <main id="main"></main>
</div>
<div id="toasts"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════════════
//  CONFIG

//  INDEXEDDB (cache, outbox, receipt blobs)

let _db = null;
function idb() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open('ndf_rdz', 1);
    r.onupgradeneeded = () => {
      const db = r.result;
      if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
      if (!db.objectStoreNames.contains('outbox')) db.createObjectStore('outbox', { keyPath: 'seq', autoIncrement: true });
      if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs');
    };
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function idbReq(store, mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, mode);
    const st = tx.objectStore(store);
    let out;
    const r = fn(st);
    if (r) r.onsuccess = () => { out = r.result; };
    tx.oncomplete = () => res(out);
    tx.onerror = () => rej(tx.error);
    tx.onabort = () => rej(tx.error);
  });
}
const kvGet = (k) => idbReq('kv', 'readonly', (s) => s.get(k));
const kvSet = (k, v) => idbReq('kv', 'readwrite', (s) => s.put(v, k));
const blobGet = (k) => idbReq('blobs', 'readonly', (s) => s.get(k));
const blobSet = (k, v) => idbReq('blobs', 'readwrite', (s) => s.put(v, k));
const blobDel = (k) => idbReq('blobs', 'readwrite', (s) => s.delete(k));
const outboxAll = () => idbReq('outbox', 'readonly', (s) => s.getAll());
const outboxAdd = (op) => idbReq('outbox', 'readwrite', (s) => s.add(op));
const outboxPut = (op) => idbReq('outbox', 'readwrite', (s) => s.put(op));
const outboxDel = (seq) => idbReq('outbox', 'readwrite', (s) => s.delete(seq));

function saveSession() { if (session) localStorage.setItem(AUTH_KEY, JSON.stringify(session)); }
let refreshing = null;
async function ensureToken(force = false) {
  if (!session) throw new Error('Session absente');
  const now = Math.floor(Date.now() / 1000);
  if (!force && session.expires_at && session.expires_at - now > 120) return session.access_token;
  if (!navigator.onLine) return session.access_token;
  if (!refreshing) {
    refreshing = (async () => {
      const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
        body: JSON.stringify({ refresh_token: session.refresh_token }),
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.access_token) { const e = new Error('Session expirée — reconnectez-vous.'); e.auth = true; throw e; }
      session = { ...session, access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || now + (d.expires_in || 3600), user: d.user || session.user };
      saveSession();
      return session.access_token;
    })().finally(() => { refreshing = null; });
  }
  return refreshing;
}

class HttpError extends Error { constructor(status, msg) { super(msg); this.status = status; } }

async function authFetch(url, opts = {}, retry = true) {
  const token = await ensureToken();
  const headers = { apikey: SB_KEY, Authorization: `Bearer ${token}`, ...(opts.headers || {}) };
  const res = await fetch(url, { ...opts, headers });
  if (res.status === 401 && retry) { await ensureToken(true); return authFetch(url, opts, false); }
  return res;
}

async function api(path, opts = {}) {
  const res = await authFetch(`${SB_URL}/rest/v1/${path}`, { ...opts, headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  const text = await res.text();
  if (!res.ok) {
    let msg = text;
    try { const j = JSON.parse(text); msg = j.message || j.error || text; } catch (_) {}
    throw new HttpError(res.status, msg || `HTTP ${res.status}`);
  }
  if (!text || !text.trim()) return null;
  try { return JSON.parse(text); } catch (_) { return null; }
}

const cacheKey = () => 'state_' + myId();
async function saveCache() { try { await kvSet(cacheKey(), { missions: S.missions, members: S.members, expenses: S.expenses, users: S.users, at: Date.now() }); } catch (_) {} }

function applyOp(op) {
  if (op.type !== 'upsert' && op.type !== 'delete') return;
  const t = TABLES[op.table];
  const list = S[t.key];
  const key = pkOf(op.table, op.row);
  const i = list.findIndex((r) => pkOf(op.table, r) === key);
  if (op.type === 'upsert') {
    const merged = { ...(i >= 0 ? list[i] : {}), ...op.row };
    if (op.table === 'ndf_expenses') merged.vat_amount = vatOf(merged);
    if (i >= 0) list[i] = merged; else list.push(merged);
  } else if (i >= 0) {
    list.splice(i, 1);
    if (op.table === 'ndf_missions') {
      S.members = S.members.filter((m) => m.mission_id !== op.row.id);
      S.expenses = S.expenses.filter((x) => x.mission_id !== op.row.id);
    }
  }
}

async function refreshOutboxState() {
  const ops = await outboxAll().catch(() => []);
  const st = { pending: 0, failed: 0, pendingIds: new Set(), failedIds: new Set() };
  ops.forEach((o) => {
    if (o.failed) st.failed++; else st.pending++;
    if (o.table === 'ndf_expenses' && o.row) (o.failed ? st.failedIds : st.pendingIds).add(o.row.id);
    if (o.type === 'upload' && o.expenseId) (o.failed ? st.failedIds : st.pendingIds).add(o.expenseId);
  });
  outboxState = st;
  return ops;
}

// Queue local changes: apply immediately, persist, sync later
async function enqueue(ops) {
  for (const op of ops) {
    op.at = Date.now();
    await outboxAdd(op);
    applyOp(op);
  }
  await refreshOutboxState();
  await saveCache();
  render();
  updateSyncBadge();
  sync();
}

async function sync() {
  if (syncing) return;
  if (!navigator.onLine) { updateSyncBadge(); return; }
  syncing = true;
  let hadError = false;
  try {
    let ops = (await outboxAll()).filter((o) => !o.failed).sort((a, b) => a.seq - b.seq);
    if (!ops.length) return;
    setSync('loading', 'Envoi…');
    for (const op of ops) {
      try {
        await runOp(op);
        await outboxDel(op.seq);
      } catch (e) {
        if (e.auth) { hadError = true; showLogin(e.message); break; }
        if (e instanceof HttpError) {
          hadError = true;
          op.failed = true; op.error = e.message; op.status = e.status;
          await outboxPut(op);
          toast(describeOp(op) + ' : refusé par le serveur (' + e.message + ')', 'err');
        } else { break; } // network: stop and retry later
      }
    }
  } finally {
    syncing = false;
    await refreshOutboxState();
    render();
    updateSyncBadge(hadError);
  }
}

async function runOp(op) {
  if (op.type === 'upsert') {
    const cols = COLS[op.table];
    const body = {};
    cols.forEach((c) => { if (c in op.row) body[c] = op.row[c]; });
    const conflict = TABLES[op.table].pk.join(',');
    await api(`${op.table}?on_conflict=${conflict}`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=representation' }, body: JSON.stringify(body) })
      .then((rows) => { if (Array.isArray(rows) && rows.length === 0) throw new HttpError(403, 'écriture refusée'); });
  } else if (op.type === 'delete') {
    const q = TABLES[op.table].pk.map((k) => `${k}=eq.${encodeURIComponent(op.row[k])}`).join('&');
    await api(`${op.table}?${q}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
  } else if (op.type === 'upload') {
    const rec = await blobGet(op.path);
    if (!rec || !rec.blob) return; // blob gone (replaced/deleted) — nothing to send
    const res = await authFetch(`${SB_URL}/storage/v1/object/${BUCKET}/${op.path}`, { method: 'POST', headers: { 'Content-Type': rec.type, 'x-upsert': 'true', 'cache-control': '3600' }, body: rec.blob });
    if (!res.ok) { const t = await res.text(); let m = t; try { m = JSON.parse(t).message || t; } catch (_) {} throw new HttpError(res.status, m); }
  } else if (op.type === 'remove') {
    const res = await authFetch(`${SB_URL}/storage/v1/object/${BUCKET}/${op.path}`, { method: 'DELETE' });
    if (!res.ok && res.status !== 404 && res.status !== 400) throw new HttpError(res.status, await res.text());
  }
}

function describeOp(op) {
  if (op.type === 'upload') return 'Envoi du justificatif';
  if (op.type === 'remove') return 'Suppression du justificatif';
  const what = { ndf_missions: 'Mission', ndf_mission_agents: 'Affectation', ndf_expenses: 'Note de frais' }[op.table];
  return `${what} (${op.type === 'delete' ? 'suppression' : 'enregistrement'})`;
}

function setSync(state, txt) {
  const el = $('sync');
  el.className = 'sync ' + state;
  $('sync-txt').textContent = txt || { ok: 'Synchronisé', offline: 'Hors ligne', loading: 'Synchro…', error: 'Erreur' }[state];
}
function updateSyncBadge() {
  const el = $('sync');
  const { pending, failed } = outboxState;
  el.classList.toggle('clickable', failed > 0 || pending > 0);
  if (failed) return setSync('error', `${failed} en échec`), el.classList.add('clickable');
  if (!navigator.onLine) return setSync('offline', pending ? `Hors ligne · ${pending} en attente` : 'Hors ligne'), pending && el.classList.add('clickable');
  if (pending) return setSync('loading', `${pending} en attente`), el.classList.add('clickable');
  setSync('ok');
}

async function openOutbox() {
  const ops = (await outboxAll()).sort((a, b) => a.seq - b.seq);
  if (!ops.length) { if (navigator.onLine) fetchAll(); return; }
  const rows = ops.map((o) => `<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);">
      <div style="flex:1;min-width:0;"><div style="font-weight:600;font-size:13.5px;">${esc(describeOp(o))}</div>
      <div style="font-size:12px;color:${o.failed ? '#991b1b' : 'var(--text3)'};">${o.failed ? esc(o.error || 'Refusé') : 'En attente de connexion'}</div></div>
      ${o.failed ? `<button class="btn danger" data-drop="${o.seq}" style="padding:6px 10px;font-size:12px;">Abandonner</button>` : ''}
    </div>`).join('');
  const m = openModal({
    title: 'Modifications en attente',
    body: `<p style="font-size:13px;color:var(--text2);margin-bottom:8px;">Les modifications faites hors ligne sont envoyées automatiquement dès que la connexion revient. Celles refusées par le serveur (mission clôturée, droits insuffisants…) peuvent être renvoyées ou abandonnées.</p>${rows}`,
    foot: `<span class="sp"></span><button class="btn" data-close>Fermer</button><button class="btn primary" id="ob-retry">Renvoyer maintenant</button>`,
  });
  m.el.querySelectorAll('[data-drop]').forEach((b) => b.onclick = async () => {
    await outboxDel(Number(b.dataset.drop));
    m.close(); await fetchAll(); openOutbox();
  });
  m.el.querySelector('#ob-retry').onclick = async () => {
    const all = await outboxAll();
    for (const o of all) if (o.failed) { delete o.failed; delete o.error; await outboxPut(o); }
    m.close(); await sync(); await fetchAll();
  };
}

//  RECEIPTS (image compression, blob cache, auth download)
// ════════════════════════════════════════════════════════════════
async function processFile(file) {
  if (!file) return null;
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  if (isPdf) {
    if (file.size > 10 * 1024 * 1024) throw new Error('PDF trop lourd (10 Mo maximum).');
    return { blob: file, type: 'application/pdf', ext: 'pdf' };
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Format d\'image non reconnu. Reprenez la photo ou choisissez un JPEG/PNG.')); i.src = url; });
    const max = 1800;
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
    ctx.drawImage(img, 0, 0, w, h);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.8));
    if (!blob) throw new Error('Compression de l\'image impossible.');
    return { blob, type: 'image/jpeg', ext: 'jpg' };
  } finally { URL.revokeObjectURL(url); }
}

async function getReceiptBlob(path) {
  if (!path) return null;
  const cached = await blobGet(path).catch(() => null);
  if (cached && cached.blob) return cached;
  if (!navigator.onLine) return null;
  const res = await authFetch(`${SB_URL}/storage/v1/object/authenticated/${BUCKET}/${path}`);
  if (!res.ok) return null;
  const blob = await res.blob();
  const rec = { blob, type: blob.type || (path.endsWith('.pdf') ? 'application/pdf' : 'image/jpeg') };
  await blobSet(path, rec).catch(() => {});
  return rec;
}

async function getReceiptURL(path) {
  if (blobUrls.has(path)) return blobUrls.get(path);
  const rec = await getReceiptBlob(path);
  if (!rec) return null;
  const u = URL.createObjectURL(rec.blob);
  blobUrls.set(path, u);
  return u;
}
function forgetReceiptURL(path) { const u = blobUrls.get(path); if (u) { URL.revokeObjectURL(u); blobUrls.delete(path); } }

// Load thumbnails for the visible list, 3 at a time
async function hydrateThumbs(root) {
  const els = [...root.querySelectorAll('[data-thumb]')];
  let i = 0;
  const worker = async () => {
    while (i < els.length) {
      const el = els[i++];
      const path = el.dataset.thumb;
      if (el.dataset.type === 'application/pdf') { el.innerHTML = '📄'; continue; }
      try { const u = await getReceiptURL(path); if (u && el.isConnected) el.innerHTML = `<img src="${u}" alt="">`; else if (!u) el.innerHTML = '🧾'; } catch (_) { el.innerHTML = '🧾'; }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}

function openModal({ title, body, foot, wide }) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true" ${wide ? 'style="max-width:760px"' : ''}>
    <div class="mh"><h2>${esc(title)}</h2><button class="mx" data-close aria-label="Fermer">×</button></div>
    <div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';
  const close = () => { ov.remove(); if (!document.querySelector('.overlay')) document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') { const all = document.querySelectorAll('.overlay'); if (all[all.length - 1] === ov) close(); } };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('mousedown', (e) => { if (e.target === ov) close(); });
  ov.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', close));
  return { el: ov, close };
}

function confirmDialog(title, text, okLabel = 'Confirmer', danger = false) {
  return new Promise((resolve) => {
    const m = openModal({
      title, body: `<p style="font-size:14px;color:var(--text2);">${esc(text)}</p>`,
      foot: `<span class="sp"></span><button class="btn" data-no>Annuler</button><button class="btn ${danger ? 'danger' : 'primary'}" data-yes>${esc(okLabel)}</button>`,
    });
    let done = false;
    const fin = (v) => { if (done) return; done = true; m.close(); resolve(v); };
    m.el.querySelector('[data-yes]').onclick = () => fin(true);
    m.el.querySelector('[data-no]').onclick = () => fin(false);
    m.el.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => fin(false)));
    new MutationObserver((_, obs) => { if (!m.el.isConnected) { obs.disconnect(); fin(false); } }).observe(document.body, { childList: true });
  });
}

function missionExpenses(mid, onlyMine = !isAdmin()) {
  return S.expenses.filter((x) => x.mission_id === mid && (!onlyMine || x.user_id === myId()))
    .sort((a, b) => (a.expense_date || '').localeCompare(b.expense_date || '') || (a.created_at || '').localeCompare(b.created_at || ''));
}
function missionMembers(mid) { return S.members.filter((m) => m.mission_id === mid).map((m) => m.user_id); }
function totals(list) {
  const t = { chf: 0, vat: 0, count: list.length, receipts: 0, byCat: {}, byAgent: {}, byRate: {} };
  CATS.forEach((c) => (t.byCat[c.id] = 0));
  list.forEach((x) => {
    const chf = Number(x.amount_chf) || 0, vat = vatOf(x);
    t.chf += chf; t.vat += vat;
    t.byCat[x.category] = (t.byCat[x.category] || 0) + chf;
    t.byAgent[x.user_id] = (t.byAgent[x.user_id] || 0) + chf;
    if (vat > 0) { const k = String(Number(x.vat_rate)); t.byRate[k] = t.byRate[k] || { base: 0, vat: 0 }; t.byRate[k].base += chf; t.byRate[k].vat += vat; }
    if (x.receipt_path) t.receipts++;
  });
  t.chf = round2(t.chf); t.vat = round2(t.vat);
  return t;
}
function visibleMissions() {
  if (isAdmin()) return S.missions;
  const mine = new Set(S.members.filter((m) => m.user_id === myId()).map((m) => m.mission_id));
  return S.missions.filter((m) => mine.has(m.id));
}
function canEditExpense(x, mission) {
  if (isAdmin()) return true;
  return x.user_id === myId() && mission && mission.status === 'en_cours';
}

    const t = totals(missionExpenses(m.id));

    const dates = m.start_date ? (m.end_date && m.end_date !== m.start_date ? `du ${fdate(m.start_date)} au ${fdate(m.end_date)}` : `le ${fdate(m.start_date)}`) : 'dates à définir';

    </button>`;
  }).join('');
  const tabs = [...STATUSES.map((s) => ({ id: s.id, label: s.label, n: counts[s.id] })), { id: 'all', label: 'Toutes', n: all.length }]
    .map((t) => `<button class="tab ${route.filter === t.id ? 'on' : ''}" data-filter="${t.id}">${t.label}<span class="n">${t.n}</span></button>`).join('');
  let empty = '';

    if (!all.length) empty = admin
      ? `<div class="empty"><b>Aucune mission pour l'instant</b>Créez une mission, affectez-y les agents, et ils pourront y déposer leurs notes de frais.<br><button class="btn primary" data-new>Créer une mission</button></div>`
      : `<div class="empty"><b>Aucune mission ne vous est affectée</b>Dès que la direction vous affecte à une mission, elle apparaît ici.</div>`;

  }

    <div class="page-head"><div class="grow"><h1>${admin ? 'Missions' : 'Mes missions'}</h1>
      <div class="meta">${admin ? 'Frais de protection rapprochée par mission' : 'Déposez vos frais dans la mission en cours'}</div></div>
      ${admin ? '<button class="btn primary" data-new>Nouvelle mission</button>' : ''}</div>
    <div class="tabs">${tabs}</div>
    ${all.length > 5 ? `<div class="search"><input class="inp" id="q" placeholder="Rechercher une mission, un client, une destination" value="${esc(route.search)}"></div>` : ''}
    <div class="mlist">${rows}</div>${empty}`;
  $('main').querySelectorAll('[data-filter]').forEach((b) => b.onclick = () => { route.filter = b.dataset.filter; renderList(); });
  $('main').querySelectorAll('[data-open]').forEach((b) => b.onclick = () => openMission(b.dataset.open));
  $('main').querySelectorAll('[data-new]').forEach((b) => b.onclick = () => missionModal());
  const qi = $('q');
  if (qi) qi.oninput = () => { route.search = qi.value; const pos = qi.selectionStart; renderList(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); };
}

function openMission(id) {
  route = { ...route, view: 'mission', missionId: id, agent: 'all' };
  window.scrollTo(0, 0);
  history.pushState({ mission: id }, '', '#m=' + id);
  render();
}
function backToList() {
  route.view = 'list';
  if (location.hash) history.pushState({}, '', location.pathname);
  render();
}

function renderMission(m) {
  const admin = isAdmin();
  const allX = missionExpenses(m.id);
  const members = missionMembers(m.id);
  const list = route.agent === 'all' ? allX : allX.filter((x) => x.user_id === route.agent);
  const t = totals(allX);
  const open = m.status === 'en_cours';
  const canAdd = admin ? members.length > 0 : open && members.includes(myId());
  const dates = m.start_date ? (m.end_date && m.end_date !== m.start_date ? `Du ${fdate(m.start_date)} au ${fdate(m.end_date)}` : `Le ${fdate(m.start_date)}`) : '';
  const meta = [m.client, m.destination, dates].filter(Boolean).map(esc).join(', ');

  // Group by day
  const byDay = {};
  list.forEach((x) => (byDay[x.expense_date] = byDay[x.expense_date] || []).push(x));
  const daysHtml = Object.keys(byDay).sort().map((d) => {
    const items = byDay[d];
    const sum = items.reduce((s, x) => s + (Number(x.amount_chf) || 0), 0);
    return `<div class="day"><h3><span>${fdayLong(d)}</span><span class="mono">${fmt(sum)} CHF</span></h3>${items.map((x) => xpRow(x, admin)).join('')}</div>`;
  }).join('');

  const agentChips = admin && members.length > 1
    ? `<div class="chips"><button class="chip ${route.agent === 'all' ? 'on' : ''}" data-agent="all">Tous les agents</button>${members.map((u) => `<button class="chip ${route.agent === u ? 'on' : ''}" data-agent="${u}">${esc(userName(u))}</button>`).join('')}</div>` : '';

  let notice = '';
  if (!admin && !open) notice = `<div class="notice info">Mission ${statusOf(m.status).label.toLowerCase()} : les notes de frais ne peuvent plus être ajoutées ni modifiées.</div>`;
  if (admin && !members.length) notice = `<div class="notice warn">Aucun agent n'est affecté à cette mission. Modifiez la mission pour en ajouter.</div>`;
  const missing = allX.filter((x) => !x.receipt_path).length;

  const statusBar = admin
    ? `<div class="statusbar" role="group" aria-label="Statut de la mission">${STATUSES.map((s) => `<button class="${s.id} ${m.status === s.id ? 'on' : ''}" data-status="${s.id}">${s.label}</button>`).join('')}</div>`
    : '';

  const agentLines = admin && Object.keys(t.byAgent).length
    ? `<div class="rsec">À rembourser par agent</div>${Object.entries(t.byAgent).sort((a, b) => userName(a[0]).localeCompare(userName(b[0]))).map(([u, v]) => `<div class="rl sm"><span>${esc(userName(u))}</span><span>${fmt(v)}</span></div>`).join('')}` : '';
  const rateLines = Object.keys(t.byRate).length
    ? `<div class="rsec">TVA récupérable par taux</div>${Object.entries(t.byRate).sort((a, b) => Number(a[0]) - Number(b[0])).map(([r, v]) => `<div class="rl sm vat"><span>${String(r).replace('.', ',')} % sur ${fmt(v.base)}</span><span>${fmt(v.vat)}</span></div>`).join('')}` : '';

  $('main').innerHTML = `
    <button class="backlink" id="back">← ${admin ? 'Missions' : 'Mes missions'}</button>
    <div class="page-head"><div class="grow"><h1>${esc(m.name)}</h1>${meta ? `<div class="meta">${meta}</div>` : ''}</div>
      ${admin ? '' : `<span class="st ${m.status}">${statusOf(m.status).label}</span>`}</div>
    ${statusBar}
    <div class="actions">
      ${canAdd ? `<button class="btn primary ${admin ? '' : 'hide-m'}" id="add">Ajouter une note de frais</button>` : ''}
      ${admin ? `<button class="btn" id="edit">Modifier la mission</button>
        <button class="btn" id="xls" ${allX.length ? '' : 'disabled'}>Exporter en Excel</button>
        <button class="btn" id="pdf" ${t.receipts ? '' : 'disabled'}>PDF des justificatifs</button>` : ''}
    </div>
    ${notice}
    <div class="detail">
      <section>${agentChips}${daysHtml || `<div class="empty"><b>Aucune note de frais</b>${canAdd ? 'Ajoutez la première dépense : date, type, montant et photo du ticket.' : 'Les frais déposés apparaîtront ici.'}</div>`}</section>
      <aside class="side"><div class="receipt-wrap"><div class="receipt">
        <div class="rh"><b>${admin ? 'Total mission' : 'Mes frais'}</b><span>${t.count} note${t.count > 1 ? 's' : ''}, ${t.receipts} justificatif${t.receipts > 1 ? 's' : ''}</span></div>
        ${CATS.map((c) => `<div class="rl"><span>${c.short}</span><span>${fmt(t.byCat[c.id])}</span></div>`).join('')}
        <div class="rl tot"><span>Total CHF</span><span>${fmt(t.chf)}</span></div>
        <div class="rl vat"><span>dont TVA récupérable</span><span>${fmt(t.vat)}</span></div>
        ${rateLines}${agentLines}
        ${missing ? `<div class="rsec" style="color:var(--orange);">${missing} note${missing > 1 ? 's' : ''} sans justificatif</div>` : ''}
      </div></div></aside>
    </div>`;

  if (canAdd && !admin) {
    const fab = document.createElement('button');
    fab.className = 'btn primary block fab show';
    fab.textContent = 'Ajouter une note de frais';
    fab.onclick = () => expenseModal(m);
    document.body.appendChild(fab);
  }
  $('back').onclick = backToList;
  const addB = $('add'); if (addB) addB.onclick = () => expenseModal(m);
  if (admin) {
    $('edit').onclick = () => missionModal(m);
    $('xls').onclick = () => exportExcel(m);
    $('pdf').onclick = () => exportPdf(m);
    $('main').querySelectorAll('[data-status]').forEach((b) => b.onclick = () => changeStatus(m, b.dataset.status));
    $('main').querySelectorAll('[data-agent]').forEach((b) => b.onclick = () => { route.agent = b.dataset.agent; renderMission(m); });
  }
  $('main').querySelectorAll('[data-xp]').forEach((b) => b.onclick = () => {
    const x = S.expenses.find((e) => e.id === b.dataset.xp);
    if (!x) return;
    if (canEditExpense(x, m)) expenseModal(m, x); else viewExpense(m, x);
  });
  hydrateThumbs($('main'));
}

function xpRow(x, admin) {
  const c = catOf(x.category);
  const vat = vatOf(x);
  const pend = outboxState.failedIds.has(x.id) ? '<span class="pend fail">Refusée</span>' : outboxState.pendingIds.has(x.id) ? '<span class="pend">Non envoyée</span>' : '';
  const thumb = x.receipt_path
    ? `<span class="thumb" data-thumb="${esc(x.receipt_path)}" data-type="${esc(x.receipt_type || '')}">🧾</span>`
    : '<span class="thumb miss">sans<br>ticket</span>';
  return `<button class="xp" data-xp="${x.id}">${thumb}

    <span class="am"><div class="chf">${fmt(x.amount_chf)} CHF</div>

      ${vat > 0 ? `<div class="vat">TVA ${String(Number(x.vat_rate)).replace('.', ',')} % : ${fmt(vat)}</div>` : ''}</span>

async function changeStatus(m, status) {
  if (m.status === status) return;
  const texts = {
    en_cours: ['Rouvrir la mission', 'Les agents pourront de nouveau ajouter et modifier leurs notes de frais.', 'Rouvrir'],
    a_rembourser: ['Clôturer les frais', 'Les agents ne pourront plus ajouter ni modifier de frais sur cette mission. Vous pourrez ensuite exporter et rembourser.', 'Passer à « À rembourser »'],
    rembourse: ['Marquer comme remboursée', 'Confirmez que les frais de cette mission ont été remboursés aux agents.', 'Marquer remboursée'],
    annule: ['Annuler la mission', 'La mission sera marquée comme annulée. Les notes de frais restent consultables.', 'Annuler la mission'],
  }[status];
  if (!(await confirmDialog(texts[0], texts[1], texts[2], status === 'annule'))) return;
  await enqueue([{ type: 'upsert', table: 'ndf_missions', row: { ...pick(m, COLS.ndf_missions), status } }]);
  toast(`Mission : ${statusOf(status).label}`, 'ok');
}
const pick = (o, keys) => { const r = {}; keys.forEach((k) => { if (k in o) r[k] = o[k]; }); return r; };

function missionModal(m) {
  const isNew = !m;
  m = m || { id: uuid(), name: '', client: '', destination: '', start_date: todayISO(), end_date: '', default_currency: 'CHF', status: 'en_cours', notes: '' };
  const current = new Set(missionMembers(m.id));
  const users = [...S.users].filter((u) => u.active !== false || current.has(u.id)).sort((a, b) => String(a.full_name).localeCompare(String(b.full_name)));
  const hasX = S.expenses.some((x) => x.mission_id === m.id);
  const agentsHtml = users.length
    ? users.map((u) => `<label><input type="checkbox" value="${u.id}" ${current.has(u.id) ? 'checked' : ''}><span>${esc(u.full_name || u.email)}</span><span class="em">${esc(u.role || '')}</span></label>`).join('')
    : '<div style="padding:14px;font-size:13px;color:var(--text3);">Liste des utilisateurs indisponible (hors ligne ou fonction ndf_list_users absente).</div>';
  const md = openModal({
    title: isNew ? 'Nouvelle mission' : 'Modifier la mission',
    body: `
      <div class="field"><label for="f-name">Nom de la mission</label><input class="inp" id="f-name" value="${esc(m.name)}" placeholder="Ex. Protection rapprochée — Dubaï"></div>
      <div class="row2 stack"><div class="field"><label for="f-client">Client</label><input class="inp" id="f-client" value="${esc(m.client || '')}"></div>
        <div class="field"><label for="f-dest">Destination</label><input class="inp" id="f-dest" value="${esc(m.destination || '')}" placeholder="Ville, pays"></div></div>
      <div class="row2"><div class="field"><label for="f-start">Début</label><input class="inp" type="date" id="f-start" value="${esc(m.start_date || '')}"></div>
        <div class="field"><label for="f-end">Fin</label><input class="inp" type="date" id="f-end" value="${esc(m.end_date || '')}"></div></div>
      <div class="field"><label for="f-cur">Devise locale principale</label><input class="inp mono" id="f-cur" list="curlist" maxlength="3" value="${esc(m.default_currency || 'CHF')}" style="text-transform:uppercase;max-width:140px;">
        <span class="hint">Proposée par défaut aux agents lors de la saisie.</span></div>
      <div class="field"><span class="flabel">Agents affectés</span>
        ${users.length > 8 ? '<input class="inp" id="f-agsearch" placeholder="Filtrer les agents" style="margin-bottom:6px;">' : ''}
        <div class="agents" id="f-agents">${agentsHtml}</div></div>
      <div class="field"><label for="f-notes">Notes internes</label><textarea class="inp" id="f-notes">${esc(m.notes || '')}</textarea></div>
      <datalist id="curlist">${CURRENCIES.map((c) => `<option value="${c}">`).join('')}</datalist>
      <div class="login-err" id="f-err"></div>`,
    foot: `${!isNew && !hasX ? '<button class="btn danger" id="f-del">Supprimer</button>' : ''}<span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn primary" id="f-save">${isNew ? 'Créer la mission' : 'Enregistrer'}</button>`,
  });
  const el = md.el;
  const sIn = el.querySelector('#f-agsearch');
  if (sIn) sIn.oninput = () => { const q = sIn.value.toLowerCase(); el.querySelectorAll('#f-agents label').forEach((l) => (l.style.display = l.textContent.toLowerCase().includes(q) ? '' : 'none')); };
  el.querySelector('#f-save').onclick = async () => {
    const err = el.querySelector('#f-err');

    const cur = el.querySelector('#f-cur').value.trim().toUpperCase();
    const start = el.querySelector('#f-start').value || null, end = el.querySelector('#f-end').value || null;
    const fail = (t) => { err.textContent = t; err.classList.add('visible'); };
    if (!name) return fail('Donnez un nom à la mission.');
    if (!/^[A-Z]{3}$/.test(cur)) return fail('La devise doit être un code à 3 lettres (ex. CHF, EUR, AED).');

    md.close();
    await enqueue(ops);
    toast(isNew ? 'Mission créée' : 'Mission enregistrée', 'ok');
    if (isNew) openMission(m.id);
  };
  const del = el.querySelector('#f-del');
  if (del) del.onclick = async () => {
    if (!(await confirmDialog('Supprimer la mission', `« ${m.name} » et ses affectations seront supprimées définitivement.`, 'Supprimer', true))) return;
    md.close();
    await enqueue([{ type: 'delete', table: 'ndf_missions', row: { id: m.id } }]);
    toast('Mission supprimée', 'ok');
    backToList();
  };
}

// ════════════════════════════════════════════════════════════════
//  EXPENSE MODAL
// ════════════════════════════════════════════════════════════════
function expenseModal(m, x) {
  const isNew = !x;
  const admin = isAdmin();
  const members = missionMembers(m.id);
  const defaultUser = admin ? (route.agent !== 'all' ? route.agent : members.includes(myId()) ? myId() : members[0]) : myId();
  x = x ? { ...x } : { id: uuid(), mission_id: m.id, user_id: defaultUser, expense_date: todayISO(), category: 'repas', description: '', currency: m.default_currency || 'CHF', amount_local: '', amount_chf: '', vat_rate: null, receipt_path: null, receipt_type: null };
  // Editable state
  const st = {
    cat: x.category,
    vat: x.currency === 'CHF' ? (x.vat_rate === null || x.vat_rate === undefined ? (isNew ? catOf(x.category).vat : 0) : Number(x.vat_rate)) : catOf(x.category).vat,
    vatTouched: !isNew,
    otherMode: false,
    file: null,           // {blob,type,ext} newly selected
    removeReceipt: false,
    previewUrl: null,
  };
  const agentSel = admin
    ? `<div class="field"><label for="x-user">Agent</label><select class="inp" id="x-user">${members.map((u) => `<option value="${u}" ${u === x.user_id ? 'selected' : ''}>${esc(userName(u))}</option>`).join('')}</select></div>` : '';
  const md = openModal({
    title: isNew ? 'Nouvelle note de frais' : 'Note de frais',
    body: `${agentSel}
      <div class="field"><span class="flabel">Type de frais</span><div class="seg" id="x-cat">${CATS.map((c) => `<button type="button" data-cat="${c.id}" class="${st.cat === c.id ? 'on' : ''}"><span class="ic">${c.icon}</span>${c.short}</button>`).join('')}</div></div>
      <div class="row2"><div class="field"><label for="x-date">Date</label><input class="inp" type="date" id="x-date" value="${esc(x.expense_date)}"><div class="warnline" id="x-datewarn"></div></div>
        <div class="field"><label for="x-cur">Devise</label><input class="inp mono" id="x-cur" list="xcurlist" maxlength="3" value="${esc(x.currency)}" style="text-transform:uppercase;"></div></div>
      <div class="row2">
        <div class="field"><label for="x-loc" id="x-loclabel">Montant payé</label><input class="inp mono" id="x-loc" inputmode="decimal" value="${x.amount_local === '' ? '' : esc(x.amount_local)}" placeholder="0.00"></div>
        <div class="field" id="x-chfwrap"><label for="x-chf">Montant en CHF</label><input class="inp mono" id="x-chf" inputmode="decimal" value="${x.amount_chf === '' ? '' : esc(x.amount_chf)}" placeholder="0.00"><div class="rate" id="x-rate"></div></div>
      </div>
      <div class="field" id="x-vatwrap"><span class="flabel">TVA suisse appliquée</span>
        <div class="vats" id="x-vats">${VAT_RATES.map((r) => `<button type="button" data-vat="${r}">${r === 0 ? 'Sans TVA' : String(r).replace('.', ',') + ' %'}</button>`).join('')}<button type="button" data-vat="other">Autre</button></div>
        <input class="inp mono" id="x-vatother" inputmode="decimal" placeholder="Taux en %" style="display:none;max-width:140px;margin-top:8px;">
        <div class="vatinfo" id="x-vatinfo"></div></div>
      <div class="field"><label for="x-desc">Description</label><input class="inp" id="x-desc" value="${esc(x.description || '')}" placeholder="Ex. dîner équipe, taxi aéroport, hôtel 2 nuits"></div>
      <div class="field"><span class="flabel">Justificatif</span><div id="x-receipt"></div></div>
      <input type="file" id="x-cam" accept="image/*" capture="environment" hidden>
      <input type="file" id="x-file" accept="image/*,application/pdf" hidden>
      <datalist id="xcurlist">${CURRENCIES.map((c) => `<option value="${c}">`).join('')}</datalist>
      <div class="login-err" id="x-err"></div>`,
    foot: `${!isNew ? '<button class="btn danger" id="x-del">Supprimer</button>' : ''}<span class="sp"></span><button class="btn" data-close>Annuler</button><button class="btn primary" id="x-save">${isNew ? 'Créer la note de frais' : 'Enregistrer'}</button>`,
  });
  const el = md.el;
  const q = (s) => el.querySelector(s);
  const cur = () => q('#x-cur').value.trim().toUpperCase();

  function refresh() {
    const isChf = cur() === 'CHF';
    q('#x-chfwrap').style.display = isChf ? 'none' : '';
    q('#x-vatwrap').style.display = isChf ? '' : 'none';
    q('#x-loclabel').textContent = isChf ? 'Montant payé (CHF)' : `Montant payé (${cur() || 'devise'})`;
    el.querySelectorAll('#x-cat [data-cat]').forEach((b) => b.classList.toggle('on', b.dataset.cat === st.cat));
    const other = st.otherMode || !VAT_RATES.includes(Number(st.vat));
    el.querySelectorAll('#x-vats [data-vat]').forEach((b) => b.classList.toggle('on', b.dataset.vat === 'other' ? other : !other && Number(b.dataset.vat) === Number(st.vat)));
    const vo = q('#x-vatother');
    vo.style.display = other ? '' : 'none';
    if (other && document.activeElement !== vo) vo.value = isNaN(st.vat) ? '' : String(st.vat).replace('.', ',');
    const loc = num(q('#x-loc').value), chf = isChf ? loc : num(q('#x-chf').value);
    if (isChf && Number(st.vat) > 0 && chf > 0) {
      const v = round2((chf * st.vat) / (100 + st.vat));
      q('#x-vatinfo').textContent = `TVA incluse : ${fmt(v)} CHF, montant HT : ${fmt(chf - v)} CHF`;
    } else q('#x-vatinfo').textContent = isChf && Number(st.vat) === 0 ? 'Aucune TVA à récupérer sur cette note.' : '';
    q('#x-rate').textContent = !isChf && loc > 0 && chf > 0 ? `Taux appliqué : 1 ${cur()} = ${(chf / loc).toFixed(4)} CHF` : '';
    const d = q('#x-date').value;
    q('#x-datewarn').textContent = d && ((m.start_date && d < m.start_date) || (m.end_date && d > m.end_date)) ? 'Date en dehors des dates de la mission.' : '';
  }

  async function renderReceipt() {
    const box = q('#x-receipt');
    const existing = !st.removeReceipt && !st.file && x.receipt_path;
    if (st.file || existing) {
      const type = st.file ? st.file.type : x.receipt_type;
      let inner;
      if (type === 'application/pdf') inner = '<div class="pdf">📄 Justificatif PDF</div>';
      else {
        let u = st.previewUrl;
        if (!st.file) u = await getReceiptURL(x.receipt_path).catch(() => null);
        inner = u ? `<img src="${u}" alt="Justificatif">` : '<div class="pdf">🧾 Justificatif enregistré (aperçu indisponible hors ligne)</div>';
      }
      box.innerHTML = `<div class="preview">${inner}<div class="pb"><button type="button" class="btn" id="x-retake">Reprendre la photo</button><button type="button" class="btn ghost" id="x-choose">Autre fichier</button><span style="flex:1"></span><button type="button" class="btn ghost danger" id="x-rm">Retirer</button></div></div>`;
      q('#x-rm').onclick = () => { if (st.file) { st.file = null; if (st.previewUrl) URL.revokeObjectURL(st.previewUrl); st.previewUrl = null; } else st.removeReceipt = true; renderReceipt(); };
    } else {
      box.innerHTML = `<div class="drop"><p>Photographiez le ticket en entier, bien à plat et lisible.</p><div class="btns"><button type="button" class="btn dark" id="x-retake">📷 Prendre en photo le ticket</button><button type="button" class="btn" id="x-choose">Choisir un fichier</button></div></div>`;
    }
    q('#x-retake').onclick = () => q('#x-cam').click();
    q('#x-choose').onclick = () => q('#x-file').click();
  }

  const onFile = async (input) => {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    try {
      const p = await processFile(f);
      if (st.previewUrl) URL.revokeObjectURL(st.previewUrl);
      st.file = p; st.removeReceipt = false;
      st.previewUrl = p.type === 'application/pdf' ? null : URL.createObjectURL(p.blob);
      renderReceipt();
    } catch (e) { toast(e.message, 'err'); }
  };
  q('#x-cam').onchange = () => onFile(q('#x-cam'));
  q('#x-file').onchange = () => onFile(q('#x-file'));

  el.querySelectorAll('#x-cat [data-cat]').forEach((b) => b.onclick = () => { st.cat = b.dataset.cat; if (!st.vatTouched) st.vat = catOf(st.cat).vat; refresh(); });
  el.querySelectorAll('#x-vats [data-vat]').forEach((b) => b.onclick = () => {
    st.vatTouched = true;
    if (b.dataset.vat === 'other') { st.otherMode = true; if (VAT_RATES.includes(Number(st.vat))) st.vat = NaN; refresh(); q('#x-vatother').focus(); }
    else { st.otherMode = false; st.vat = Number(b.dataset.vat); refresh(); }
  });
  q('#x-vatother').oninput = () => { st.vat = num(q('#x-vatother').value); refresh(); };
  ['#x-loc', '#x-chf', '#x-cur', '#x-date'].forEach((s) => q(s).addEventListener('input', refresh));
  refresh();
  renderReceipt();
  const cleanup = () => { if (st.previewUrl) URL.revokeObjectURL(st.previewUrl); };
  el.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', cleanup));

  q('#x-save').onclick = async () => {
    const err = q('#x-err');
    const fail = (t) => { err.textContent = t; err.classList.add('visible'); err.scrollIntoView?.({ block: 'nearest' }); };
    const c = cur();
    const date = q('#x-date').value;
    const loc = num(q('#x-loc').value);
    const chf = c === 'CHF' ? loc : num(q('#x-chf').value);
    const user = admin ? q('#x-user')?.value : myId();
    if (!user) return fail('Choisissez l\'agent concerné.');
    if (!date) return fail('Indiquez la date de la dépense.');
    if (!/^[A-Z]{3}$/.test(c)) return fail('La devise doit être un code à 3 lettres (ex. EUR, USD, AED).');
    if (!(loc > 0)) return fail('Indiquez le montant payé.');
    if (!(chf > 0)) return fail('Indiquez le montant en francs suisses.');
    if (c === 'CHF' && (isNaN(st.vat) || st.vat < 0 || st.vat >= 100)) return fail('Indiquez un taux de TVA valide (entre 0 et 99 %).');
    const hasReceipt = st.file || (!st.removeReceipt && x.receipt_path);
    if (!hasReceipt && !(await confirmDialog('Aucun justificatif', 'Cette note de frais n\'a pas de photo de ticket. Sans justificatif, elle risque de ne pas être remboursée et la TVA ne pourra pas être récupérée.', 'Enregistrer sans justificatif'))) return;

    const row = {
      id: x.id, mission_id: m.id, user_id: user, expense_date: date, category: st.cat,
      description: q('#x-desc').value.trim() || null, currency: c,
      amount_local: round2(loc), amount_chf: round2(chf),
      vat_rate: c === 'CHF' ? round2(st.vat) : null,
      receipt_path: x.receipt_path || null, receipt_type: x.receipt_type || null,
      created_at: x.created_at || new Date().toISOString(),
    };
    const ops = [];
    const oldPath = x.receipt_path;
    if (st.file) {
      const path = `${user}/${m.id}/${x.id}.${st.file.ext}`;
      if (oldPath && oldPath !== path) ops.push({ type: 'remove', path: oldPath });
      forgetReceiptURL(path);
      await blobSet(path, { blob: st.file.blob, type: st.file.type });
      ops.push({ type: 'upload', path, expenseId: x.id });
      row.receipt_path = path; row.receipt_type = st.file.type;
    } else if (st.removeReceipt && oldPath) {
      ops.push({ type: 'remove', path: oldPath });
      row.receipt_path = null; row.receipt_type = null;
    }
    ops.push({ type: 'upsert', table: 'ndf_expenses', row });
    cleanup();
    md.close();
    await enqueue(ops);
    toast(isNew ? (navigator.onLine ? 'Note de frais créée' : 'Note de frais enregistrée — envoi au retour du réseau') : 'Note de frais enregistrée', 'ok');
  };

  const del = q('#x-del');
  if (del) del.onclick = async () => {
    if (!(await confirmDialog('Supprimer la note de frais', `${catOf(x.category).label} du ${fdate(x.expense_date)}, ${fmt(x.amount_chf)} CHF.`, 'Supprimer', true))) return;
    cleanup();
    md.close();
    const ops = [{ type: 'delete', table: 'ndf_expenses', row: { id: x.id } }];
    if (x.receipt_path) ops.push({ type: 'remove', path: x.receipt_path });
    await enqueue(ops);
    toast('Note de frais supprimée', 'ok');
  };
}

// ════════════════════════════════════════════════════════════════
//  EXPORTS
// ════════════════════════════════════════════════════════════════
function exportRows(m) {
  return missionExpenses(m.id, false)
    .sort((a, b) => a.expense_date.localeCompare(b.expense_date) || userName(a.user_id).localeCompare(userName(b.user_id)) || (a.created_at || '').localeCompare(b.created_at || ''))
    .map((x, i) => ({ ...x, ref: i + 1 }));
}
const excelDate = (iso) => { const [y, mo, d] = iso.split('-').map(Number); return (Date.UTC(y, mo - 1, d) - Date.UTC(1899, 11, 30)) / 86400000; };

function exportExcel(m) {
  if (typeof XLSX === 'undefined') return toast('Module Excel non chargé — vérifiez la connexion puis rechargez la page.', 'err');
  const rows = exportRows(m);
  const t = totals(rows);
  const head = ['N°', 'Date', 'Agent', 'Type', 'Description', 'Devise', 'Montant devise', 'Montant CHF', 'TVA %', 'TVA CHF', 'Montant HT CHF', 'Justificatif'];
  const aoa = [head];
  rows.forEach((x) => {
    const vat = vatOf(x);
    aoa.push([x.ref, excelDate(x.expense_date), userName(x.user_id), catOf(x.category).label, x.description || '', x.currency,
      Number(x.amount_local), Number(x.amount_chf), x.currency === 'CHF' ? Number(x.vat_rate) || 0 : '', vat, round2(Number(x.amount_chf) - vat),
      x.receipt_path ? `Oui (p. PDF n° ${x.ref})` : 'Non']);
  });
  const n = rows.length, last = n + 1;
  aoa.push([]);
  aoa.push(['', '', '', '', 'TOTAL', '', '', { f: `SUM(H2:H${last})`, v: t.chf }, '', { f: `SUM(J2:J${last})`, v: t.vat }, { f: `SUM(K2:K${last})`, v: round2(t.chf - t.vat) }, '']);
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  const money = '#,##0.00';
  for (let r = 1; r <= n + 2; r++) {
    const set = (col, z) => { const a = XLSX.utils.encode_cell({ r, c: col }); if (ws[a] && ws[a].v !== '') ws[a].z = z; };
    set(1, 'dd.mm.yyyy'); set(6, money); set(7, money); set(9, money); set(10, money); set(8, '0.0');
  }
  ws['!cols'] = [{ wch: 5 }, { wch: 11 }, { wch: 22 }, { wch: 18 }, { wch: 34 }, { wch: 7 }, { wch: 14 }, { wch: 13 }, { wch: 7 }, { wch: 10 }, { wch: 14 }, { wch: 18 }];
  ws['!autofilter'] = { ref: `A1:L${last}` };

  const dates = m.start_date ? `${fdate(m.start_date)}${m.end_date ? ' au ' + fdate(m.end_date) : ''}` : '';
  const rec = [
    ['Mission', m.name], ['Client', m.client || ''], ['Destination', m.destination || ''], ['Dates', dates], ['Statut', statusOf(m.status).label],
    ['Exporté le', fdate(todayISO())], [],
    ['Total par type', 'CHF'], ...CATS.map((c) => [c.label, t.byCat[c.id] || 0]), ['Total', t.chf], [],
    ['À rembourser par agent', 'CHF'], ...Object.entries(t.byAgent).sort((a, b) => userName(a[0]).localeCompare(userName(b[0]))).map(([u, v]) => [userName(u), round2(v)]), [],
    ['TVA récupérable', 'Base TTC CHF', 'TVA CHF'], ...Object.entries(t.byRate).sort((a, b) => Number(a[0]) - Number(b[0])).map(([r, v]) => [`${r} %`, round2(v.base), round2(v.vat)]), ['Total TVA', '', t.vat], [],
    ['Notes', n], ['Justificatifs', t.receipts], ['Sans justificatif', n - t.receipts],
  ];
  const ws2 = XLSX.utils.aoa_to_sheet(rec);
  Object.keys(ws2).forEach((a) => { if (a[0] !== '!' && typeof ws2[a].v === 'number' && !['Notes', 'Justificatifs', 'Sans justificatif'].includes(ws2['A' + a.replace(/^[A-Z]+/, '')]?.v)) ws2[a].z = money; });
  ws2['!cols'] = [{ wch: 26 }, { wch: 40 }, { wch: 12 }];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Notes de frais');
  XLSX.utils.book_append_sheet(wb, ws2, 'Récapitulatif');
  XLSX.writeFile(wb, `NDF_${slug(m.name)}.xlsx`);
  toast('Excel exporté', 'ok');
}

const pdfText = (s) => String(s ?? '').replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/\u2014|\u2013/g, '-').replace(/[^\x20-\x7E\xA0-\xFF€]/g, '');

async function exportPdf(m) {
  if (typeof PDFLib === 'undefined') return toast('Module PDF non chargé — vérifiez la connexion puis rechargez la page.', 'err');
  const rows = exportRows(m);
  const withR = rows.filter((x) => x.receipt_path);
  const pm = openModal({ title: 'PDF des justificatifs', body: `<p id="pdf-st" style="font-size:13.5px;color:var(--text2);">Préparation…</p><div class="prog"><div id="pdf-bar"></div></div>` });
  const setP = (i, txt) => { const b = pm.el.querySelector('#pdf-bar'); if (b) b.style.width = Math.round((i / Math.max(1, withR.length)) * 100) + '%'; const s = pm.el.querySelector('#pdf-st'); if (s) s.textContent = txt; };
  try {
    const { PDFDocument, StandardFonts, rgb } = PDFLib;
    const doc = await PDFDocument.create();
    doc.setTitle(pdfText(`Justificatifs - ${m.name}`));
    doc.setCreator('RDZ Security Management - NDF_RDZ');
    const font = await doc.embedFont(StandardFonts.Helvetica);
    const bold = await doc.embedFont(StandardFonts.HelveticaBold);
    const W = 595.28, H = 841.89, M = 36;
    const red = rgb(0.753, 0.153, 0.176), dark = rgb(0.176, 0.176, 0.176), grey = rgb(0.45, 0.45, 0.48);
    const t = totals(rows);

    // Cover + index pages
    let page = doc.addPage([W, H]);
    let y = H - M;
    page.drawRectangle({ x: 0, y: H - 6, width: W, height: 6, color: red });
    page.drawText('RDZ Security Management', { x: M, y: y - 8, size: 10, font: bold, color: red });
    y -= 40;
    page.drawText(pdfText(m.name), { x: M, y, size: 20, font: bold, color: dark, maxWidth: W - 2 * M });
    y -= 20;
    const dates = m.start_date ? `${fdate(m.start_date)}${m.end_date ? ' au ' + fdate(m.end_date) : ''}` : '';
    page.drawText(pdfText([m.client, m.destination, dates].filter(Boolean).join(', ')), { x: M, y, size: 11, font, color: grey });
    y -= 30;
    const summary = [['Total CHF', fmt(t.chf)], ['dont TVA récupérable', fmt(t.vat)], ['Notes de frais', String(rows.length)], ['Justificatifs joints', String(withR.length)]];
    summary.forEach(([k, v]) => { page.drawText(pdfText(k), { x: M, y, size: 11, font, color: grey }); page.drawText(pdfText(v), { x: M + 170, y, size: 11, font: bold, color: dark }); y -= 16; });
    y -= 16;
    const cols = [M, M + 32, M + 100, M + 250, M + 340, M + 440];
    const header = () => {
      ['N°', 'Date', 'Agent', 'Type', 'Montant', 'CHF'].forEach((h, i) => page.drawText(h, { x: cols[i], y, size: 9, font: bold, color: grey }));
      y -= 6; page.drawLine({ start: { x: M, y }, end: { x: W - M, y }, thickness: 0.5, color: grey }); y -= 12;
    };
    header();
    rows.forEach((x) => {
      if (y < M + 20) { page = doc.addPage([W, H]); y = H - M; header(); }
      const vals = [String(x.ref), fdate(x.expense_date), userName(x.user_id).slice(0, 26), catOf(x.category).short, `${fmt(x.amount_local)} ${x.currency}`, fmt(x.amount_chf) + (x.receipt_path ? '' : '  (sans ticket)')];
      vals.forEach((v, i) => page.drawText(pdfText(v), { x: cols[i], y, size: 9, font: i === 0 ? bold : font, color: !x.receipt_path && i === 5 ? red : dark }));
      y -= 14;
    });

    // One page per receipt (PDF receipts: every page)
    let done = 0, missing = 0;
    for (const x of withR) {
      setP(done, `Justificatif ${done + 1} sur ${withR.length}…`);
      const rec = await getReceiptBlob(x.receipt_path).catch(() => null);
      done++;
      const label = pdfText(`N° ${x.ref}   ${fdate(x.expense_date)}   ${catOf(x.category).short}   ${userName(x.user_id)}`);
      const amt = pdfText(`${fmt(x.amount_chf)} CHF` + (x.currency !== 'CHF' ? `  (${fmt(x.amount_local)} ${x.currency})` : '') + (vatOf(x) > 0 ? `   TVA ${Number(x.vat_rate)} % : ${fmt(vatOf(x))}` : ''));
      const newPage = () => {
        const p = doc.addPage([W, H]);
        p.drawRectangle({ x: 0, y: H - 54, width: W, height: 54, color: rgb(0.965, 0.965, 0.97) });
        p.drawRectangle({ x: 0, y: H - 54, width: 4, height: 54, color: red });
        p.drawText(label, { x: M, y: H - 24, size: 11, font: bold, color: dark, maxWidth: W - 2 * M });
        p.drawText(amt, { x: M, y: H - 41, size: 10, font, color: grey, maxWidth: W - 2 * M });
        return p;
      };
      const box = { x: M, y: M, w: W - 2 * M, h: H - 54 - 2 * M + 12 };
      if (!rec) { missing++; const p = newPage(); p.drawText('Justificatif introuvable (non synchronisé ou supprimé).', { x: M, y: H / 2, size: 12, font, color: red }); continue; }
      const bytes = new Uint8Array(await rec.blob.arrayBuffer());
      try {
        if (rec.type === 'application/pdf' || x.receipt_type === 'application/pdf') {
          const src = await PDFDocument.load(bytes, { ignoreEncryption: true });
          const embedded = await doc.embedPdf(src, src.getPageIndices());
          embedded.forEach((ep) => {
            const p = newPage();
            const s = Math.min(box.w / ep.width, box.h / ep.height);
            p.drawPage(ep, { x: box.x + (box.w - ep.width * s) / 2, y: box.y + (box.h - ep.height * s), width: ep.width * s, height: ep.height * s });
          });
        } else {
          const img = rec.type === 'image/png' ? await doc.embedPng(bytes) : await doc.embedJpg(bytes);
          const p = newPage();
          const s = Math.min(box.w / img.width, box.h / img.height);
          p.drawImage(img, { x: box.x + (box.w - img.width * s) / 2, y: box.y + (box.h - img.height * s), width: img.width * s, height: img.height * s });
        }
      } catch (e) {
        console.warn('receipt', x.id, e);
        missing++;
        const p = newPage(); p.drawText('Justificatif illisible — ouvrir la note dans le module.', { x: M, y: H / 2, size: 12, font, color: red });
      }
    }
    setP(withR.length, 'Assemblage du fichier…');
    const out = await doc.save();
    const blob = new Blob([out], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `NDF_${slug(m.name)}_justificatifs.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    pm.close();
    toast(missing ? `PDF créé — ${missing} justificatif(s) manquant(s)` : 'PDF des justificatifs créé', missing ? 'warn' : 'ok');
  } catch (e) {
    console.error(e);
    pm.close();
    toast('Création du PDF impossible : ' + e.message, 'err');
  }
}

// ════════════════════════════════════════════════════════════════
//  BOOT
// ════════════════════════════════════════════════════════════════
async function startApp() {
  $('login-screen').classList.remove('visible');
  $('app').classList.add('visible');
  $('tb-user').textContent = session.profile?.full_name || session.user?.email || '';
  $('tb-sub').textContent = isAdmin() ? 'Notes de frais · Admin' : 'Notes de frais';
  if (!isAdmin()) route.filter = 'all';
  const hm = location.hash.match(/^#m=([0-9a-f-]{36})$/i);
  if (hm) { route.view = 'mission'; route.missionId = hm[1]; }
  try {
    const c = await kvGet(cacheKey());
    if (c) { S = { missions: c.missions || [], members: c.members || [], expenses: c.expenses || [], users: c.users || [] }; }
  } catch (_) {}
  const ops = await refreshOutboxState();
  ops.forEach(applyOp);
  render();
  updateSyncBadge();
  await sync();
  await fetchAll();
}

$('login-btn').onclick = doLogin;
$('login-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
$('btn-logout').onclick = logout;
$('sync').onclick = () => { if ($('sync').classList.contains('clickable')) openOutbox(); else if (navigator.onLine) fetchAll(); };
window.addEventListener('online', async () => { toast('Connexion rétablie — synchronisation', 'ok'); await sync(); await fetchAll(); });
window.addEventListener('offline', () => { updateSyncBadge(); toast('Hors ligne — vos saisies sont conservées sur cet appareil', 'warn'); });
window.addEventListener('popstate', () => {
  if (document.querySelector('.overlay')) { document.querySelectorAll('.overlay').forEach((o) => o.remove()); document.body.style.overflow = ''; }
  const hm = location.hash.match(/^#m=([0-9a-f-]{36})$/i);
  if (hm) { route.view = 'mission'; route.missionId = hm[1]; } else route.view = 'list';
  render();
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && session && navigator.onLine && Date.now() - lastFetch > 60000) { sync().then(fetchAll); } });
setInterval(() => { if (session && navigator.onLine && outboxState.pending) sync(); }, 45000);

(function boot() {
  const saved = localStorage.getItem(AUTH_KEY);
  if (saved) {
    try { session = JSON.parse(saved); if (session && session.refresh_token && session.user) return startApp(); } catch (_) {}
  }
  showLogin();
})();
</script>
