<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rapports_RDZ v3 — Hôpital de La Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --red:#c0272d;--red-d:#a31f24;--red-l:#fdf2f2;--red-m:#fecaca;
  --accent:#c0272d;--accent-hover:#a31f24;
  --bg:#f2f2f4;--white:#fff;
  --anth:#2d2d2d;--anth2:#3a3a3a;--anth3:#1a1a1a;
  --border:#e2e2e6;--border2:#d0d0d6;
  --text:#2d2d2d;--text2:#4b5563;--text3:#9ca3af;
  --green:#16a34a;--green-l:#f0fdf4;--green-m:#bbf7d0;
  --orange:#ea580c;--orange-l:#fff7ed;--orange-m:#fed7aa;
  --blue:#2563eb;--blue-l:#eff6ff;--blue-m:#bfdbfe;
  --yellow:#ca8a04;--yellow-l:#fefce8;--yellow-m:#fef08a;
  --shadow:0 1px 3px rgba(0,0,0,.07),0 4px 12px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.14);
  --radius:14px;--radius-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.45;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;}
.mono{font-family:'DM Mono',monospace;}
[hidden]{display:none!important;}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--anth3);padding:20px;}
.login-box{background:#fff;border-radius:18px;padding:40px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.mark{width:40px;height:40px;background:var(--red);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono';font-size:13px;font-weight:600;color:#fff;flex-shrink:0;}
.login-brand{font-family:'DM Mono';font-size:15px;font-weight:600;color:var(--anth);}
.login-sub{font-size:11px;color:var(--text3);margin-top:2px;}
.login-title{font-family:'DM Mono';font-size:22px;font-weight:600;color:var(--anth);margin-bottom:6px;}
.login-desc{font-size:13px;color:var(--text2);margin-bottom:24px;}
.login-box label{display:block;font-size:12px;font-weight:600;color:var(--text2);margin:0 0 6px;}
.login-box input{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-size:14px;margin-bottom:16px;outline:none;}
.login-box input:focus{border-color:var(--red);}
.login-err{color:var(--red);font-size:12.5px;min-height:18px;margin-top:10px;}
.login-back{text-align:center;margin-top:18px;}
.login-back a{font-size:12px;color:var(--text3);text-decoration:none;}

/* Topbar */
.topbar{background:var(--anth2);color:#fff;height:56px;display:flex;align-items:center;padding:0 20px;gap:12px;border-bottom:3px solid var(--red);position:sticky;top:0;z-index:50;}
.topbar .mark{width:32px;height:32px;font-size:11px;border-radius:7px;}
.tb-brand{font-family:'DM Mono';font-size:13.5px;font-weight:600;line-height:1.1;}
.tb-sub{font-size:10.5px;color:rgba(255,255,255,.45);}
.tb-spacer{flex:1;}
.sync{display:flex;align-items:center;gap:7px;font-size:11.5px;color:rgba(255,255,255,.55);}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;}
.sync-dot.ok{background:#4ade80;}.sync-dot.pending{background:#fbbf24;}.sync-dot.error{background:#f87171;}
.tb-user{font-size:12px;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:5px 10px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tb-logout{background:none;border:none;color:rgba(255,255,255,.55);font-size:12px;padding:6px 8px;border-radius:6px;}
.tb-logout:hover{color:#fff;}

/* Shell */
.shell{display:flex;min-height:calc(100vh - 56px);}
.side{width:220px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:18px 10px;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.side button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:none;border-radius:8px;padding:9px 12px;margin-bottom:2px;color:var(--text2);font-weight:500;border-left:3px solid transparent;}
.side button:hover{background:var(--bg);color:var(--anth);}
.side button.active{background:var(--red-l);color:var(--red);border-left-color:var(--red);font-weight:600;}
.side .count{font-family:'DM Mono';font-size:11px;background:var(--red);color:#fff;border-radius:10px;padding:0 7px;}
.side .sep{height:1px;background:var(--border);margin:10px 8px;}
.main{flex:1;min-width:0;padding:28px 28px 80px;max-width:1240px;}
@media(max-width:860px){
  .shell{flex-direction:column;}
  .side{width:auto;height:auto;position:sticky;top:56px;z-index:40;display:flex;overflow-x:auto;padding:8px;border-right:none;border-bottom:1px solid var(--border);}
  .side button{width:auto;white-space:nowrap;margin:0 2px;border-left:none;border-bottom:3px solid transparent;border-radius:6px;}
  .side button.active{border-bottom-color:var(--red);}
  .side .sep{display:none;}
  .main{padding:18px 14px 70px;}
  .tb-sub,.tb-user{display:none;}
}

/* Page */
.page-head{margin-bottom:22px;}
.page-head h1{font-family:'DM Mono';font-size:24px;font-weight:600;color:var(--anth);}
.page-head .sub{color:var(--text2);margin-top:4px;max-width:70ch;}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:18px;}
.toolbar .grow{flex:1;}
.field{display:flex;flex-direction:column;gap:5px;}
.field>span{font-size:12px;font-weight:600;color:var(--text2);}
.field small{font-size:11.5px;color:var(--text3);font-weight:400;}
.inp,select.inp,textarea.inp{border:1.5px solid var(--border);border-radius:8px;padding:8px 11px;background:#fff;outline:none;min-width:0;width:100%;}
.inp:focus{border-color:var(--red);}
textarea.inp{resize:vertical;min-height:80px;}
.inp.mono{font-family:'DM Mono';font-size:12.5px;}
.panel{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);margin-bottom:18px;}
.panel h2{font-size:15px;font-weight:700;color:var(--anth);margin-bottom:12px;}
.panel h3{font-size:14px;font-weight:600;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
@media(max-width:860px){.grid2{grid-template-columns:1fr;}}
.muted{color:var(--text3);}
.empty{padding:28px 18px;text-align:center;color:var(--text2);background:#fff;border:1.5px dashed var(--border2);border-radius:var(--radius);}
.empty p{margin-bottom:12px;}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--border);background:#fff;color:var(--anth);border-radius:8px;padding:8px 14px;font-weight:600;font-size:12.5px;white-space:nowrap;}
.btn:hover{border-color:var(--anth);}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff;}
.btn.primary:hover{background:var(--red-d);border-color:var(--red-d);}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text2);}
.btn.ghost:hover{background:var(--bg);color:var(--anth);}
.btn.danger{color:var(--red);}
.btn.sm{padding:5px 10px;font-size:12px;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.link{background:none;border:none;color:var(--red);font-weight:600;padding:0;}

/* Badges */
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.b-green{background:var(--green-l);color:var(--green);}
.b-red{background:var(--red-l);color:var(--red);}
.b-orange{background:var(--orange-l);color:var(--orange);}
.b-blue{background:var(--blue-l);color:var(--blue);}
.b-grey{background:#f3f4f6;color:var(--text2);}

/* Banner */
.banner{display:flex;gap:14px;align-items:center;justify-content:space-between;border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:18px;font-size:13px;}
.banner.warn{background:var(--orange-l);border:1px solid var(--orange-m);color:#9a3412;}
.banner.info{background:var(--blue-l);border:1px solid var(--blue-m);color:#1e40af;}
@media(max-width:600px){.banner{flex-direction:column;align-items:flex-start;}}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:#fff;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;}
.kpi .v{font-family:'DM Mono';font-size:24px;font-weight:600;color:var(--anth);line-height:1.1;}
.kpi .v.red{color:var(--red);}
.kpi .l{font-size:12px;color:var(--text2);margin-top:4px;}
.issues{list-style:none;}
.issues li{display:flex;justify-content:space-between;gap:10px;padding:8px 0 8px 12px;border-bottom:1px solid var(--border);border-left:3px solid var(--orange);margin-bottom:6px;}
.issues li.error{border-left-color:var(--red);}
.ok-line{color:var(--green);font-weight:600;}

/* Tables */
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);}
table.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--text2);padding:10px 12px;border-bottom:1px solid var(--border);background:#fafafb;white-space:nowrap;}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr.click{cursor:pointer;}
.tbl tr.click:hover td{background:#fafafb;}
.tbl .num{font-family:'DM Mono';font-size:12.5px;white-space:nowrap;}
.tbl .wrap{max-width:360px;word-break:break-word;}

/* Rules: each rule reads as a sentence */
.rules{display:flex;flex-direction:column;gap:12px;}
.rule{background:#fff;border:1px solid var(--border);border-left:5px solid var(--anth);border-radius:10px;padding:14px 16px 12px;box-shadow:var(--shadow);}
.rule.cond{border-left-color:var(--red);}
.rule.off{opacity:.55;}
.rule-top{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.rule-top h3{font-size:14.5px;font-weight:700;color:var(--anth);}
.rule-sentence{margin:6px 0 10px;color:var(--text2);font-size:13.5px;}
.rule-sentence b{color:var(--anth);}
.rule-row{display:flex;gap:10px;align-items:baseline;margin-bottom:6px;flex-wrap:wrap;}
.rule-row .k{font-size:12px;font-weight:600;color:var(--text3);width:46px;flex-shrink:0;}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:12px;margin:0 4px 4px 0;}
.chip b{font-family:'DM Mono';font-size:11.5px;color:var(--red);}
.subject{font-family:'DM Mono';font-size:12.5px;background:var(--anth);color:#f3f4f6;border-radius:6px;padding:4px 9px;word-break:break-word;}
.rule-actions{display:flex;gap:4px;justify-content:flex-end;margin-top:6px;}

/* Switch */
.switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch span{position:absolute;inset:0;background:#d1d5db;border-radius:22px;transition:background .15s;}
.switch span::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .15s;}
.switch input:checked+span{background:var(--green);}
.switch input:checked+span::before{transform:translateX(16px);}
.switch input:focus-visible+span{outline:2px solid var(--red);outline-offset:2px;}

/* Modal & drawer */
.modal-back{position:fixed;inset:0;background:rgba(20,20,22,.55);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;overflow-y:auto;}
.modal{background:#fff;border-radius:var(--radius);width:100%;max-width:560px;box-shadow:var(--shadow-lg);}
.modal.wide{max-width:860px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border);}
.modal-head h2{font-size:16px;font-weight:700;color:var(--anth);}
.x{background:none;border:none;font-size:22px;line-height:1;color:var(--text3);padding:2px 6px;}
.x:hover{color:var(--anth);}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
.modal-err{color:var(--red);font-size:12.5px;padding:0 20px;min-height:4px;}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border);}
.check{display:flex;align-items:flex-start;gap:8px;font-size:13px;}
.check input{margin-top:3px;accent-color:var(--red);}
.cond-box{border:1px solid var(--border);border-radius:10px;padding:12px;background:#fafafb;display:flex;flex-direction:column;gap:10px;}
.cond-head{display:grid;grid-template-columns:1fr 200px auto;gap:8px;align-items:end;}
@media(max-width:600px){.cond-head{grid-template-columns:1fr;}}
.vals{display:flex;flex-direction:column;gap:4px;max-height:200px;overflow-y:auto;background:#fff;border:1px solid var(--border);border-radius:8px;padding:8px;}
.var-btns{display:flex;flex-wrap:wrap;gap:4px;}
.var-btns button{font-family:'DM Mono';font-size:11px;border:1px solid var(--border);background:#fff;border-radius:5px;padding:2px 7px;color:var(--text2);}
.var-btns button:hover{border-color:var(--red);color:var(--red);}
.drawer-back{position:fixed;inset:0;background:rgba(20,20,22,.45);z-index:150;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:160;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-top:4px solid var(--red);}
.drawer-head h2{font-size:16px;font-weight:700;}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px 30px;}
.kv{display:grid;grid-template-columns:38% 1fr;gap:4px 14px;font-size:13px;margin-bottom:6px;}
.kv dt{color:var(--text2);}
.kv dd{white-space:pre-wrap;word-break:break-word;}
.grp-title{font-weight:700;color:var(--anth);margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border);}
.drawer-body>.grp-title:first-child{border-top:none;margin-top:0;padding-top:0;}
.photos{display:flex;flex-wrap:wrap;gap:8px;}
.photos img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--border);}

/* Simulator */
.sim{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start;}
@media(max-width:980px){.sim{grid-template-columns:1fr;}}
.sim-out{position:sticky;top:76px;}
.sim-mail{border:1px solid var(--border);border-left:4px solid var(--green);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.sim-mail.skip{border-left-color:var(--border2);color:var(--text3);}
.sim-mail .n{font-weight:700;font-size:13px;margin-bottom:4px;}
.sim-mail .to{font-size:12px;color:var(--text2);margin-top:4px;word-break:break-word;}
.sim-grp{margin-bottom:14px;}
.sim-grp h4{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--anth);}
.req{color:var(--red);}
.help{font-size:11.5px;color:var(--text3);margin:2px 0 4px 24px;}

/* Checkpoints */
.code-cell{font-family:'DM Mono';font-size:13px;font-weight:600;letter-spacing:.5px;}
.round-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
.round-pill{border:1.5px solid var(--border);background:#fff;border-radius:20px;padding:6px 14px;font-weight:600;font-size:12.5px;color:var(--text2);}
.round-pill.active{border-color:var(--red);color:var(--red);background:var(--red-l);}

.q-depth{border-left:2px solid var(--border);padding-left:12px;margin-left:6px;}
.idbox{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text3);}
.idbox code{font-family:'DM Mono';background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 6px;color:var(--text2);}
/* Toast */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{background:var(--anth);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow-lg);max-width:min(90vw,520px);}
.toast.err{background:var(--red);}
.toast.ok{background:var(--green);}
@media(prefers-reduced-motion:no-preference){.toast{animation:tin .18s ease-out;}@keyframes tin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}}
</style>
</head>
<body>

<div id="login-screen" class="login-wrap" hidden>
  <form class="login-box" onsubmit="doLogin(event)">
    <div class="login-logo">
      <div class="mark">RDZ</div>
      <div><div class="login-brand">RDZ Security Management</div><div class="login-sub">Hôpital de La Tour</div></div>
    </div>
    <h1 class="login-title">Rapports HDLT</h1>
    <p class="login-desc">Envois automatiques des rapports du journal de bord, destinataires, journal des envois et points de ronde. Accès réservé aux administrateurs et superviseurs.</p>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" autocomplete="username" required>
    <label for="login-pass">Mot de passe</label>
    <input id="login-pass" type="password" autocomplete="current-password" required>
    <button class="btn primary" id="login-btn" type="submit" style="width:100%;padding:12px;font-size:14px;">Se connecter</button>
    <div class="login-err" id="login-err" role="alert"></div>
    <div class="login-back"><a href="RDZ_index.html">Retour au portail RDZ</a></div>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="mark">RDZ</div>
    <div><div class="tb-brand">Rapports RDZ</div><div class="tb-sub" id="tb-sub">Hôpital de La Tour</div></div>
    <div class="tb-spacer"></div>
    <div class="sync"><span class="sync-dot" id="sync-dot"></span><span id="sync-label"></span></div>
    <div class="tb-user" id="tb-user"></div>
    <button class="tb-logout" onclick="doLogout()">Déconnexion</button>
  </header>
  <div class="shell">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="drawer-root"></div>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
// ════════════════════════════════════════════════════════
//  CONFIG
//  Rules, recipients, send log, settings and checkpoints live in the
//  RouteOps base. Report types, questions and filled reports live in the
//  RDZ Agent base and are read through the rpt-dispatch function.
// ════════════════════════════════════════════════════════
const SB_URL = 'https://trdhtlcenmjlcvzuplid.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRyZGh0bGNlbm1qbGN2enVwbGlkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0NTE2NzQsImV4cCI6MjA5MjAyNzY3NH0.8r-ITHC-w28vQ4_FKI6Hbwg4AYVqYR0i-69_oHSD5DU';
const FN_URL = SB_URL + '/functions/v1/rpt-dispatch';
const ADMIN_ROLES = ['admin', 'supervisor'];
const LS_SESSION = 'rpt_session_v1', LS_CACHE = 'rpt_cache_v2', LS_DIRTY = 'rpt_dirty_v2', LS_CAT = 'rpt_catalog_v2';
const TABLES = {groups:'rpt_recipient_groups', rules:'rpt_mail_rules', rounds:'rpt_rounds', checkpoints:'rpt_checkpoints'};
const SYSTEM_VARS = ['Site','Type de rapport','Agent','Date','Heure','Localisation','N° de rapport','Statut de soumission','Statut de démarrage','Date de début','Date de fin'];
const STATUS = {pending:['En cours','b-blue'], sent:['Envoyé','b-green'], failed:['Échec','b-red'],
                test_redirected:['Test (redirigé)','b-orange'], suppressed:['Bloqué (mode test)','b-grey']};
const TYPE_LABELS = {texte:'Texte court', zone_texte:'Texte long', choix:'Choix', case:'Case à cocher', heure:'Horodatage'};

function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function uid(){ return crypto.randomUUID(); }
function isoDay(offset){ const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString('sv-SE'); }
function fmtDate(s){ if(!s) return ''; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s)); return m ? `${m[3]}.${m[2]}.${m[1]}` : String(s); }
function fmtDateTime(iso){
  if(!iso) return '';
  const d = new Date(iso); if(isNaN(d.getTime())) return '';
  return new Intl.DateTimeFormat('fr-CH',{timeZone:'Europe/Zurich',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(d).replace(',','');
}
function short(s, n){ s = String(s ?? ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function bySort(a, b){ return (a.sort ?? 0) - (b.sort ?? 0) || String(a.name || a.label || '').localeCompare(String(b.name || b.label || ''), 'fr'); }

function champOptions(c){

}
function champsFor(typeId, siteId){
  return S.cat.champs.filter(c => c.rapport_type_id === typeId && c.actif !== false && (!c.site_id || !siteId || c.site_id === siteId));
}
function champTree(list){
  const byParent = new Map(), ids = new Set(list.map(c => c.id)), out = [], seen = new Set();
  for(const c of list){ const k = c.parent_id && ids.has(c.parent_id) ? c.parent_id : ''; if(!byParent.has(k)) byParent.set(k, []); byParent.get(k).push(c); }
  for(const arr of byParent.values()) arr.sort((a, b) => (a.ordre ?? 0) - (b.ordre ?? 0));
  const walk = (pid, depth) => { for(const c of byParent.get(pid) || []){ if(seen.has(c.id)) continue; seen.add(c.id); out.push({c, depth}); walk(c.id, depth + 1); } };
  walk('', 0);
  return out;
}

function toast(msg, type){

  document.getElementById('toast').appendChild(t);

}

// ── Shared rule logic (identical to the rpt-dispatch function) ──
function fmtValue(v){
  if(v === null || v === undefined || v === '') return '';
  if(Array.isArray(v)) return v.map(fmtValue).filter(Boolean).join(', ');
  if(typeof v === 'boolean') return v ? 'Oui' : 'Non';
  if(typeof v === 'object') return String(v.label ?? v.name ?? '');
  const s = String(v); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? fmtDate(s) : s;
}
function answersOf(list){
  const byId = {}, byLabel = {};
  for(const r of list){ if(!r || typeof r !== 'object') continue; if(r.champ_id) byId[String(r.champ_id)] = r.valeur; if(r.libelle) byLabel[String(r.libelle)] = r.valeur; }
  return {byId, byLabel, list};
}
function answerOf(c, a){
  if(c.champ_id && Object.prototype.hasOwnProperty.call(a.byId, c.champ_id)) return a.byId[c.champ_id];
  if(c.libelle && Object.prototype.hasOwnProperty.call(a.byLabel, c.libelle)) return a.byLabel[c.libelle];
  return undefined;
}
function condMatches(c, a){
  const v = answerOf(c, a); const vals = (c.values || []).map(String);
  switch(c.type){
    case 'checked':
      if(Array.isArray(v)) return vals.length ? v.map(String).some(x => vals.includes(x)) : v.length > 0;
      return v === true || v === 'true' || v === 'oui' || v === 'Oui';
    case 'equals':
      if(Array.isArray(v)) return v.map(String).some(x => vals.includes(x));
      return v !== undefined && v !== null && vals.includes(String(v));
    case 'filled':
      return !(v === undefined || v === null || v === '' || v === false || (Array.isArray(v) && v.length === 0));
    default: return false;
  }
}
function ruleMatches(rule, a){
  if(rule.trigger_mode === 'always') return true;
  const conds = Array.isArray(rule.conditions) ? rule.conditions : [];
  if(!conds.length) return false;
  const res = conds.map(c => condMatches(c, a));
  return rule.match_mode === 'all' ? res.every(Boolean) : res.some(Boolean);
}
function renderSubject(tpl, a, sys, sep){
  const re = /\{([^{}]+)\}/g; let out = '', last = 0, prev = false, m;
  while((m = re.exec(tpl))){
    const literal = tpl.slice(last, m.index); const key = m[1].trim();
    const val = Object.prototype.hasOwnProperty.call(a.byLabel, key) ? fmtValue(a.byLabel[key]) : (sys[key] ?? '');
    if(literal){ out += literal; prev = false; }
    if(val){ if(prev) out += sep; out += val; prev = true; }
    last = re.lastIndex;
  }
  out += tpl.slice(last);
  return out.replace(/\s+/g, ' ').trim();
}
const EMAIL_RE = /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/;
function isEmail(e){ return typeof e === 'string' && EMAIL_RE.test(e.trim()); }
function splitEmails(s){ return String(s || '').split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(Boolean); }
function recipientsFor(rule, gmap){
  const set = new Set();
  for(const gid of rule.group_ids || []){ const g = gmap.get(gid); if(g && g.active !== false) for(const e of g.emails || []) if(isEmail(e)) set.add(e.trim().toLowerCase()); }
  for(const e of rule.extra_emails || []) if(isEmail(e)) set.add(e.trim().toLowerCase());
  return [...set];
}
// A condition whose question no longer exists in the creator.
function condBroken(c, typeId){
  if(!S.cat.loaded_at) return false;
  const champs = S.cat.champs.filter(x => x.rapport_type_id === typeId);
  return !champs.some(x => x.id === c.champ_id) && !champs.some(x => x.libelle === c.libelle);
}

class HttpError extends Error{ constructor(status, msg){ super(msg); this.status = status; } }
function saveSession(){ if(S.session) localStorage.setItem(LS_SESSION, JSON.stringify(S.session)); else localStorage.removeItem(LS_SESSION); }
async function refreshSession(){
  if(!S.session?.refresh_token) return false;
  try{
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=refresh_token`, {method:'POST',
      headers:{'Content-Type':'application/json', apikey:SB_KEY}, body: JSON.stringify({refresh_token: S.session.refresh_token})});
    if(!r.ok) return false;
    const d = await r.json();
    Object.assign(S.session, {access_token:d.access_token, refresh_token:d.refresh_token,
      expires_at: d.expires_at || Math.floor(Date.now()/1000) + (d.expires_in || 3600)});
    saveSession(); return true;
  }catch(_){ return false; }
}
async function ensureFresh(){
  if(!S.session) throw new HttpError(401, 'Session expirée');
  const now = Math.floor(Date.now()/1000);
  if(S.session.expires_at && S.session.expires_at - now < 90 && navigator.onLine) await refreshSession();
}
function translateErr(status, m){
  m = String(m || '');
  if(status === 409 || /duplicate key/i.test(m)) return 'Cette valeur existe déjà (code ou nom en double).';
  if(status === 403 || /row-level security/i.test(m)) return 'Action refusée : droits insuffisants.';
  return m.slice(0, 220) || ('Erreur ' + status);
}
async function api(path, opts = {}, retried = false){
  await ensureFresh();
  let res;
  try{
    res = await fetch(`${SB_URL}/rest/v1/${path}`, {...opts, headers:{
      apikey:SB_KEY, 'Content-Type':'application/json', Authorization:'Bearer ' + S.session.access_token, ...(opts.headers || {})}});
  }catch(_){ throw new HttpError(0, 'Connexion impossible'); }
  if(res.status === 401 && !retried){
    if(await refreshSession()) return api(path, opts, true);
    sessionExpired(); throw new HttpError(401, 'Session expirée');
  }
  const txt = await res.text();
  if(!res.ok){
    let m = txt; try{ const j = JSON.parse(txt); m = j.message || j.details || j.hint || txt; }catch(_){}
    throw new HttpError(res.status, translateErr(res.status, m));
  }
  return txt ? JSON.parse(txt) : null;
}
async function callFn(body){
  await ensureFresh();
  let r;
  try{
    r = await fetch(FN_URL, {method:'POST', headers:{apikey:SB_KEY, Authorization:'Bearer ' + S.session.access_token, 'Content-Type':'application/json'}, body: JSON.stringify(body)});
  }catch(_){ throw new HttpError(0, 'La fonction rpt-dispatch est injoignable. Vérifiez la connexion et son déploiement.'); }
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new HttpError(r.status, j.error || ('Erreur ' + r.status));
  return j;
}
let expiredShown = false;
function sessionExpired(){
  if(!expiredShown){ toast('Session expirée, reconnectez-vous.', 'err'); expiredShown = true; }
  doLogout(true, true);
}

async function doLogin(ev){
  ev && ev.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  const err = document.getElementById('login-err'), btn = document.getElementById('login-btn');
  err.textContent = '';
  if(!email || !pass){ err.textContent = 'Email et mot de passe requis.'; return; }
  btn.disabled = true; btn.textContent = 'Connexion…';
  try{
    const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, {method:'POST',
      headers:{'Content-Type':'application/json', apikey:SB_KEY}, body: JSON.stringify({email, password:pass})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error_description || d.msg || 'Email ou mot de passe incorrect.');
    const pr = await fetch(`${SB_URL}/rest/v1/profiles?id=eq.${d.user.id}&select=full_name,role,active`, {headers:{apikey:SB_KEY, Authorization:'Bearer ' + d.access_token}});
    const ps = await pr.json(); const p = Array.isArray(ps) ? ps[0] : null;
    if(!p || p.active === false || !ADMIN_ROLES.includes(p.role)) throw new Error('Accès réservé aux administrateurs et superviseurs.');
    S.session = {access_token:d.access_token, refresh_token:d.refresh_token,
      expires_at: d.expires_at || Math.floor(Date.now()/1000) + (d.expires_in || 3600),
      user_id:d.user.id, email:d.user.email, full_name:p.full_name || d.user.email, role:p.role};
    saveSession(); expiredShown = false;
    document.getElementById('login-pass').value = '';
    enterApp();
  }catch(e){ err.textContent = e.message === 'Failed to fetch' ? 'Connexion impossible : vérifiez le réseau.' : e.message; }
  finally{ btn.disabled = false; btn.textContent = 'Se connecter'; }
}
function doLogout(silent, keepLocal){
  if(!silent && getDirty().length && !confirm('Des modifications ne sont pas encore synchronisées et seront perdues. Se déconnecter quand même ?')) return;
  S.session = null; saveSession();
  if(!keepLocal){ [LS_CACHE, LS_DIRTY, LS_CAT].forEach(k => localStorage.removeItem(k)); S.cfg = emptyCfg(); S.cat = emptyCat(); S.settings = {}; }
  S.reports = []; S.logs = [];
  closeModal(); closeDrawer();
  document.getElementById('app').hidden = true;
  document.getElementById('login-screen').hidden = false;
}
async function verifyProfile(){
  try{
    const ps = await api(`profiles?id=eq.${S.session.user_id}&select=full_name,role,active`);
    const p = ps && ps[0];
    if(!p || p.active === false || !ADMIN_ROLES.includes(p.role)) return false;
    S.session.role = p.role; S.session.full_name = p.full_name || S.session.email; saveSession();
    return true;
  }catch(e){ return e.status === 0; }
}
function enterApp(){
  document.getElementById('login-screen').hidden = true;
  document.getElementById('app').hidden = false;
  document.getElementById('tb-user').textContent = S.session.full_name || S.session.email;
  loadCache();
  showView(S.view);
  updateSyncBadge();
  if(navigator.onLine) pushDirty().then(() => Promise.all([loadConfig(), loadCatalog(true)]));
}
async function boot(){
  window.addEventListener('online', () => { updateSyncBadge(); if(S.session) pushDirty().then(loadConfig); });
  window.addEventListener('offline', updateSyncBadge);
  document.addEventListener('keydown', e => { if(e.key === 'Escape'){ closeModal(); closeDrawer(); } });
  try{ S.session = JSON.parse(localStorage.getItem(LS_SESSION) || 'null'); }catch(_){ S.session = null; }
  if(!S.session){ document.getElementById('login-screen').hidden = false; return; }
  if(navigator.onLine && !(await verifyProfile())){ doLogout(true); return; }
  if(S.session) enterApp();
}

//  CACHE, CATALOG, OFFLINE QUEUE (dirty → pushDirty)
// ════════════════════════════════════════════════════════
function saveCache(){ localStorage.setItem(LS_CACHE, JSON.stringify({cfg:S.cfg, settings:S.settings, at:Date.now()})); }
function loadCache(){
  try{ const c = JSON.parse(localStorage.getItem(LS_CACHE) || 'null'); if(c){ S.cfg = {...emptyCfg(), ...c.cfg}; S.settings = c.settings || {}; } }catch(_){}
  try{ const k = JSON.parse(localStorage.getItem(LS_CAT) || 'null'); if(k) S.cat = {...emptyCat(), ...k}; }catch(_){}
}
async function loadCatalog(silent){
  if(!S.session || !navigator.onLine) return;
  try{
    const c = await callFn({action:'catalog'});
    S.cat = {...emptyCat(), ...c};
    localStorage.setItem(LS_CAT, JSON.stringify(S.cat));
    if(!document.querySelector('.modal')) render();
    if(!silent) toast('Types de rapports actualisés.', 'ok');
  }catch(e){ if(e.status !== 401) toast('Lecture du créateur de rapports impossible : ' + e.message, 'err'); }
}
function getDirty(){ try{ return JSON.parse(localStorage.getItem(LS_DIRTY) || '[]'); }catch(_){ return []; } }
function setDirty(q){ localStorage.setItem(LS_DIRTY, JSON.stringify(q)); updateSyncBadge(); }
function kindOf(table){ return Object.keys(TABLES).find(k => TABLES[k] === table); }
function applyItem(it){
  if(it.table === 'rpt_settings'){ if(it.op === 'upsert') S.settings[it.row.key] = it.row.value; return; }
  const list = S.cfg[kindOf(it.table)]; if(!list) return;
  if(it.op === 'upsert'){ const i = list.findIndex(x => x.id === it.row.id); if(i >= 0) list[i] = {...list[i], ...it.row}; else list.push({...it.row}); }
  else{ const i = list.findIndex(x => x.id === it.id); if(i >= 0) list.splice(i, 1); }
}
function cleanRow(row){ const r = {...row}; delete r.created_at; delete r.updated_at; return r; }
function updateSyncBadge(){
  const n = getDirty().length;
  if(!navigator.onLine) setSync('error', n ? `Hors ligne – ${n} modif. en attente` : 'Hors ligne');
  else if(n) setSync('pending', `${n} modif. en attente`);
  else setSync('ok', 'Synchronisé');
}
let pushing = false;
async function pushDirty(){
  if(pushing || !navigator.onLine || !S.session) return;
  pushing = true; let reload = false;
  try{
    let q = getDirty();
    while(q.length){
      const it = q[0];
      try{
        if(it.op === 'upsert'){
          const conflict = it.table === 'rpt_settings' ? 'key' : 'id';
          await api(`${it.table}?on_conflict=${conflict}`, {method:'POST', headers:{Prefer:'resolution=merge-duplicates,return=minimal'}, body: JSON.stringify(cleanRow(it.row))});
        }else{
          await api(`${it.table}?id=eq.${encodeURIComponent(it.id)}`, {method:'DELETE', headers:{Prefer:'return=minimal'}});
        }
      }catch(e){
        if(e.status === 0 || e.status === 401) break;
        toast('Modification refusée : ' + e.message, 'err'); reload = true;
      }
      q.shift(); setDirty(q);
    }
  }finally{ pushing = false; updateSyncBadge(); }
  if(reload) await loadConfig();
}
function enqueue(it){ applyItem(it); saveCache(); const q = getDirty(); q.push(it); setDirty(q); pushDirty(); }
function saveRow(kind, row){ enqueue({table:TABLES[kind], op:'upsert', row}); }
function deleteRow(kind, id){ enqueue({table:TABLES[kind], op:'delete', id}); }
function saveSetting(key, value){ enqueue({table:'rpt_settings', op:'upsert', row:{key, value}}); }
async function loadConfig(){
  if(!S.session || !navigator.onLine) return;
  setSync('pending', 'Synchronisation…');
  try{
    const [groups, rules, rounds, checkpoints, settings] = await Promise.all([
      api('rpt_recipient_groups?select=*&order=code'), api('rpt_mail_rules?select=*&order=sort,name'),
      api('rpt_rounds?select=*&order=name'), api('rpt_checkpoints?select=*&order=sort,label'), api('rpt_settings?select=key,value')]);
    S.cfg = {groups, rules, rounds, checkpoints};
    S.settings = Object.fromEntries((settings || []).map(r => [r.key, r.value ?? '']));
    getDirty().forEach(applyItem);
    saveCache(); updateSyncBadge();
    if(!document.querySelector('.modal')) render();
  }catch(e){
    if(e.status === 0) updateSyncBadge();
    else if(e.status !== 401){ setSync('error', 'Erreur de synchronisation'); toast(e.message, 'err'); }
  }
}

let modalSave = null;
function openModal({title, body, onSave, saveLabel = 'Enregistrer', wide = false}){
  modalSave = onSave;
  document.getElementById('modal-root').innerHTML = `
  <div class="modal-back" onclick="if(event.target===this)closeModal()">
    <div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="x" onclick="closeModal()" aria-label="Fermer">×</button></div>
      <div class="modal-body" id="modal-body">${body}</div>
      <div class="modal-err" id="modal-err" role="alert"></div>
      <div class="modal-foot"><button class="btn ghost" onclick="closeModal()">Annuler</button>
        ${onSave ? `<button class="btn primary" id="modal-save" onclick="runModalSave()">${esc(saveLabel)}</button>` : ''}</div>
    </div>
  </div>`;
  const first = document.querySelector('#modal-body input:not([type=checkbox]):not([type=radio]):not([readonly]), #modal-body select, #modal-body textarea');
  if(first) first.focus();

async function runModalSave(){
  const btn = document.getElementById('modal-save');
  try{ btn.disabled = true; const r = await modalSave(); if(r !== false){ closeModal(); render(); } }
  catch(e){ modalErr(e.message); }
  finally{ const b = document.getElementById('modal-save'); if(b) b.disabled = false; }
}
function modalErr(m){ const e = document.getElementById('modal-err'); if(e) e.textContent = m; }
function closeModal(){ document.getElementById('modal-root').innerHTML = ''; modalSave = null; }
function closeDrawer(){ document.getElementById('drawer-root').innerHTML = ''; }
function val(id){ const el = document.getElementById(id); if(!el) return ''; return el.type === 'checkbox' ? el.checked : el.value.trim(); }
function fld(id, label, input, hint){ return `<label class="field" for="${id}"><span>${esc(label)}${hint ? ` <small>${esc(hint)}</small>` : ''}</span>${input}</label>`; }
function inp(id, value, attrs = ''){ const cls = /\bclass=/.test(attrs) ? '' : 'class="inp" '; return `<input ${cls}id="${id}" value="${esc(value ?? '')}" ${attrs}>`; }
function chk(id, label, checked, attrs = ''){ return `<label class="check"><input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${attrs}> <span>${esc(label)}</span></label>`; }
function sel(id, options, value, attrs = ''){

}
function typeOptions(extraIds = []){
  const ids = new Set(S.cat.types.map(t => t.id));
  const missing = [...new Set(extraIds)].filter(id => id && !ids.has(id)).map(id => {
    const r = S.cfg.rules.find(x => x.rapport_type_id === id);
    return [id, `${r?.rapport_type_nom || 'Type'} (introuvable dans le créateur)`];
  });
  return [...S.cat.types.map(t => [t.id, `${t.icone ? t.icone + ' ' : ''}${t.nom}${t.actif === false ? ' (inactif)' : ''}`]), ...missing];
}
function siteLocked(){ return (S.cat.site_lock || []).length === 1 && S.cat.sites.length === 1; }
function siteOptions(allLabel){ return siteLocked() ? S.cat.sites.map(s => [s.id, s.nom]) : [['', allLabel], ...S.cat.sites.map(s => [s.id, s.nom])]; }
function catalogNotice(){
  if(S.cat.loaded_at) return '';
  return `<div class="banner info"><div>Les types de rapports du créateur n’ont pas encore été chargés.</div><button class="btn sm" onclick="loadCatalog()">Charger</button></div>`;

function configIssues(){
  const out = [], st = S.settings, gm = groupMap();
  const testOn = st.test_mode !== 'false';
  if(!st.sender) out.push({level:'error', text:'Aucun expéditeur défini : aucun mail ne peut partir.', view:'settings'});
  if(testOn && !splitEmails(st.test_recipients).some(isEmail)) out.push({level:'error', text:'Mode test actif sans adresse de test : les mails sont bloqués.', view:'settings'});
  if(!splitEmails(st.alert_email).some(isEmail)) out.push({level:'warn', text:'Aucune adresse d’alerte : un échec d’envoi ne sera signalé que dans le journal.', view:'settings'});
  if(/\[[^\]]*compl[ée]ter[^\]]*\]/i.test(st.lpd_footer || '')) out.push({level:'warn', text:'La mention LPD contient encore des éléments à compléter.', view:'settings'});
  for(const g of S.cfg.groups) if(g.active !== false && !(g.emails || []).some(isEmail)) out.push({level:'warn', text:`Le groupe « ${g.name} » n’a aucune adresse valide.`, view:'groups'});
  for(const r of S.cfg.rules){
    if(!r.active) continue;
    if(!recipientsFor(r, gm).length) out.push({level:'error', text:`La règle « ${r.name} » (${r.rapport_type_nom || '?'}) n’a aucun destinataire.`, view:'rules'});
    if(S.cat.loaded_at){
      const t = typeById(r.rapport_type_id);
      if(!t) out.push({level:'error', text:`La règle « ${r.name} » vise un type de rapport supprimé du créateur.`, view:'rules'});
      else if(t.actif === false) out.push({level:'warn', text:`La règle « ${r.name} » vise le type « ${t.nom} », inactif dans le créateur.`, view:'rules'});
      if(r.trigger_mode === 'conditions' && (r.conditions || []).some(c => condBroken(c, r.rapport_type_id)))
        out.push({level:'error', text:`La règle « ${r.name} » utilise une question qui n’existe plus dans le créateur.`, view:'rules'});
    }
  }
  return out;
}

AFTER.dash = async () => {
  if(!navigator.onLine) return;
  const since = new Date(Date.now() - 7 * 864e5).toISOString();
  try{
    const [disp, logs] = await Promise.all([
      api(`rpt_dispatched?select=report_id,dispatched_at,rules_matched&dispatched_at=gte.${since}&limit=10000`),
      api(`rpt_mail_log?select=id,status,created_at,subject,error,report_id,rule_id,rule_name,site_nom&created_at=gte.${since}&order=created_at.desc&limit=10000`)]);
    S.logs = logs; renderNav();
    const d1 = Date.now() - 864e5;
    const k = [
      [disp.filter(r => new Date(r.dispatched_at) > d1).length, 'Rapports traités – 24 h'],
      [disp.length, 'Rapports traités – 7 jours'],
      [logs.filter(l => ['sent','test_redirected'].includes(l.status) && new Date(l.created_at) > d1).length, 'Mails envoyés – 24 h'],
      [logs.filter(l => l.status === 'failed').length, 'Échecs – 7 jours', true]];
    const el = document.getElementById('dash-kpis');
    if(el) el.innerHTML = k.map(x => `<div class="kpi"><div class="v ${x[2] && x[0] ? 'red' : ''}">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');
    const fails = logs.filter(l => l.status === 'failed').slice(0, 8);
    const fe = document.getElementById('dash-fails');
    if(fe) fe.innerHTML = fails.length ? fails.map(l => `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
        <div style="font-weight:600">${esc(l.rule_name || 'Envoi')}${l.site_nom ? ` <span class="muted" style="font-weight:400">– ${esc(l.site_nom)}</span>` : ''}</div>
        <div class="muted" style="font-size:12px">${esc(fmtDateTime(l.created_at))} – ${esc(short(l.error || '', 120))}</div>
        ${l.report_id && l.rule_id ? `<button class="btn sm" style="margin-top:6px" onclick="retryLog('${l.id}')">Relancer</button>` : ''}</div>`).join('')
      : '<p class="ok-line">Aucun échec sur sept jours.</p>';
  }catch(e){ if(e.status !== 401) toast(e.message, 'err'); }
};

async function loadReports(){

function condText(c){
  const v = (c.values || []).map(x => `« ${esc(short(x, 70))} »`).join(' ou ');
  const q = `« ${esc(short(c.libelle || '?', 80))} »`;
  if(c.type === 'checked') return v ? `<b>${v}</b> est coché` : `<b>${q}</b> est coché`;
  if(c.type === 'equals') return `<b>${q}</b> vaut ${v}`;
  if(c.type === 'filled') return `<b>${q}</b> a une réponse`;
  return 'condition inconnue';
}
function ruleSentence(r){
  if(r.trigger_mode === 'always') return 'Part à <b>chaque rapport</b> clôturé.';
  const parts = (r.conditions || []).map(condText);
  return parts.length ? 'Part si ' + parts.join(r.match_mode === 'all' ? ' <i>et</i> ' : ' <i>ou</i> ') + '.' : 'Aucune condition : cette règle ne part jamais.';
}

  if(!c.parent_id) return true;
  const p = byId.get(c.parent_id); if(!p || guard > 20) return true;

  if(p.type === 'case' && !popts.length) return cond === 'non' ? v !== true : v === true;
  if(!cond) return !(v === undefined || v === null || v === '' || v === false || (Array.isArray(v) && !v.length));
  if(Array.isArray(v)) return v.includes(cond);

  el.innerHTML = `<h2>${hit.length} mail(s) partiraient</h2>

    ${testMode ? `<div class="banner warn" style="margin-bottom:12px"><div>Mode test : ces mails iraient à ${testTo.length ? esc(testTo.join(', ')) : '<b>aucune adresse de test</b> (ils seraient bloqués)'}, pas aux destinataires ci-dessous.</div></div>` : ''}
    ${missing.length ? `<div class="banner info" style="margin-bottom:12px"><div>Questions obligatoires sans réponse : ${missing.map(esc).join(', ')}.</div></div>` : ''}
    ${hit.map(r => { const to = recipientsFor(r, gm); const subj = (testMode ? '[TEST] ' : '') + (renderSubject(r.subject_template, a, sys, sep) || e.activite);
      return `<div class="sim-mail"><div class="n">${esc(r.name)}</div><span class="subject">${esc(subj)}</span><div class="to">À : ${to.length ? esc(to.join(', ')) : '<span class="badge b-red">aucun destinataire</span>'}</div></div>`; }).join('')}
    ${miss.length ? `<h3 style="margin:14px 0 8px;font-size:13px;color:var(--text2)">Ne partiraient pas</h3>${miss.map(r => `<div class="sim-mail skip"><div class="n">${esc(r.name)}</div><div style="font-size:12px">${ruleSentence(r)}</div></div>`).join('')}` : ''}
    ${otherSite.length ? `<p class="muted" style="font-size:12px;margin-top:10px">${otherSite.length} règle(s) réservée(s) à un autre site ne sont pas prises en compte.</p>` : ''}`;
}

// ════════════════════════════════════════════════════════
//  VIEW: CHECKPOINTS (QR / NFC)
// ════════════════════════════════════════════════════════
function randCode(n){ const a = new Uint32Array(n); crypto.getRandomValues(a); return Array.from(a, x => CODE_ALPHABET[x % CODE_ALPHABET.length]).join(''); }
function newCodes(){
  let code, shortCode;
  do{ code = 'RDZCP-' + randCode(12); }while(S.cfg.checkpoints.some(c => c.code === code));
  do{ shortCode = randCode(6); }while(S.cfg.checkpoints.some(c => c.short_code === shortCode));
  return {code, short_code:shortCode};
}
function pointSites(){
  const list = S.cat.sites.map(s => ({id:s.id, nom:s.nom}));
  for(const r of [...S.cfg.rounds, ...S.cfg.checkpoints]) if(r.site_id && !list.some(s => s.id === r.site_id)) list.push({id:r.site_id, nom:r.site_nom || 'Site'});
  return list.sort((a, b) => a.nom.localeCompare(b.nom, 'fr'));
}
RENDER.points = () => {
  const head = `<div class="page-head"><h1>Points de ronde</h1><p class="sub">Chaque point a un QR code à coller sur place et un code court de secours. Les puces NFC déjà posées peuvent être associées au même point.</p></div>`;
  const sites = pointSites();
  if(!sites.length) return head + catalogNotice() + box('Aucun site chargé depuis RDZ Agent.');
  if(!sites.some(s => s.id === S.ui.pointSiteId)) S.ui.pointSiteId = sites[0].id;
  const sid = S.ui.pointSiteId, rounds = S.cfg.rounds.filter(r => r.site_id === sid).sort(bySort);
  if(S.ui.pointRound !== 'all' && S.ui.pointRound !== 'none' && !round(S.ui.pointRound)) S.ui.pointRound = 'all';
  const cps = visibleCheckpoints();
  return head + `<div class="toolbar"><label class="field" style="min-width:220px"><span>Site</span>${sel('pt-site', sites.map(s => [s.id, s.nom]), sid, 'onchange="S.ui.pointSiteId=this.value;S.ui.pointRound=\'all\';render()"')}</label>
    <div class="grow"></div><button class="btn" onclick="editRound(null)">Ajouter une ronde</button></div>
  <div class="round-list">
    <button class="round-pill ${S.ui.pointRound === 'all' ? 'active' : ''}" onclick="S.ui.pointRound='all';render()">Tous les points</button>
    ${rounds.map(r => `<button class="round-pill ${S.ui.pointRound === r.id ? 'active' : ''}" onclick="S.ui.pointRound='${r.id}';render()">${esc(r.name)}${r.active ? '' : ' (inactive)'}</button>`).join('')}
    <button class="round-pill ${S.ui.pointRound === 'none' ? 'active' : ''}" onclick="S.ui.pointRound='none';render()">Hors ronde</button>
  </div>
  ${round(S.ui.pointRound) ? roundPanel(round(S.ui.pointRound)) : ''}
  <div class="toolbar"><div class="grow muted">${cps.length} point(s)</div>
    <button class="btn" ${cps.length ? '' : 'disabled'} onclick="printLabels()">Imprimer les étiquettes</button>
    <button class="btn primary" onclick="editCheckpoint(null)">Ajouter un point</button></div>
  ${cps.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ordre</th><th>Point</th><th>Contrôle attendu</th><th>Code court</th><th>Puce NFC</th><th></th></tr></thead><tbody>
  ${cps.map((c, i) => `<tr><td style="white-space:nowrap"><span class="num">${i + 1}</span>
      <button class="btn sm ghost" aria-label="Monter" ${i === 0 ? 'disabled' : ''} onclick="moveCheckpoint('${c.id}',-1)">↑</button><button class="btn sm ghost" aria-label="Descendre" ${i === cps.length - 1 ? 'disabled' : ''} onclick="moveCheckpoint('${c.id}',1)">↓</button></td>
    <td><b>${esc(c.label)}</b> ${c.active ? '' : '<span class="badge b-grey">Inactif</span>'}<div class="muted" style="font-size:12px">${esc(round(c.round_id)?.name || 'Hors ronde')}</div></td>
    <td class="wrap">${esc(c.expected_check || '')}</td><td class="code-cell">${esc(c.short_code)}</td><td class="num">${esc(c.nfc_uid || '—')}</td>
    <td style="white-space:nowrap"><button class="btn sm ghost" onclick="editCheckpoint('${c.id}')">Modifier</button><button class="btn sm ghost danger" onclick="removeCheckpoint('${c.id}')">Supprimer</button></td></tr>`).join('')}
  </tbody></table></div>` : `<div class="empty"><p>Aucun point pour ce filtre.</p><button class="btn primary" onclick="editCheckpoint(null)">Ajouter un point</button></div>`}`;
};
function visibleCheckpoints(){
  const sid = S.ui.pointSiteId, r = S.ui.pointRound;
  return S.cfg.checkpoints.filter(c => c.site_id === sid && (r === 'all' || (r === 'none' ? !c.round_id : c.round_id === r))).sort(bySort);
}
function roundPanel(r){
  const t = x => x ? String(x).slice(0, 5) : '—';
  return `<div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap">
    <div><h3>${esc(r.name)}</h3><p class="muted" style="font-size:12.5px;margin-top:4px">Départ ${t(r.start_time)} – plage ${t(r.window_start)} à ${t(r.window_end)} – durée prévue ${r.duration_min ?? '—'} min – tolérance ${r.tolerance_min ?? 0} min – ${r.enforce_order ? 'ordre imposé' : 'ordre libre'}</p></div>
    <div><button class="btn sm" onclick="editRound('${r.id}')">Modifier la ronde</button> <button class="btn sm ghost danger" onclick="removeRound('${r.id}')">Supprimer</button></div></div></div>`;
}
function currentSiteName(){ return pointSites().find(s => s.id === S.ui.pointSiteId)?.nom || ''; }
function editRound(id){
  const r = id ? round(id) : {id:uid(), site_id:S.ui.pointSiteId, site_nom:currentSiteName(), name:'', start_time:null, window_start:null, window_end:null, duration_min:null, tolerance_min:10, enforce_order:true, active:true};
  const t = x => x ? String(x).slice(0, 5) : '';
  openModal({title: id ? 'Modifier la ronde' : 'Nouvelle ronde', body: `
    ${fld('rn-name', 'Nom', inp('rn-name', r.name, 'maxlength="80" placeholder="ex. Ronde EPI – Bâtiment B1"'))}
    <div class="grid-form">
      ${fld('rn-start', 'Heure de départ', inp('rn-start', t(r.start_time), 'type="time"'))}
      ${fld('rn-ws', 'Plage : début', inp('rn-ws', t(r.window_start), 'type="time"'))}
      ${fld('rn-we', 'Plage : fin', inp('rn-we', t(r.window_end), 'type="time"'))}
      ${fld('rn-dur', 'Durée prévue (min)', inp('rn-dur', r.duration_min ?? '', 'type="number" min="1"'))}
      ${fld('rn-tol', 'Tolérance (min)', inp('rn-tol', r.tolerance_min ?? 10, 'type="number" min="0"'))}
    </div>
    ${chk('rn-order', 'Ordre de passage imposé', r.enforce_order)}${chk('rn-active', 'Ronde active', r.active)}`,
    onSave: () => {
      const name = val('rn-name'); if(!name) throw new Error('Le nom est obligatoire.');
      const num = x => x === '' ? null : parseInt(x, 10);
      saveRow('rounds', {...r, name, start_time: val('rn-start') || null, window_start: val('rn-ws') || null, window_end: val('rn-we') || null,
        duration_min: num(val('rn-dur')), tolerance_min: num(val('rn-tol')) ?? 0, enforce_order: val('rn-order'), active: val('rn-active')});
      if(!id) S.ui.pointRound = r.id;
      toast('Ronde enregistrée.', 'ok');
    }});
}
function removeRound(id){
  const r = round(id); if(!r) return;
  const n = S.cfg.checkpoints.filter(c => c.round_id === id).length;
  if(!confirm(`Supprimer la ronde « ${r.name} » ?${n ? ` Ses ${n} point(s) seront conservés, hors ronde.` : ''}`)) return;
  for(const c of S.cfg.checkpoints.filter(c => c.round_id === id)) saveRow('checkpoints', {...c, round_id:null});
  deleteRow('rounds', id); S.ui.pointRound = 'all'; render();
}
function editCheckpoint(id){
  const sid = S.ui.pointSiteId, pre = round(S.ui.pointRound);
  const maxSort = Math.max(0, ...S.cfg.checkpoints.filter(c => c.site_id === sid).map(c => c.sort || 0));
  const c = id ? S.cfg.checkpoints.find(x => x.id === id) : {id:uid(), site_id:sid, site_nom:currentSiteName(), round_id:pre?.id || null, ...newCodes(),
    nfc_uid:null, label:'', expected_check:'', sort:maxSort + 10, active:true};
  const roundOpts = [['', 'Hors ronde'], ...S.cfg.rounds.filter(r => r.site_id === sid).sort(bySort).map(r => [r.id, r.name])];
  openModal({title: id ? 'Modifier le point' : 'Nouveau point de ronde', body: `
    ${fld('cp-label', 'Emplacement', inp('cp-label', c.label, 'maxlength="140" placeholder="ex. RI entrée ambulance"'))}
    ${fld('cp-check', 'Contrôle attendu', `<textarea class="inp" id="cp-check" rows="2" placeholder="ex. Matériel incendie, aucun point chaud">${esc(c.expected_check || '')}</textarea>`)}
    ${fld('cp-round', 'Ronde', sel('cp-round', roundOpts, c.round_id))}
    ${fld('cp-nfc', 'Puce NFC associée', `<div style="display:flex;gap:8px">${inp('cp-nfc', c.nfc_uid || '', 'class="inp mono" placeholder="ex. 04562BD22F4C80"')}<button type="button" class="btn" onclick="readNfcInto('cp-nfc')">Lire la puce</button></div>`, 'facultatif, Chrome Android')}
    <div class="panel" style="margin:0;padding:12px 14px;background:#fafafb;box-shadow:none">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
        <div><div class="muted" style="font-size:12px">Code court de secours</div><div class="code-cell" id="cp-short" style="font-size:18px">${esc(c.short_code)}</div><div class="muted mono" id="cp-code" style="font-size:11px">${esc(c.code)}</div></div>
        ${id ? `<button type="button" class="btn sm ghost danger" onclick="regenCodes()">Générer un nouveau code</button>` : ''}
      </div></div>
    ${chk('cp-active', 'Point actif', c.active)}`,
    onSave: () => {
      const label = val('cp-label'); if(!label) throw new Error('L’emplacement est obligatoire.');
      const nfc = val('cp-nfc').replace(/[:\s-]/g, '').toUpperCase() || null;
      if(nfc && S.cfg.checkpoints.some(x => x.nfc_uid === nfc && x.id !== c.id)) throw new Error('Cette puce NFC est déjà associée à un autre point.');
      const codes = {code: document.getElementById('cp-code').textContent, short_code: document.getElementById('cp-short').textContent};
      saveRow('checkpoints', {...c, ...codes, label, expected_check: val('cp-check') || null, round_id: val('cp-round') || null, nfc_uid: nfc, active: val('cp-active')});
      toast(codes.code !== c.code ? 'Point enregistré. Réimprimez son étiquette : l’ancienne n’est plus valable.' : 'Point enregistré.', 'ok');
    }});
}
function regenCodes(){
  if(!confirm('L’étiquette déjà collée ne fonctionnera plus. Générer un nouveau code ?')) return;
  const n = newCodes();
  document.getElementById('cp-code').textContent = n.code;
  document.getElementById('cp-short').textContent = n.short_code;
}
function removeCheckpoint(id){
  const c = S.cfg.checkpoints.find(x => x.id === id); if(!c) return;
  if(!confirm(`Supprimer le point « ${c.label} » ? Son étiquette ne sera plus reconnue.`)) return;
  deleteRow('checkpoints', id); render();
}
function moveCheckpoint(id, dir){
  const list = visibleCheckpoints(), i = list.findIndex(c => c.id === id), j = i + dir;
  if(i < 0 || j < 0 || j >= list.length) return;
  const order = list.map((c, k) => (k + 1) * 10);
  [order[i], order[j]] = [order[j], order[i]];
  list.forEach((c, k) => { if(c.sort !== order[k]) saveRow('checkpoints', {...c, sort:order[k]}); });
  render();
}
async function readNfcInto(inputId){
  if(!('NDEFReader' in window)){ toast('La lecture NFC fonctionne uniquement avec Chrome sur Android.', 'err'); return; }
  try{
    const reader = new NDEFReader(), ctrl = new AbortController();
    await reader.scan({signal:ctrl.signal});
    toast('Approchez la puce du téléphone…');
    reader.onreading = e => { const el = document.getElementById(inputId); if(el) el.value = String(e.serialNumber || '').replace(/:/g, '').toUpperCase(); ctrl.abort(); toast('Puce lue.', 'ok'); };
    reader.onreadingerror = () => toast('Puce illisible, réessayez.', 'err');
    setTimeout(() => ctrl.abort(), 20000);
  }catch(e){ toast('Lecture NFC impossible : ' + e.message, 'err'); }
}
function printLabels(){
  if(typeof qrcode !== 'function'){ toast('Le générateur de QR code n’est pas chargé. Reconnectez-vous à internet puis rechargez la page.', 'err'); return; }
  const list = visibleCheckpoints().filter(c => c.active);
  if(!list.length){ toast('Aucun point actif à imprimer.', 'err'); return; }
  const siteName = currentSiteName();
  const labels = list.map(c => {
    const q = qrcode(0, 'M'); q.addData(c.code); q.make();
    return `<div class="lbl"><div class="qr">${q.createSvgTag(4, 2)}</div><div class="t">
      <div class="s">RDZ Security – ${esc(siteName)}</div><div class="n">${esc(c.label)}</div>
      <div class="r">${esc(round(c.round_id)?.name || '')}</div><div class="c">${esc(c.short_code)}</div></div></div>`;
  }).join('');
  const w = window.open('', '_blank');
  if(!w){ toast('Autorisez les fenêtres pop-up pour imprimer les étiquettes.', 'err'); return; }
  w.document.write(`<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Étiquettes – ${esc(siteName)}</title>
  <style>@page{size:A4;margin:10mm}body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#2d2d2d}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4mm}
  .lbl{display:flex;gap:4mm;align-items:center;border:1px dashed #9ca3af;border-left:3mm solid #c0272d;border-radius:2mm;padding:3mm;height:42mm;page-break-inside:avoid}
  .qr svg{width:34mm;height:34mm;display:block}.t{min-width:0}.s{font-size:8pt;color:#6b7280}
  .n{font-size:11pt;font-weight:700;margin:1mm 0;line-height:1.2}.r{font-size:8pt;color:#6b7280}
  .c{font-family:'Courier New',monospace;font-size:16pt;font-weight:700;letter-spacing:1px;margin-top:2mm}</style></head>
  <body><div class="grid">${labels}</div><script>window.onload=function(){setTimeout(function(){window.print();},300);};<\/script></body></html>`);
  w.document.close();
}

// ════════════════════════════════════════════════════════
RENDER.settings = () => {
  const st = S.settings, testOn = st.test_mode !== 'false';
  return `<div class="page-head"><h1>Paramètres</h1><p class="sub">Expéditeur, mode test, alertes et mention de protection des données ajoutée à chaque mail.</p></div>
  ${(S.cat.site_lock || []).length ? `<div class="banner info"><div>Module dédié au site : <b>${esc(S.cat.sites.map(s => s.nom).join(', ') || '—')}</b>. Seuls les rapports, types de rapports et règles de ce site sont accessibles.</div></div>` : ''}
  <section class="panel"><h2>Mode test</h2>
    <label class="check" style="font-size:14px"><input type="checkbox" id="st-test" ${testOn ? 'checked' : ''}> <span><b>Mode test actif</b> : tous les mails partent vers les adresses de test, avec [TEST] dans l’objet. Les destinataires réels sont indiqués dans le mail.</span></label>
    <div style="margin-top:12px">${fld('st-testto', 'Adresses de test', inp('st-testto', st.test_recipients || '', 'placeholder="ex. g.girard@rdz-security-management.ch"'), 'séparées par des virgules')}</div>
  </section>
  <section class="panel"><h2>Expéditeur et alertes</h2><div class="grid-form">
    ${fld('st-sender', 'Expéditeur', inp('st-sender', st.sender || '', 'placeholder="Nom <adresse@domaine>"'), 'domaine vérifié dans Resend')}
    ${fld('st-reply', 'Adresse de réponse', inp('st-reply', st.reply_to || ''))}
    ${fld('st-alert', 'Alerte en cas d’échec', inp('st-alert', st.alert_email || ''), 'séparées par des virgules')}
    ${fld('st-sep', 'Séparateur entre deux réponses dans l’objet', inp('st-sep', st.subject_separator ?? ' - ', 'class="inp mono"'))}
  </div>
  <div style="margin-top:14px">${fld('st-photo', 'Texte quand les photos ne sont pas encore arrivées', inp('st-photo', st.photo_note || ''))}</div></section>
  <section class="panel"><h2>Mention protection des données (LPD)</h2>
    <textarea class="inp" id="st-lpd" rows="6">${esc(st.lpd_footer || '')}</textarea>
    <p class="muted" style="font-size:12px;margin-top:6px">Ajoutée telle quelle en pied de chaque mail.</p>
  </section>
  <div style="display:flex;justify-content:flex-end;margin-bottom:18px"><button class="btn primary" onclick="saveSettings()">Enregistrer les paramètres</button></div>
  <section class="panel"><h2>Vérifier l’envoi</h2><p class="muted" style="margin-bottom:10px">Envoie un mail simple avec l’expéditeur enregistré, pour contrôler la configuration Resend.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${inp('st-testmail', S.session?.email || '', 'type="email" style="max-width:320px"')}<button class="btn" onclick="sendTestMail()">Envoyer un mail de test</button></div></section>
  <section class="panel"><h2>Historique des modifications</h2><div id="audit"><p class="muted">${navigator.onLine ? 'Chargement…' : 'Disponible en ligne.'}</p></div></section>`;
};
AFTER.settings = async () => {
  if(!navigator.onLine) return;
  try{
    const rows = await api('rpt_audit_log?select=at,user_id,action,table_name,row_id&order=at.desc&limit=40');
    const ids = [...new Set(rows.map(r => r.user_id).filter(Boolean))];
    const names = ids.length ? Object.fromEntries((await api(`profiles?id=in.(${ids.join(',')})&select=id,full_name`)).map(p => [p.id, p.full_name])) : {};
    const T = {rpt_recipient_groups:'Groupe', rpt_mail_rules:'Règle', rpt_rounds:'Ronde', rpt_checkpoints:'Point de ronde', rpt_settings:'Paramètre', journal_entrees:'Rapport'};
    const A = {insert:'création', update:'modification', delete:'suppression', view:'consultation'};
    const el = document.getElementById('audit');
    if(el) el.innerHTML = rows.length ? `<div class="tbl-wrap" style="box-shadow:none"><table class="tbl"><thead><tr><th>Date</th><th>Par</th><th>Action</th><th>Élément</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="num">${esc(fmtDateTime(r.at))}</td><td>${esc(names[r.user_id] || (r.user_id ? 'Utilisateur' : 'Système'))}</td><td>${esc(A[r.action] || r.action)}</td><td>${esc(T[r.table_name] || r.table_name)} <span class="muted mono" style="font-size:11px">${esc(short(r.row_id, 14))}</span></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">Aucune modification enregistrée.</p>';
  }catch(e){ const el = document.getElementById('audit'); if(el && e.status !== 401) el.innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
};
function saveSettings(){
  const testOn = val('st-test'), testTo = splitEmails(val('st-testto')), alert = splitEmails(val('st-alert'));
  const bad = [...testTo, ...alert].filter(e => !isEmail(e));
  if(bad.length){ toast('Adresse invalide : ' + bad.join(', '), 'err'); return; }
  const sender = val('st-sender');
  if(sender && !/^[^<>]*<[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+>$|^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(sender)){ toast('Expéditeur invalide. Format attendu : Nom <adresse@domaine>.', 'err'); return; }
  const reply = val('st-reply');
  if(reply && !isEmail(reply)){ toast('Adresse de réponse invalide.', 'err'); return; }
  if(!testOn && S.settings.test_mode !== 'false' &&
     !confirm('Désactiver le mode test ? Les mails partiront immédiatement aux vrais destinataires (clients, prestataires). Faites-le seulement après la recette signée par le client.')) return;
  const sepEl = document.getElementById('st-sep');
  const changes = {test_mode: testOn ? 'true' : 'false', test_recipients: testTo.join(', '), sender, reply_to: reply,
    alert_email: alert.join(', '), subject_separator: sepEl ? sepEl.value : ' - ', photo_note: val('st-photo'), lpd_footer: val('st-lpd')};
  for(const [k, v] of Object.entries(changes)) if((S.settings[k] ?? '') !== v) saveSetting(k, v);
  toast('Paramètres enregistrés.', 'ok'); render();
}
async function sendTestMail(){
  const to = val('st-testmail');
  if(!isEmail(to)){ toast('Adresse de test invalide.', 'err'); return; }
  if(getDirty().some(i => i.table === 'rpt_settings')){ toast('Enregistrez et synchronisez d’abord les paramètres.', 'err'); return; }
  try{ await callFn({action:'test', to}); toast('Mail de test envoyé à ' + to + '.', 'ok'); }
  catch(e){ toast('Échec : ' + e.message, 'err'); }
}

boot();
